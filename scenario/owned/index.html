<main><div class="wrap">
<div class="hero">
<h2>LIBRARY</h2>
<p>所持しているTRPGシナリオの公開用一覧です。</p>
</div>

<section>
<div class="library-tools">
<input id="librarySearch" type="search" placeholder="シナリオ名・作者・システムで検索">
<select id="librarySystem"><option value="">すべてのシステム</option></select>
</div>
<div id="librarySummary" class="muted"></div>
<div id="libraryList" class="library-list"></div>
</section>
</div></main>

<footer class="footer"><div class="wrap">© <span data-year></span> 39*2</div></footer>
<script src="../../assets/js/main.js"></script>
<script src="../../assets/data/owned-scenarios.js"></script>
<script>
(function(){
const data=Array.isArray(window.OWNED_SCENARIOS)?window.OWNED_SCENARIOS:[];
const q=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const systems=[...new Set(data.map(x=>x.system).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ja"));
q("librarySystem").innerHTML='<option value="">すべてのシステム</option>'+systems.map(x=>`<option>${esc(x)}</option>`).join("");

function render(){
 const term=q("librarySearch").value.trim().toLowerCase();
 const sys=q("librarySystem").value;
 const list=data.filter(x=>{
   if(sys && x.system!==sys) return false;
   const hay=[x.title,x.system,x.author].join(" ").toLowerCase();
   return !term || hay.includes(term);
 });
 q("librarySummary").textContent=`所持 ${data.length}件 ／ 表示 ${list.length}件`;
 q("libraryList").innerHTML=list.length?list.map(x=>`
 <article class="card library-item">
   <h3>${esc(x.title||"名称未設定")}</h3>
   <div class="library-meta">
     ${x.system?`<span class="badge">${esc(x.system)}</span>`:""}
     ${x.author?`<span class="badge">${esc(x.author)}</span>`:""}
   </div>
   ${x.url?`<div><a class="link" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">配布・販売ページ</a></div>`:""}
 </article>`).join(""):'<div class="empty">まだ公開用シナリオが登録されていません。</div>';
}
q("librarySearch").addEventListener("input",render);
q("librarySystem").addEventListener("change",render);
render();
})();
</script>
