<style>
.kptest{max-width:1320px;margin:0 auto;padding:20px 18px 70px}.test-banner{position:sticky;top:0;z-index:20;padding:10px 12px;margin-bottom:12px;border:1px solid var(--accent);border-radius:10px;background:var(--panel);font-weight:700}.test-banner small{display:block;margin-top:3px;font-weight:400;color:var(--muted)}
.head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:14px}.head h1{margin:0}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;align-items:start}.side{position:sticky;top:76px;display:grid;gap:12px}.box{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px}.box h2,.box h3{margin:0 0 8px}.scene-list{display:grid;gap:6px}.scene-list button{text-align:left}.scene-list button.active{outline:2px solid var(--accent)}
.pdf-list{display:grid;gap:6px;max-height:45vh;overflow:auto}
.pdf-page-btn{width:100%;display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:8px 9px}
.pdf-page-btn.active{outline:2px solid var(--accent);outline-offset:-2px}
.pdf-current{margin-bottom:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}

.pdf-viewer{border-top:1px solid var(--line);padding:10px}
.pdf-viewer[hidden]{display:none}
.pdf-viewer-text{white-space:pre-wrap;line-height:1.7;max-height:310px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);user-select:text}
.pdf-viewer-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.pdf-viewer-actions button[disabled]{opacity:.5;cursor:not-allowed}
.editor{min-width:0}.scene-title{font-size:22px;font-weight:800;margin:0 0 8px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.stat{padding:5px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px;background:var(--panel)}.manuscript{display:grid;gap:10px}.block{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:11px}.block-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.kind{font-size:12px;font-weight:800;padding:3px 7px;border:1px solid var(--line);border-radius:999px}.block-title{font-weight:800}.body{line-height:1.8;min-height:24px}.body img{max-width:100%}.block.reveal,.block.secret{border-left:4px solid var(--accent)}.block.memo{border-style:dashed}.shared{font-size:12px;font-weight:700}.legacy-images{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.legacy-images img{width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}.addbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.addbar button{opacity:.75}.muted-note{font-size:12px;color:var(--muted)}
@media(max-width:820px){.layout{grid-template-columns:1fr}.side{position:static}.pdf-list{max-height:none}}

.edit-title{width:min(520px,100%);font:inherit;font-weight:800;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.edit-target{width:150px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.edit-body{min-height:90px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);line-height:1.75;outline:none}
.edit-body:focus{border-color:var(--accent)}
.block-tools{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.block-tools button{padding:5px 8px;font-size:12px}
.image-preview{max-width:100%;max-height:520px;display:block;margin:8px auto;border-radius:9px}
.copy-note{padding:7px 9px;border:1px dashed var(--line);border-radius:8px;font-size:12px;color:var(--muted);margin-bottom:10px}
.element-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.element-tools-label{font-size:12px;font-weight:700;margin-right:3px}
.element-tools button{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);font-size:12px;font-weight:600;cursor:pointer}
.element-tools button:hover{border-color:var(--accent)}
.element-tools button[data-add="normal"]{border-color:var(--accent)}
.element-sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.element-tools-help{font-size:11px;color:var(--muted);margin-left:auto}
.annotation-bar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:0 0 9px;padding:6px 7px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.018)}
.annotation-label{font-size:11px;font-weight:700;color:var(--muted);margin-right:2px;letter-spacing:.04em}
.annotation-bar button{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;font-size:12px;line-height:1;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}
.annotation-bar button:hover{border-color:var(--accent)}
.annotation-help{font-size:11px;color:var(--muted);margin-left:3px}
mark.kp-marker{padding:0 .08em;border-radius:3px}
.kp-sticky{position:relative;border-bottom:2px dotted currentColor;cursor:help}
.kp-sticky::after{content:"🗒";display:inline-block;font-size:.82em;vertical-align:super;margin-left:3px;line-height:1;filter:saturate(.8)}
.kp-sticky:hover::before{content:attr(data-note);position:absolute;left:0;bottom:calc(100% + 9px);z-index:50;width:max-content;max-width:min(360px,70vw);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);box-shadow:0 5px 18px rgba(0,0,0,.22);white-space:pre-wrap;font-size:12px;line-height:1.55}
mark.kp-marker .kp-sticky::after,.kp-sticky mark.kp-marker::after{filter:none}
.scene-row{display:flex;gap:5px;align-items:center}.scene-row>button:first-child{flex:1}

/* v10: 一本のシーン本文 */
.manuscript{padding:0}
.scene-sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.scene-sheet .copy-note{margin-bottom:12px}
.scene-annotation{position:sticky;top:6px;z-index:8;margin-bottom:14px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.manuscript-stream{max-width:900px;margin:0 auto}
.manu-item{position:relative;padding:13px 2px 15px;border-bottom:1px dashed var(--line)}
.manu-item:last-child{border-bottom:0}
.manu-head{display:flex;align-items:center;gap:8px;min-height:26px;margin-bottom:4px}
.manu-label{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.manu-title{flex:1;min-width:140px;border:0!important;border-bottom:1px solid transparent!important;border-radius:0!important;background:transparent!important;padding:3px 2px!important;font-weight:700}
.manu-title:focus{border-bottom-color:var(--accent)!important;outline:none}
.manu-target{width:130px;border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;background:transparent!important;padding:3px 2px!important;font-size:12px}
.manu-tools{display:flex;gap:3px;opacity:.22;transition:opacity .15s}
.manu-item:hover .manu-tools,.manu-item:focus-within .manu-tools{opacity:1}
.manu-tools button{padding:3px 6px;font-size:11px}
.manu-body{min-height:34px;padding:5px 7px;border:1px solid transparent;border-radius:6px;background:transparent;line-height:1.8;outline:none}
.manu-body:hover{background:rgba(255,255,255,.012)}
.manu-body:focus{border-color:var(--line);background:var(--bg)}
.manu-item.heading{padding-top:18px}
.manu-item.heading .manu-label{font-size:14px;color:var(--text)}
.manu-item.heading .manu-title{font-size:16px}
.manu-item.memo{border-left:3px solid var(--line);padding-left:10px}
.manu-item.rp{border-left:3px dotted var(--line);padding-left:10px}
.manu-item.reveal,.manu-item.secret{padding-left:10px}
.manu-item.reveal{border-left:3px solid var(--accent)}
.manu-item.secret{border-left:3px double var(--line)}
.reveal-action{margin-top:7px;padding-left:7px}
.reveal-action button{padding:5px 9px;font-size:12px}
.manu-image{margin:4px 0 2px;text-align:center}
.manu-image img{max-width:100%;max-height:520px;border-radius:8px}
.manu-image-actions{display:flex;justify-content:center;gap:6px;margin-top:6px}
.manu-image-actions button{padding:5px 8px;font-size:12px}
.element-tools{max-width:900px;margin:14px auto 0}
.element-tools button[data-add="normal"]{border-color:var(--line)}

}


/* v11: ブログ型リッチテキスト */
.blog-shell{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:visible}
.blog-note{padding:8px 10px;border-bottom:1px dashed var(--line);font-size:12px;color:var(--muted)}
.rich-toolbar{position:sticky;top:6px;z-index:12;display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:8px;border-bottom:1px solid var(--line);background:var(--panel);box-shadow:0 3px 14px rgba(0,0,0,.08)}
.rich-toolbar .tb-group{display:flex;gap:4px;align-items:center;padding-right:6px;margin-right:1px;border-right:1px solid var(--line)}
.rich-toolbar .tb-group:last-child{border-right:0}
.rich-toolbar button,.rich-toolbar select{min-height:30px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px}
.rich-toolbar button:hover{border-color:var(--accent)}
.rich-toolbar input[type="color"]{width:32px;height:30px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.rich-toolbar .tb-label{font-size:11px;color:var(--muted);font-weight:700}
.blog-editor{min-height:560px;padding:24px 26px;background:var(--bg);line-height:1.85;outline:none;font-size:15px}

.blog-editor h2{font-size:24px;margin:1.4em 0 .55em}
.blog-editor h3{font-size:19px;margin:1.25em 0 .45em}
.blog-editor p{margin:.7em 0}
.blog-editor blockquote{margin:1em 0;padding:.35em 1em;border-left:3px solid var(--line);color:var(--muted)}
.blog-editor img{max-width:100%;height:auto}
.blog-editor .kp-special{position:relative;margin:18px 0;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.blog-editor .kp-special[data-kind="reveal"]{border-left:4px solid var(--accent)}
.blog-editor .kp-special[data-kind="memo"]{border-left:4px dashed var(--line)}
.blog-editor .kp-special[data-kind="rp"]{border-left:4px dotted var(--line)}
.blog-editor .kp-special[data-kind="secret"]{border-left:4px double var(--accent)}
.blog-editor .kp-special-head{display:flex;gap:8px;align-items:center;margin-bottom:7px;font-size:12px;font-weight:800;color:var(--muted)}
.blog-editor .kp-special-title{font-weight:800;color:var(--text)}
.blog-editor .kp-special-body{min-height:1.8em}
.blog-editor .kp-special-action{margin-top:9px}
.blog-editor .kp-special-action button{padding:6px 10px;font-size:12px}
.image-grid{display:grid;gap:8px;margin:14px 0}
.image-grid.cols-1{grid-template-columns:1fr}
.image-grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.image-grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}

.image-grid figure{margin:0}
.image-grid img{width:100%;height:auto;display:block;border-radius:7px;border:1px solid var(--line)}
.image-grid figcaption{font-size:11px;color:var(--muted);margin-top:3px;text-align:center}
.editor-placeholder:empty:before{content:"ここにシーン本文を書きます。ロドストのように文章を書き、必要な位置へ画像・開示情報・KPメモなどを挿入できます。";color:var(--muted)}
mark.kp-marker{padding:0 .08em;border-radius:3px}
.kp-sticky{position:relative;border-bottom:2px dotted currentColor;cursor:help}
.kp-sticky::after{content:"🗒";display:inline-block;font-size:.82em;vertical-align:super;margin-left:3px;line-height:1}
.kp-sticky:hover::before{content:attr(data-note);position:absolute;left:0;bottom:calc(100% + 9px);z-index:50;width:max-content;max-width:min(360px,70vw);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);box-shadow:0 5px 18px rgba(0,0,0,.22);white-space:pre-wrap;font-size:12px;line-height:1.55}

/* v12: image grid / lightbox / drag sort / stage cues */
.image-grid{position:relative}
.image-grid figure{position:relative;cursor:grab}
.image-grid figure:active{cursor:grabbing}
.image-grid figure.dragging{opacity:.45}
.image-grid figure.drag-over{outline:2px solid var(--accent);outline-offset:2px}
.image-grid img{cursor:zoom-in}
.image-grid .img-remove{
 position:absolute;top:5px;right:5px;z-index:2;
 border:1px solid rgba(255,255,255,.35);border-radius:999px;
 background:rgba(0,0,0,.65);color:#fff;padding:2px 7px;font-size:11px;cursor:pointer
}
.image-grid .grid-help{grid-column:1/-1;font-size:11px;color:var(--muted);text-align:right;margin-top:-2px}
.image-lightbox{
 position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;
 background:rgba(0,0,0,.88);padding:24px
}
.image-lightbox.open{display:flex}
.image-lightbox img{max-width:94vw;max-height:90vh;object-fit:contain;border-radius:8px}
.image-lightbox button{
 position:absolute;top:18px;right:20px;border:1px solid rgba(255,255,255,.35);
 background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:7px 11px;font-size:14px
}
.kp-cue{

 border-radius:7px;background:rgba(255,255,255,.018)

.kp-cue-line{font-weight:700}

/* v13: standard rich-text candidate */
.rich-toolbar .tb-group{flex-wrap:wrap}
.rich-toolbar .tb-group.media-group{border-left:1px solid var(--line);padding-left:7px}
.rich-toolbar .color-btn{display:inline-flex;align-items:center;gap:5px}
.rich-toolbar .color-dot{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);display:inline-block}
.blog-editor hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}
.image-grid{align-items:start}
.image-grid figure{min-width:0}
.image-grid img{
 width:100%!important;height:150px!important;object-fit:cover!important;
 border-radius:7px;border:1px solid var(--line);cursor:zoom-in
}
.image-grid.cols-1{grid-template-columns:minmax(180px,320px)!important}
.image-grid.cols-2{grid-template-columns:repeat(2,minmax(0,260px))!important}
.image-grid.cols-3{grid-template-columns:repeat(3,minmax(0,220px))!important}
.image-grid.cols-4{grid-template-columns:repeat(4,minmax(0,190px))!important}
.image-grid{justify-content:start}
.kp-special{--kind:#999}
.kp-special[data-kind="reveal"]{--kind:#c6a84d;border-left-color:var(--kind)!important}
.kp-special[data-kind="memo"]{--kind:#c75b5b;border-left:5px solid var(--kind)!important;background:color-mix(in srgb,var(--kind) 7%,var(--panel))}
.kp-special[data-kind="rp"]{--kind:#9a72c7;border-left:5px solid var(--kind)!important}
.kp-special[data-kind="secret"]{--kind:#5689cf;border-left:5px solid var(--kind)!important;background:color-mix(in srgb,var(--kind) 6%,var(--panel))}

.kp-special .kind-chip{display:inline-block;padding:2px 6px;border-radius:999px;background:var(--kind);color:#fff;font-size:10px;line-height:1.3}
.kp-cue[data-cue="bgm"]{border-left-color:#6ba66b}
.kp-cue[data-cue="background"]{border-left-color:#62a7bb}
.media-card{margin:14px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.media-card-head{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:7px}
.media-card audio,.media-card video{max-width:100%}
.media-card video{width:min(100%,720px);max-height:440px;background:#000}
.dialogue-lines{display:grid;gap:7px}
.dialogue-row{display:grid;grid-template-columns:minmax(70px,120px) 1fr;gap:10px}
.dialogue-name{font-weight:800;color:var(--muted)}

 .image-grid.cols-3,.image-grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))!important}

}

  display:block!important;

  width:100%;box-sizing:border-box;padding:10px;border-radius:7px;border:1px solid var(--line);

}

.image-grid{
  display:flex!important;

 function normalizeGrid(grid){
   if(!grid)return;
   const figures=[...grid.querySelectorAll(":scope > figure[data-img-item]")];

 function isBlankParagraph(el){
   return !!el && el.tagName==="P" && !String(el.textContent||"").trim() &&
     !el.querySelector("img,video,audio,iframe,hr,.kp-special,.media-card");
 }

 function mergeAdjacentImageGrids(){
   const grids=[...ed.querySelectorAll("[data-image-grid]")];
   grids.forEach(grid=>{
     if(!grid.isConnected)return;
     let spacer=grid.nextElementSibling;
     let next=spacer;
     if(isBlankParagraph(spacer))next=spacer.nextElementSibling;
     if(next?.matches?.("[data-image-grid]")){
       const help=grid.querySelector(":scope > .grid-help");
       [...next.querySelectorAll(":scope > figure[data-img-item]")].forEach(fig=>{
         grid.insertBefore(fig,help||null);
       });
       next.remove();
       if(spacer!==next && isBlankParagraph(spacer))spacer.remove();
       normalizeGrid(grid);
     }
   });
 }
 function bindImageFigure(fig){
   const img=fig.querySelector("[data-full-image]");
   const remove=fig.querySelector(".img-remove");

   if(img){
     img.onclick=e=>{
       e.preventDefault();e.stopPropagation();
       const lb=q("#imageLightbox"),lbImg=q("#lightboxImage");
       lbImg.src=img.src;
       lbImg.alt=img.alt||"";
       lb.classList.add("open");
     };
   }

   if(remove){
     remove.onclick=e=>{
       e.preventDefault();e.stopPropagation();
       const grid=fig.closest("[data-image-grid]");
       fig.remove();
       normalizeGrid(grid);
       syncArticle();
     };
   }

   fig.setAttribute("draggable","true");
   const cap=fig.querySelector("figcaption");
   if(cap){
     cap.onmousedown=e=>e.stopPropagation();
     cap.oninput=()=>syncArticle();
     cap.onfocus=()=>fig.setAttribute("draggable","false");
     cap.onblur=()=>{fig.setAttribute("draggable","true");syncArticle()};
   }
   fig.ondragstart=e=>{
     fig.classList.add("dragging");
     e.dataTransfer.effectAllowed="move";
     try{e.dataTransfer.setData("text/plain","image-item")}catch(_){}
   };
   fig.ondragend=()=>{
     fig.classList.remove("dragging");
     ed.querySelectorAll("[data-img-item].drag-over").forEach(x=>x.classList.remove("drag-over"));
     syncArticle();
   };
   fig.ondragover=e=>{
     e.preventDefault();
     fig.classList.add("drag-over");
     e.dataTransfer.dropEffect="move";
   };
   fig.ondragleave=()=>fig.classList.remove("drag-over");
   fig.ondrop=e=>{
     e.preventDefault();
     fig.classList.remove("drag-over");
     const dragging=ed.querySelector("[data-img-item].dragging");
     if(!dragging||dragging===fig)return;

     const srcGrid=dragging.closest("[data-image-grid]");
     const dstGrid=fig.closest("[data-image-grid]");
     if(!srcGrid||!dstGrid)return;

     // One gallery may contain up to four images. Keep each image as an independent item.
     if(srcGrid!==dstGrid){
       const dstCount=[...dstGrid.children].filter(el=>el.matches?.("figure[data-img-item]")).length;
       if(dstCount>=4)return;
     }

     const rect=fig.getBoundingClientRect();
     const before=e.clientX < rect.left + rect.width/2;
     dstGrid.insertBefore(dragging,before?fig:fig.nextSibling);

     normalizeGrid(srcGrid);
     normalizeGrid(dstGrid);
     mergeAdjacentImageGrids();
     initImageUi();
     syncArticle();
   };
 }

 function initImageUi(){
   mergeAdjacentImageGrids();
   ed.querySelectorAll("[data-image-grid]").forEach(grid=>{
     normalizeGrid(grid);
     [...grid.children].filter(el=>el.matches?.("figure[data-img-item]")).forEach(bindImageFigure);
   });
 }

       if(u.pathname==="/watch"){
         const id=u.searchParams.get("v");
         return id?`https://www.youtube.com/embed/${encodeURIComponent(id)}`:"";

       const m=u.pathname.match(/^\/(?:shorts|embed)\/([^/?#]+)/);

     }
   }catch(_){}
   return "";
 }

 function ensureCueInsertPoint(){
   // Use the saved editor caret first: clicking the toolbar/file picker steals focus.
   let base=savedRange?.commonAncestorContainer||null;
   if(base&&base.nodeType===3)base=base.parentElement;
   let special=base?.closest?.(".kp-special")||null;

   if(!special){
     const sel=window.getSelection();
     if(sel&&sel.rangeCount){
       let node=sel.anchorNode;
       if(node&&node.nodeType===3)node=node.parentElement;
       special=node?.closest?.(".kp-special")||null;
     }
   }

   if(special&&ed.contains(special)){
     const r=document.createRange();
     r.setStartAfter(special);
     r.collapse(true);
     savedRange=r.cloneRange();
     const sel=window.getSelection();
     sel.removeAllRanges();
     sel.addRange(r);
     return;
   }

   // Otherwise keep the current saved caret as-is.
   restoreRange();
   saveRange();
 }

async function readPdf(file){const st=q("#pdfStatus");st.textContent="PDFを読み込み中…";pdfPages=[];activePdf=-1;q("#pdfList").innerHTML="";try{const pdfjsLib=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";const bytes=new Uint8Array(await file.arrayBuffer());const pdf=await pdfjsLib.getDocument({data:bytes}).promise;for(let n=1;n<=pdf.numPages;n++){st.textContent=`文字を抽出中… ${n}/${pdf.numPages}`;const page=await pdf.getPage(n),tc=await page.getTextContent();let text="",lastY=null;for(const item of tc.items||[]){const y=item.transform?.[5];if(lastY!==null&&y!==undefined&&Math.abs(y-lastY)>4)text+="\n";else if(text&&!text.endsWith("\n"))text+=" ";text+=item.str||"";lastY=y}pdfPages.push({page:n,text:text.replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim()})}st.textContent=`${pdf.numPages}ページを読み込みました。`;activePdf=pdfPages.length?0:-1;renderPdf();renderPdfCurrent(false)}catch(e){console.error(e);st.textContent="PDFの読み込みに失敗しました。"}}
