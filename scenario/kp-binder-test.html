<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KP BINDER 移行テスト｜SAKU+MERU</title>
<link rel="stylesheet" href="../assets/css/style-v0306.css">
<script defer src="../assets/js/theme-v0296.js"></script>
<script src="../assets/js/beta-gate.js?v=02315"></script><script src="../assets/js/beta-gate-ui.js?v=0306"></script>
<style>
.kptest{max-width:1320px;margin:0 auto;padding:20px 18px 70px}.test-banner{position:sticky;top:0;z-index:20;padding:10px 12px;margin-bottom:12px;border:1px solid var(--accent);border-radius:10px;background:var(--panel);font-weight:700}.test-banner small{display:block;margin-top:3px;font-weight:400;color:var(--muted)}
.head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:14px}.head h1{margin:0}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;align-items:start}.side{position:sticky;top:76px;display:grid;gap:12px}.box{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px}.box h2,.box h3{margin:0 0 8px}.scene-list{display:grid;gap:6px}.scene-list button{text-align:left}.scene-list button.active{outline:2px solid var(--accent)}
.pdf-list{display:grid;gap:6px;max-height:45vh;overflow:auto}
.pdf-page-btn{width:100%;display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:8px 9px}
.pdf-page-btn.active{outline:2px solid var(--accent);outline-offset:-2px}
.pdf-current{margin-bottom:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.pdf-current-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;font-size:12px}
.pdf-current-head strong{font-size:13px}
.pdf-current-head .spacer{flex:1}
.pdf-viewer{border-top:1px solid var(--line);padding:10px}
.pdf-viewer[hidden]{display:none}
.pdf-viewer-text{white-space:pre-wrap;line-height:1.7;max-height:310px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);user-select:text}
.pdf-viewer-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.pdf-viewer-actions button[disabled]{opacity:.5;cursor:not-allowed}
.editor{min-width:0}.scene-title{font-size:22px;font-weight:800;margin:0 0 8px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.stat{padding:5px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px;background:var(--panel)}.manuscript{display:grid;gap:10px}.block{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:11px}.block-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.kind{font-size:12px;font-weight:800;padding:3px 7px;border:1px solid var(--line);border-radius:999px}.block-title{font-weight:800}.body{line-height:1.8;min-height:24px}.body img{max-width:100%}.block.reveal,.block.secret{border-left:4px solid var(--accent)}.block.memo{border-style:dashed}.shared{font-size:12px;font-weight:700}.legacy-images{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.legacy-images img{width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}.addbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.addbar button{opacity:.75}.muted-note{font-size:12px;color:var(--muted)}
@media(max-width:820px){.layout{grid-template-columns:1fr}.side{position:static}.pdf-list{max-height:none}}
</style></head><body>
<div data-site-header data-active="scenario"></div>
<main class="kptest">
 <div class="test-banner">移行テスト版 v2 — 読み込み専用<small>既存のKPバインダーデータは読み込みますが、このページは localStorage・共有URL・開示状態を一切更新しません。</small></div>
 <div class="head"><div><h1>KP BINDER</h1><div id="scenarioName" class="muted"></div></div><a class="button" href="./">SCENARIOへ戻る</a></div>
 <div class="layout">
  <aside class="side">
   <section class="box"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h3>シーン</h3><button type="button" disabled>＋</button></div><div id="sceneList" class="scene-list"></div></section>
   <section class="box"><h3>PDF</h3><div class="muted-note">PDFページは左で選択。本文は中央上部で必要なときだけ開いて参照します。</div><div style="margin:8px 0"><button type="button" id="pickPdf">PDFを選択</button><input id="pdfFile" type="file" accept="application/pdf,.pdf" hidden></div><div id="pdfStatus" class="muted-note"></div><div id="pdfList" class="pdf-list"></div></section>
  </aside>
  <section class="editor">
   <div id="pdfCurrent" class="pdf-current"><strong>PDF 未選択</strong><span class="muted">左からPDFを選択できます</span></div>
   <h2 id="sceneTitle" class="scene-title"></h2>
   <div id="stats" class="stats"></div>
   <div id="manuscript" class="manuscript"></div>
   <div class="addbar"><button disabled>＋ 段落</button><button disabled>＋ 小見出し</button><button disabled>＋ KPメモ</button><button disabled>＋ RP</button><button disabled>＋ 開示情報</button><button disabled>＋ 秘匿</button><button disabled>＋ 画像</button></div>
   <p class="muted-note">※ このテスト版では追加・編集・削除・共有操作は無効です。表示互換だけ確認します。</p>
  </section>
 </div>
</main>
<div data-site-footer></div>
<script src="../assets/js/shared-data.js?v=0292"></script><script src="../assets/js/common-layout.js?v=20260828-kp2"></script>
<script>
const q=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sid=new URLSearchParams(location.search).get("id")||"";
const scenarios=window.TRPG39?.loadScenarios?.()||[];const sc=scenarios.find(x=>String(x.id)===String(sid))||{title:"シナリオ"};
q("#scenarioName").textContent=sc.title+" ／ 移行表示テスト";
const KEY="39x2_scenario_kp_binders_v1";
let all={};try{all=JSON.parse(localStorage.getItem(KEY)||"{}")}catch{}
let b=all[sid]||{pages:[]};
if(!Array.isArray(b.pages))b.pages=[];
if(!b.pages.length && new URLSearchParams(location.search).get("preview")==="1"){
 b={pages:[{id:"demo1",title:"導入",blocks:[{kind:"heading",title:"依頼の始まり",body:""},{kind:"normal",title:"",body:"<p>依頼人から事情を聞く。ここは通常本文の段落です。</p>"},{kind:"memo",title:"KPメモ",body:"<p>ここで聞き耳を振らせてもよい。</p>"},{kind:"reveal",title:"部屋の様子",target:"全員",body:"<p>机の上に古い手紙が置かれている。</p>",revealed:true},{kind:"secret",title:"HO1のみ",target:"HO1",body:"<p>あなたには筆跡に見覚えがある。</p>"}],images:[]}]} }
const FLOW_LABEL={heading:"小見出し",normal:"段落",memo:"KPメモ",rp:"RP",reveal:"開示情報",secret:"秘匿",note:"進行メモ",image:"画像"};
let active=b.pages[0]?.id||"",pdfPages=[],activePdf=-1;
function plain(html){const d=document.createElement("div");d.innerHTML=html||"";return (d.textContent||"").replace(/\s+/g," ").trim()}
function chars(x){return (x?.title||"").length+plain(x?.body||"").length}
function sceneChars(p){return (p?.blocks||[]).reduce((n,x)=>n+chars(x),0)}
function allChars(){return b.pages.reduce((n,p)=>n+sceneChars(p),0)}
function renderScenes(){const list=q("#sceneList");list.innerHTML=b.pages.length?b.pages.map(p=>`<button type="button" data-id="${esc(p.id)}" class="${p.id===active?"active":""}">${esc(p.title||"無題")}</button>`).join(""):'<div class="muted-note">シーンがありません。</div>';list.querySelectorAll("[data-id]").forEach(btn=>btn.onclick=()=>{active=btn.dataset.id;renderScenes();renderEditor()})}
function normalizeBlocks(p){const blocks=Array.isArray(p.blocks)?p.blocks.slice():[];if(!p.bodyMigratedToFlowV1 && String(p.body||"").trim())blocks.unshift({kind:"normal",title:"",body:p.body});return blocks}
function renderEditor(){const p=b.pages.find(x=>String(x.id)===String(active));if(!p){q("#sceneTitle").textContent="シーンを選択してください";q("#manuscript").innerHTML="";q("#stats").innerHTML="";return}const blocks=normalizeBlocks(p);q("#sceneTitle").textContent=p.title||"無題";q("#stats").innerHTML=`<span class="stat">このシーン：<b>${sceneChars({...p,blocks}).toLocaleString()}</b>文字</span><span class="stat">全体：<b>${allChars().toLocaleString()}</b>文字</span><span class="stat">本文要素：<b>${blocks.length}</b></span>`;let html=blocks.map((x,i)=>{const kind=x.kind||"normal",label=FLOW_LABEL[kind]||kind;return `<article class="block ${esc(kind)}"><div class="block-head"><div><span class="kind">${esc(label)}</span>${x.title?` <span class="block-title">${esc(x.title)}</span>`:""}${(kind==="reveal"||kind==="secret")&&x.target?` <span class="muted-note">／ ${esc(x.target)}</span>`:""}</div>${x.revealed?'<span class="shared">✓ 共有済み</span>':''}</div><div class="body">${x.body||'<span class="muted-note">（本文なし）</span>'}</div></article>`}).join("");if(Array.isArray(p.images)&&p.images.length){html+=`<article class="block"><div class="block-head"><span class="kind">旧画像資料</span></div><div class="legacy-images">${p.images.map(src=>`<img src="${src}" alt="">`).join("")}</div><div class="muted-note" style="margin-top:7px">旧データの画像資料です。本番移行時は本文中の画像要素へ移せるようにします。</div></article>`}q("#manuscript").innerHTML=html||'<div class="box muted-note">本文要素がありません。</div>'}
async function readPdf(file){const st=q("#pdfStatus");st.textContent="PDFを読み込み中…";pdfPages=[];activePdf=-1;q("#pdfList").innerHTML="";try{const pdfjsLib=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";const bytes=new Uint8Array(await file.arrayBuffer());const pdf=await pdfjsLib.getDocument({data:bytes}).promise;for(let n=1;n<=pdf.numPages;n++){st.textContent=`文字を抽出中… ${n}/${pdf.numPages}`;const page=await pdf.getPage(n),tc=await page.getTextContent();let text="",lastY=null;for(const item of tc.items||[]){const y=item.transform?.[5];if(lastY!==null&&y!==undefined&&Math.abs(y-lastY)>4)text+="\n";else if(text&&!text.endsWith("\n"))text+=" ";text+=item.str||"";lastY=y}pdfPages.push({page:n,text:text.replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim()})}st.textContent=`${pdf.numPages}ページを読み込みました。`;activePdf=pdfPages.length?0:-1;renderPdf();renderPdfCurrent(false)}catch(e){console.error(e);st.textContent="PDFの読み込みに失敗しました。"}}
function renderPdf(){
 const list=q("#pdfList");
 list.innerHTML=pdfPages.map((x,i)=>`<button type="button" class="pdf-page-btn ${i===activePdf?"active":""}" data-pdf="${i}"><span>PDF p.${x.page}</span><span class="muted-note">${x.text.length.toLocaleString()}文字</span></button>`).join("");
 list.querySelectorAll("[data-pdf]").forEach(el=>el.onclick=()=>{
   activePdf=+el.dataset.pdf;
   renderPdf();
   renderPdfCurrent(false);
 });
}
function renderPdfCurrent(open=false){
 const host=q("#pdfCurrent");
 if(activePdf<0||!pdfPages[activePdf]){
   host.innerHTML=`<div class="pdf-current-head"><strong>PDF未選択</strong><span class="muted">左のPDFページを選ぶとここで参照できます。</span></div>`;
   return;
 }
 const x=pdfPages[activePdf];
 host.innerHTML=`<div class="pdf-current-head">
   <strong>PDF p.${x.page}</strong>
   <span>${x.text.length.toLocaleString()}文字</span>
   <span class="spacer"></span>
   <button type="button" class="secondary" id="togglePdfText">${open?"本文を閉じる":"本文を開く"}</button>
 </div>
 <div class="pdf-viewer" id="pdfViewer" ${open?"":"hidden"}>
   <div class="pdf-viewer-text" id="pdfViewerText">${esc(x.text)}</div>
   <div class="pdf-viewer-actions">
     <button type="button" disabled title="移行テスト版では保存しません">ページ全文をシーンに追加</button>
     <button type="button" class="secondary" disabled title="移行テスト版では保存しません">選択範囲をシーンに追加</button>
     <span class="muted-note">※ 移行テスト版では追加操作は無効です。本番接続時に有効化します。</span>
   </div>
 </div>`;
 q("#togglePdfText").onclick=()=>renderPdfCurrent(!open);
}><summary data-pdf="${i}"><span>PDF p.${x.page}</span><span class="muted-note">${x.text.length.toLocaleString()}文字</span></summary><div class="pdf-text">${esc(x.text)}</div></details>`).join("");q("#pdfList").querySelectorAll("[data-pdf]").forEach(el=>el.onclick=()=>{activePdf=+el.dataset.pdf;const x=pdfPages[activePdf];q("#pdfCurrent").innerHTML=`<strong>PDF p.${x.page}</strong><span>${x.text.length.toLocaleString()}文字</span><span class="muted">中央上部で本文を参照</span>`})}
q("#pickPdf").onclick=()=>q("#pdfFile").click();q("#pdfFile").onchange=e=>{const f=e.target.files?.[0];e.target.value="";if(f)readPdf(f)};
renderScenes();renderEditor();
</script></body></html>
