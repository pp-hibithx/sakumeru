<style>
.kptest{max-width:1320px;margin:0 auto;padding:20px 18px 70px}.test-banner{position:sticky;top:0;z-index:20;padding:10px 12px;margin-bottom:12px;border:1px solid var(--accent);border-radius:10px;background:var(--panel);font-weight:700}.test-banner small{display:block;margin-top:3px;font-weight:400;color:var(--muted)}
.head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:14px}.head h1{margin:0}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;align-items:start}.side{position:sticky;top:76px;display:grid;gap:12px}.box{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px}.box h2,.box h3{margin:0 0 8px}.scene-list{display:grid;gap:6px}.scene-list button{text-align:left}.scene-list button.active{outline:2px solid var(--accent)}
.pdf-list{display:grid;gap:6px;max-height:45vh;overflow:auto}
.pdf-page-btn{width:100%;display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:8px 9px}
.pdf-page-btn.active{outline:2px solid var(--accent);outline-offset:-2px}
.pdf-current{margin-bottom:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.pdf-current-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;font-size:12px}

.pdf-viewer[hidden]{display:none}
.pdf-viewer-text{white-space:pre-wrap;line-height:1.7;max-height:310px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);user-select:text}
.pdf-viewer-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.pdf-viewer-actions button[disabled]{opacity:.5;cursor:not-allowed}
.editor{min-width:0}.scene-title{font-size:22px;font-weight:800;margin:0 0 8px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.stat{padding:5px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px;background:var(--panel)}.manuscript{display:grid;gap:10px}.block{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:11px}.block-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.kind{font-size:12px;font-weight:800;padding:3px 7px;border:1px solid var(--line);border-radius:999px}.block-title{font-weight:800}.body{line-height:1.8;min-height:24px}.body img{max-width:100%}.block.reveal,.block.secret{border-left:4px solid var(--accent)}.block.memo{border-style:dashed}.shared{font-size:12px;font-weight:700}.legacy-images{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.legacy-images img{width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}.addbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.addbar button{opacity:.75}.muted-note{font-size:12px;color:var(--muted)}
@media(max-width:820px){.layout{grid-template-columns:1fr}.side{position:static}.pdf-list{max-height:none}}

.edit-title{width:min(520px,100%);font:inherit;font-weight:800;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.edit-target{width:150px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.edit-body{min-height:90px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);line-height:1.75;outline:none}
.edit-body:focus{border-color:var(--accent)}
.block-tools{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.block-tools button{padding:5px 8px;font-size:12px}
.image-preview{max-width:100%;max-height:520px;display:block;margin:8px auto;border-radius:9px}
.copy-note{padding:7px 9px;border:1px dashed var(--line);border-radius:8px;font-size:12px;color:var(--muted);margin-bottom:10px}
.element-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.element-tools-label{font-size:12px;font-weight:700;margin-right:3px}
.element-tools button{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);font-size:12px;font-weight:600;cursor:pointer}
.element-tools button:hover{border-color:var(--accent)}
.element-tools button[data-add="normal"]{border-color:var(--accent)}
.element-sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.element-tools-help{font-size:11px;color:var(--muted);margin-left:auto}
.annotation-bar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:0 0 9px;padding:6px 7px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.018)}
.annotation-label{font-size:11px;font-weight:700;color:var(--muted);margin-right:2px;letter-spacing:.04em}
.annotation-bar button{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;font-size:12px;line-height:1;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}
.annotation-bar button:hover{border-color:var(--accent)}
.annotation-help{font-size:11px;color:var(--muted);margin-left:3px}
mark.kp-marker{padding:0 .08em;border-radius:3px}
.kp-sticky{position:relative;border-bottom:2px dotted currentColor;cursor:help}
.kp-sticky::after{content:"🗒";display:inline-block;font-size:.82em;vertical-align:super;margin-left:3px;line-height:1;filter:saturate(.8)}
.kp-sticky:hover::before{content:attr(data-note);position:absolute;left:0;bottom:calc(100% + 9px);z-index:50;width:max-content;max-width:min(360px,70vw);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);box-shadow:0 5px 18px rgba(0,0,0,.22);white-space:pre-wrap;font-size:12px;line-height:1.55}
mark.kp-marker .kp-sticky::after,.kp-sticky mark.kp-marker::after{filter:none}
.scene-row{display:flex;gap:5px;align-items:center}.scene-row>button:first-child{flex:1}
.scene-row .mini{padding:5px 7px}

 <div class="head"><div><h1>KP BINDER</h1><div id="scenarioName" class="muted"></div></div><a class="button" href="./">SCENARIOへ戻る</a></div>
 <div class="layout">
  <aside class="side">
   <section class="box"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h3>シーン</h3><button type="button" id="addScene">＋</button></div><div id="sceneList" class="scene-list"></div></section>
   <section class="box"><h3>PDF</h3><div class="muted-note">PDFページは左で選択。本文は中央上部で必要なときだけ開いて参照します。</div><div style="margin:8px 0"><button type="button" id="pickPdf">PDFを選択</button><input id="pdfFile" type="file" accept="application/pdf,.pdf" hidden></div><div id="pdfStatus" class="muted-note"></div><div id="pdfList" class="pdf-list"></div></section>

<span class="element-tools-label">本文を追加</span>

<button type="button" data-add="rp">＋ RP</button>

<script>
const q=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const params=new URLSearchParams(location.search);
const KEY="39x2_scenario_kp_binders_v1";
let all={};try{all=JSON.parse(localStorage.getItem(KEY)||"{}")}catch{}
let sid=params.get("id")||"";
if(!sid){
 try{
   const last=JSON.parse(localStorage.getItem("39x2_last_kp_binder_v1")||"null");
   const candidate=String(last?.scenarioId||last?.id||"");
   if(candidate&&all[candidate])sid=candidate;
 }catch{}
}
if(sid && !all[sid]){
 sid="";
}
const scenarios=window.TRPG39?.loadScenarios?.()||[];
const sc=scenarios.find(x=>String(x.id)===String(sid))||{title:"シナリオ"};
q("#scenarioName").textContent=sc.title+" ／ 移行表示テスト";
const sourceInfo=document.createElement("div");
sourceInfo.className="muted-note";
sourceInfo.style.marginTop="4px";
sourceInfo.textContent=sid
 ? `読み込み対象：${sc.title} ／ ID: ${sid}（完全一致・コピー編集）`
 : "読み込み対象を特定できません。LAのKPショートカットと同じ ?id= を付けて開いてください。";
q("#scenarioName").insertAdjacentElement("afterend",sourceInfo);
const sourceBinder=all[sid]||{pages:[]};
const cloneData=v=>window.structuredClone?structuredClone(v):JSON.parse(JSON.stringify(v));
let b=cloneData(sourceBinder);
if(!Array.isArray(b.pages))b.pages=[];
const originalCopy=cloneData(b);
if(!b.pages.length && new URLSearchParams(location.search).get("preview")==="1"){
 b={pages:[{id:"demo1",title:"導入",blocks:[{kind:"heading",title:"依頼の始まり",body:""},{kind:"normal",title:"",body:"<p>依頼人から事情を聞く。ここは通常本文の段落です。</p>"},{kind:"memo",title:"KPメモ",body:"<p>ここで聞き耳を振らせてもよい。</p>"},{kind:"reveal",title:"部屋の様子",target:"全員",body:"<p>机の上に古い手紙が置かれている。</p>",revealed:true},{kind:"secret",title:"HO1のみ",target:"HO1",body:"<p>あなたには筆跡に見覚えがある。</p>"}],images:[]}]} }
const FLOW_LABEL={heading:"小見出し",normal:"段落",memo:"KPメモ",rp:"RP",reveal:"開示情報",secret:"秘匿",note:"進行メモ",image:"画像"};
let active=b.pages[0]?.id||"",pdfPages=[],activePdf=-1;
function plain(html){const d=document.createElement("div");d.innerHTML=html||"";return (d.textContent||"").replace(/\s+/g," ").trim()}
function chars(x){return (x?.title||"").length+plain(x?.body||"").length}
function sceneChars(p){return (p?.blocks||[]).reduce((n,x)=>n+chars(x),0)}
function allChars(){return b.pages.reduce((n,p)=>n+sceneChars(p),0)}

function uid(){return (crypto.randomUUID?.()||("copy-"+Date.now()+"-"+Math.random().toString(36).slice(2)))}
function ensureBlocks(p){
 if(!Array.isArray(p.blocks))p.blocks=[];
 if(!p.bodyMigratedToFlowV1 && String(p.body||"").trim() && !p.__copyBodyMigrated){
   p.blocks.unshift({id:uid(),kind:"normal",title:"",body:p.body});
   p.__copyBodyMigrated=true;
 }
 p.blocks.forEach(x=>{x.id??=uid();x.kind??="normal";x.title??="";x.body??=""});
 return p.blocks
}
function sceneChars(p){return ensureBlocks(p).reduce((n,x)=>n+chars(x),0)}
function allChars(){return b.pages.reduce((n,p)=>n+sceneChars(p),0)}
function renderScenes(){
 const list=q("#sceneList");
 list.innerHTML=b.pages.length?b.pages.map(p=>`<div class="scene-row">
   <button type="button" data-id="${esc(p.id)}" class="${String(p.id)===String(active)?"active":""}">${esc(p.title||"無題")}</button>
   <button type="button" class="mini secondary" data-sceneup="${esc(p.id)}">↑</button>
   <button type="button" class="mini secondary" data-scenedown="${esc(p.id)}">↓</button>
 </div>`).join(""):'<div class="muted-note">シーンがありません。</div>';
 list.querySelectorAll("[data-id]").forEach(btn=>btn.onclick=()=>{active=btn.dataset.id;renderScenes();renderEditor()});
 list.querySelectorAll("[data-sceneup]").forEach(btn=>btn.onclick=()=>moveScene(btn.dataset.sceneup,-1));
 list.querySelectorAll("[data-scenedown]").forEach(btn=>btn.onclick=()=>moveScene(btn.dataset.scenedown,1));
}
function moveScene(id,dir){
 const i=b.pages.findIndex(p=>String(p.id)===String(id)),j=i+dir;
 if(i<0||j<0||j>=b.pages.length)return;
 [b.pages[i],b.pages[j]]=[b.pages[j],b.pages[i]];
 renderScenes();renderEditor();
}
function addScene(){
 const p={id:uid(),title:"新しいシーン",blocks:[],images:[]};
 b.pages.push(p);active=p.id;renderScenes();renderEditor();
}
function addBlock(kind,body=""){
 const p=b.pages.find(x=>String(x.id)===String(active));if(!p)return;
 const x={id:uid(),kind,title:"",target:(kind==="reveal"||kind==="secret")?"全員":"",body,image:"",rpDone:false,revealed:false,revealedAt:"",sharedSnapshot:null};
 ensureBlocks(p).push(x);renderEditor()
}
function moveBlock(i,dir){
 const p=b.pages.find(x=>String(x.id)===String(active));if(!p)return;
 const a=ensureBlocks(p),j=i+dir;if(i<0||j<0||j>=a.length)return;
 [a[i],a[j]]=[a[j],a[i]];renderEditor()
}
function deleteBlock(i){
 const p=b.pages.find(x=>String(x.id)===String(active));if(!p)return;
 ensureBlocks(p).splice(i,1);renderEditor()
}
function refreshStats(){
 const p=b.pages.find(x=>String(x.id)===String(active));if(!p)return;
 q("#stats").innerHTML=`<span class="stat">このシーン：<b>${sceneChars(p).toLocaleString()}</b>文字</span><span class="stat">全体：<b>${allChars().toLocaleString()}</b>文字</span><span class="stat">本文要素：<b>${ensureBlocks(p).length}</b></span>`;
}
function renderEditor(){
 const p=b.pages.find(x=>String(x.id)===String(active));
 if(!p){q("#sceneTitle").textContent="シーンを選択してください";q("#manuscript").innerHTML="";q("#stats").innerHTML="";return}
 const blocks=ensureBlocks(p);
 q("#sceneTitle").innerHTML=`<input class="edit-title" id="sceneTitleInput" value="${esc(p.title||"")}" aria-label="シーン名">`;
 refreshStats();
 let html=`<div class="copy-note">ここでの変更はコピーだけに反映されます。本番データには保存されません。</div>`;
 html+=blocks.map((x,i)=>{
   const kind=x.kind||"normal",label=FLOW_LABEL[kind]||kind;
   if(kind==="image"){
     return `<article class="block image"><div class="block-head"><div><span class="kind">画像</span></div><div class="block-tools"><button class="secondary" data-up="${i}">↑</button><button class="secondary" data-down="${i}">↓</button><button class="secondary" data-del="${i}">削除</button></div></div>
       ${x.image?`<img class="image-preview" src="${x.image}" alt="">`:'<div class="muted-note">画像未選択</div>'}
       <div class="block-tools" style="margin-top:8px"><button type="button" data-pickimg="${i}">画像を選択</button>${x.image?`<button type="button" class="secondary" data-clearimg="${i}">画像を外す</button>`:""}</div>
     </article>`
   }
   return `<article class="block ${esc(kind)}">
     <div class="block-head">
       <div><span class="kind">${esc(label)}</span>${x.revealed?'<span class="shared"> ✓ 元データでは共有済み</span>':''}</div>
       <div class="block-tools"><button class="secondary" data-up="${i}">↑</button><button class="secondary" data-down="${i}">↓</button><button class="secondary" data-del="${i}">削除</button></div>
     </div>
     ${kind!=="normal"?`<input class="edit-title" data-title="${i}" value="${esc(x.title||"")}" placeholder="${kind==="heading"?"小見出し":label+"の見出し"}">`:""}
     ${(kind==="reveal"||kind==="secret")?`<div style="margin-top:7px"><input class="edit-target" data-target="${i}" value="${esc(x.target||"全員")}" placeholder="対象"></div>`:""}
     <div class="annotation-bar" aria-label="注釈ツール">
       <span class="annotation-label">注釈</span>
       <button type="button" data-marker="${i}" title="選択した文字にマーカー">▰ マーカー</button>
       <button type="button" data-sticky="${i}" title="選択した文字にKP用の付箋">🗒 付箋</button>
       <button type="button" data-clearanno="${i}" title="選択範囲にあるマーカー・付箋を外す">× 注釈解除</button>
       <span class="annotation-help">文字を選択して使用</span>
     </div>
     <div class="edit-body" contenteditable="true" data-body="${i}" style="margin-top:8px">${x.body||""}</div>
   </article>`
 }).join("");
 q("#manuscript").innerHTML=html||'<div class="box muted-note">本文要素がありません。</div>';
 q("#sceneTitleInput").oninput=e=>{p.title=e.target.value;renderScenes();refreshStats()};
 q("#manuscript").querySelectorAll("[data-title]").forEach(el=>el.oninput=()=>{blocks[+el.dataset.title].title=el.value;refreshStats()});
 q("#manuscript").querySelectorAll("[data-target]").forEach(el=>el.oninput=()=>{blocks[+el.dataset.target].target=el.value});
 q("#manuscript").querySelectorAll("[data-body]").forEach(el=>el.oninput=()=>{blocks[+el.dataset.body].body=el.innerHTML;refreshStats()});
 function selectedRangeIn(body){
   const sel=window.getSelection?.();
   if(!sel||!sel.rangeCount||sel.isCollapsed)return null;
   const range=sel.getRangeAt(0);
   if(!body.contains(range.commonAncestorContainer))return null;
   return range;
 }
 function syncBody(i,body){blocks[i].body=body.innerHTML;refreshStats()}
 function wrapSelection(i,tag,attrs={}){
   const body=q(`[data-body="${i}"]`),range=selectedRangeIn(body);
   if(!range){alert("本文から注釈を付けたい文字を選択してください。");return}
   const el=document.createElement(tag);
   Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
   try{range.surroundContents(el)}
   catch{
     const frag=range.extractContents();el.appendChild(frag);range.insertNode(el);
   }
   syncBody(i,body);window.getSelection()?.removeAllRanges();
 }
 q("#manuscript").querySelectorAll("[data-marker]").forEach(el=>el.onmousedown=e=>{
   e.preventDefault();wrapSelection(+el.dataset.marker,"mark",{class:"kp-marker"});
 });
 q("#manuscript").querySelectorAll("[data-sticky]").forEach(el=>el.onmousedown=e=>{
   e.preventDefault();
   const i=+el.dataset.sticky,body=q(`[data-body="${i}"]`),range=selectedRangeIn(body);
   if(!range){alert("本文から付箋を付けたい文字を選択してください。");return}
   const note=prompt("付箋に書くKPメモ");
   if(note===null||!note.trim())return;
   const el2=document.createElement("span");el2.className="kp-sticky";el2.dataset.note=note.trim();
   try{range.surroundContents(el2)}catch{const frag=range.extractContents();el2.appendChild(frag);range.insertNode(el2)}
   syncBody(i,body);window.getSelection()?.removeAllRanges();
 });
 q("#manuscript").querySelectorAll("[data-clearanno]").forEach(el=>el.onmousedown=e=>{
   e.preventDefault();
   const i=+el.dataset.clearanno,body=q(`[data-body="${i}"]`),range=selectedRangeIn(body);
   if(!range){alert("注釈を外したい文字を選択してください。");return}
   const hits=[...body.querySelectorAll("mark.kp-marker,span.kp-sticky")].filter(n=>{
     try{return range.intersectsNode(n)}catch{return false}
   });
   hits.forEach(n=>n.replaceWith(...n.childNodes));
   body.normalize();syncBody(i,body);window.getSelection()?.removeAllRanges();
 });
 q("#manuscript").querySelectorAll("[data-up]").forEach(el=>el.onclick=()=>moveBlock(+el.dataset.up,-1));
 q("#manuscript").querySelectorAll("[data-down]").forEach(el=>el.onclick=()=>moveBlock(+el.dataset.down,1));
 q("#manuscript").querySelectorAll("[data-del]").forEach(el=>el.onclick=()=>deleteBlock(+el.dataset.del));
 q("#manuscript").querySelectorAll("[data-pickimg]").forEach(el=>el.onclick=()=>{
   const i=+el.dataset.pickimg,input=document.createElement("input");input.type="file";input.accept="image/*";
   input.onchange=()=>{const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{blocks[i].image=String(r.result||"");renderEditor()};r.readAsDataURL(f)};input.click()
 });
 q("#manuscript").querySelectorAll("[data-clearimg]").forEach(el=>el.onclick=()=>{blocks[+el.dataset.clearimg].image="";renderEditor()});
}

async function readPdf(file){const st=q("#pdfStatus");st.textContent="PDFを読み込み中…";pdfPages=[];activePdf=-1;q("#pdfList").innerHTML="";try{const pdfjsLib=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";const bytes=new Uint8Array(await file.arrayBuffer());const pdf=await pdfjsLib.getDocument({data:bytes}).promise;for(let n=1;n<=pdf.numPages;n++){st.textContent=`文字を抽出中… ${n}/${pdf.numPages}`;const page=await pdf.getPage(n),tc=await page.getTextContent();let text="",lastY=null;for(const item of tc.items||[]){const y=item.transform?.[5];if(lastY!==null&&y!==undefined&&Math.abs(y-lastY)>4)text+="\n";else if(text&&!text.endsWith("\n"))text+=" ";text+=item.str||"";lastY=y}pdfPages.push({page:n,text:text.replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim()})}st.textContent=`${pdf.numPages}ページを読み込みました。`;activePdf=pdfPages.length?0:-1;renderPdf();renderPdfCurrent(false)}catch(e){console.error(e);st.textContent="PDFの読み込みに失敗しました。"}}
function renderPdf(){
 const list=q("#pdfList");
 list.innerHTML=pdfPages.map((x,i)=>`<button type="button" class="pdf-page-btn ${i===activePdf?"active":""}" data-pdf="${i}"><span>PDF p.${x.page}</span><span class="muted-note">${x.text.length.toLocaleString()}文字</span></button>`).join("");
 list.querySelectorAll("[data-pdf]").forEach(el=>el.onclick=()=>{
   activePdf=+el.dataset.pdf;
   renderPdf();
   renderPdfCurrent(false);
 });
}
function renderPdfCurrent(open=false){
 const host=q("#pdfCurrent");
 if(activePdf<0||!pdfPages[activePdf]){
   host.innerHTML=`<div class="pdf-current-head"><strong>PDF未選択</strong><span class="muted">左のPDFページを選ぶとここで参照できます。</span></div>`;
   return;
 }
 const x=pdfPages[activePdf];
 host.innerHTML=`<div class="pdf-current-head">
   <strong>PDF p.${x.page}</strong>
   <span>${x.text.length.toLocaleString()}文字</span>
   <span class="spacer"></span>
   <button type="button" class="secondary" id="togglePdfText">${open?"本文を閉じる":"本文を開く"}</button>
 </div>
 <div class="pdf-viewer" id="pdfViewer" ${open?"":"hidden"}>
   <div class="annotation-bar" aria-label="PDF注釈ツール">
     <span class="annotation-label">注釈</span>
     <button type="button" id="pdfMarker" title="選択した文字にマーカー">▰ マーカー</button>
     <button type="button" id="pdfSticky" title="選択した文字にKP用の付箋">🗒 付箋</button>
     <button type="button" id="pdfClearAnno" title="選択範囲にあるマーカー・付箋を外す">× 注釈解除</button>
     <span class="annotation-help">文字を選択して使用</span>
   </div>
   <div class="pdf-viewer-text" id="pdfViewerText">${x.annotatedHtml||esc(x.text)}</div>
   <div class="pdf-viewer-actions">
     <button type="button" id="addPdfFull">ページ全文をシーンに追加</button>
     <button type="button" class="secondary" id="addPdfSelection">選択範囲をシーンに追加</button>
     <span class="muted-note">※ コピー編集領域にだけ追加されます。</span>
   </div>
 </div>`;
 q("#togglePdfText").onclick=()=>renderPdfCurrent(!open);
 const pv=q("#pdfViewerText");
 function pdfSync(){x.annotatedHtml=pv.innerHTML}
 function pdfWrap(tag,attrs={}){
   const sel=window.getSelection?.();if(!sel||!sel.rangeCount||sel.isCollapsed){alert("PDF本文から注釈を付けたい文字を選択してください。");return}
   const r=sel.getRangeAt(0);if(!pv.contains(r.commonAncestorContainer)){alert("PDF本文から文字を選択してください。");return}
   const el=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
   try{r.surroundContents(el)}catch{const f=r.extractContents();el.appendChild(f);r.insertNode(el)}
   pdfSync();sel.removeAllRanges();
 }
 q("#pdfMarker").onmousedown=e=>{e.preventDefault();pdfWrap("mark",{class:"kp-marker"})};
 q("#pdfSticky").onmousedown=e=>{e.preventDefault();const note=prompt("付箋に書くKPメモ");if(note===null||!note.trim())return;pdfWrap("span",{class:"kp-sticky","data-note":note.trim()})};
 q("#pdfClearAnno").onmousedown=e=>{e.preventDefault();const sel=window.getSelection?.();if(!sel||!sel.rangeCount||sel.isCollapsed){alert("注釈を外したい文字を選択してください。");return}const r=sel.getRangeAt(0);[...pv.querySelectorAll("mark.kp-marker,span.kp-sticky")].filter(n=>{try{return r.intersectsNode(n)}catch{return false}}).forEach(n=>n.replaceWith(...n.childNodes));pv.normalize();pdfSync();sel.removeAllRanges()};
 q("#addPdfFull").onclick=()=>addBlock("normal",x.annotatedHtml||esc(x.text).replace(/\n/g,"<br>"));
 q("#addPdfSelection").onclick=()=>{
   const sel=window.getSelection?.();
   if(!sel||!sel.rangeCount||sel.isCollapsed){alert("PDF本文から追加したい範囲を選択してください。");return}
   const r=sel.getRangeAt(0),pv=q("#pdfViewerText");
   if(!pv.contains(r.commonAncestorContainer)){alert("PDF本文から追加したい範囲を選択してください。");return}
   const tmp=document.createElement("div");tmp.appendChild(r.cloneContents());
   addBlock("normal",tmp.innerHTML||esc(String(sel)).replace(/\n/g,"<br>"));
 };
}
q("#pickPdf").onclick=()=>q("#pdfFile").click();
q("#pdfFile").onchange=e=>{const f=e.target.files?.[0];e.target.value="";if(f)readPdf(f)};
q("#addScene").onclick=addScene;
q("#addbar").querySelectorAll("[data-add]").forEach(btn=>btn.onclick=()=>addBlock(btn.dataset.add));
q("#resetCopy").onclick=()=>{if(!confirm("コピー編集内容を破棄して、元データの読み込み状態へ戻しますか？"))return;b=cloneData(originalCopy);active=b.pages[0]?.id||"";renderScenes();renderEditor()};
renderScenes();renderEditor();
</script></body></html>
