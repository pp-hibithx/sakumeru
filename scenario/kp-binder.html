<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KP用バインダー｜SAKU+MERU</title>
<script>(()=>{try{const k="trpg39_theme",v=localStorage.getItem(k)||"system",m=(v==="light"||v==="dark")?v:(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"),r=document.documentElement;r.setAttribute("data-theme",m);r.setAttribute("data-theme-mode",v);r.classList.add(m==="light"?"theme-light":"theme-dark");r.style.colorScheme=m}catch(e){}})();</script>
<link rel="stylesheet" href="../assets/css/style-v0306.css"><script defer src="../assets/js/common-layout.js?v=0303"></script><script defer src="../assets/js/theme-v0296.js"></script>
<style>
.kp-wrap{max-width:1120px;margin:0 auto}.kp-head{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:16px}.kp-head h1{margin:0}.kp-body{display:grid;gap:18px}.kp-box{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel)}.kp-box h2{margin:0 0 10px;font-size:1.1rem}.kp-pages{display:grid;grid-template-columns:240px minmax(0,1fr);gap:12px}.kp-page-list{display:grid;gap:7px;align-content:start}.kp-page-btn{display:flex;justify-content:space-between;gap:6px;align-items:center;text-align:left}.kp-page-btn.active{outline:2px solid var(--accent)}.kp-page-editor textarea{min-height:360px}.kp-row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.kp-row>div{flex:1;min-width:180px}.kp-participants{display:grid;gap:10px}.kp-person{border:1px solid var(--line);border-radius:10px;padding:10px}.kp-person-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.kp-person-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:9px}.kp-person textarea{min-height:110px}.kp-compare{overflow:auto}.kp-compare table{border-collapse:collapse;width:100%;min-width:520px}.kp-compare th,.kp-compare td{border:1px solid var(--line);padding:7px;text-align:center}.kp-compare th:first-child,.kp-compare td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}label{display:block;margin:7px 0 3px}input,select{width:100%}@media(max-width:760px){.kp-pages,.kp-person-grid{grid-template-columns:1fr}}
</style></head><body><div data-site-header data-active="scenario"></div><main><div class="wrap kp-wrap"><div id="app"></div></div></main><div data-site-footer></div>
<script src="../assets/js/main.js?v=0292"></script><script src="../assets/js/shared-data.js?v=0292"></script>
<script>(()=>{"use strict";const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const id=new URLSearchParams(location.search).get("id");const scenarios=TRPG39.loadScenarios?.()||[];const sc=scenarios.find(x=>String(x.id)===String(id));const KEY="39x2_scenario_kp_binders_v1";let all=(()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch{return {}}})();const save=()=>localStorage.setItem(KEY,JSON.stringify(all));const def=()=>({overview:"",pages:[],participants:[]});const get=()=>all[id]||(all[id]=def());const parse=t=>{const o={};String(t||"").split(/\n/).forEach(l=>{const m=l.trim().match(/^(.+?)[\s:：=]+(\d{1,3})\s*%?$/);if(m)o[m[1].trim()]=Number(m[2])});return o};
if(!id||!sc){document.getElementById("app").innerHTML='<section class="kp-box"><h1>KP用バインダー</h1><p>シナリオが見つかりません。</p><a class="button" href="./">SCENARIOへ戻る</a></section>';return}
function compare(b){if(!b.participants.length)return '<div class="small muted">参加PCを追加すると比較できます。</div>';const maps=b.participants.map(p=>parse(p.skills)),names=[...new Set(maps.flatMap(m=>Object.keys(m)))].sort((a,z)=>a.localeCompare(z,"ja"));if(!names.length)return '<div class="small muted">技能値を入力するとここに一覧表示されます。</div>';return `<table><thead><tr><th>技能</th>${b.participants.map(p=>`<th>${esc(p.name||"PC")}</th>`).join("")}</tr></thead><tbody>${names.map(n=>`<tr><td>${esc(n)}</td>${maps.map(m=>`<td>${m[n]??"—"}</td>`).join("")}</tr>`).join("")}</tbody></table>`}
function render(active){const b=get(),pcs=TRPG39.loadPCs?.()||[];if(!active&&b.pages[0])active=b.pages[0].id;const pg=b.pages.find(p=>p.id===active)||null,opts=pcs.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}${p.system?`（${esc(p.system)}）`:""}</option>`).join("");document.getElementById("app").innerHTML=`<div class="kp-head"><div><h1>KP用バインダー</h1><div class="muted">${esc(sc.title)} ／ 自分専用・卓予定にはカウントされません</div></div><a class="button" href="./">SCENARIOへ戻る</a></div><div class="kp-body"><section class="kp-box"><h2>総合メモ</h2><textarea data-over rows="7" placeholder="KP向け総合メモ。ここは常に非公開です。">${esc(b.overview||"")}</textarea></section><section class="kp-box"><div class="kp-row"><div><h2>個別ページ</h2><div class="small muted">秘匿、NPC、読み上げ、改変、プロットなど自由に追加できます。</div></div><button data-add>＋ ページ追加</button></div><div class="kp-pages"><div class="kp-page-list">${b.pages.length?b.pages.map(p=>`<button class="kp-page-btn ${p.id===active?"active":""}" data-page="${esc(p.id)}">${esc(p.title||"無題")}</button>`).join(""):'<div class="small muted">まだページがありません。</div>'}</div><div class="kp-page-editor">${pg?`<label>ページ名</label><input data-title value="${esc(pg.title||"")}"><label>本文</label><textarea data-body>${esc(pg.body||"")}</textarea><div class="kp-row"><button data-dup>複製</button><button class="danger" data-del>削除</button></div>`:'<div class="small muted">左からページを選ぶか、新しく追加してください。</div>'}</div></div></section><section class="kp-box"><div class="kp-row"><div><h2>参加PC管理</h2><div class="small muted">既存PCを紐付け、能力値・技能値をシナリオ用に控えられます。</div></div><div><label>PC</label><select data-pc><option value="">選択…</option>${opts}</select></div><button data-addpc>追加</button></div><div class="kp-participants">${b.participants.length?b.participants.map((p,i)=>`<div class="kp-person"><div class="kp-person-head"><b>${esc(p.name||pcs.find(x=>x.id===p.pcId)?.name||"PC")}</b><button class="danger" data-rm="${i}">削除</button></div><div class="kp-person-grid"><div><label>能力値・主要数値</label><textarea data-ab="${i}">${esc(p.abilities||"")}</textarea></div><div><label>技能値</label><textarea data-sk="${i}">${esc(p.skills||"")}</textarea></div></div></div>`).join(""):'<div class="small muted">参加PCはまだ登録されていません。</div>'}</div></section><section class="kp-box"><h2>技能比較</h2><div class="kp-compare">${compare(b)}</div></section></div>`;
const root=document.getElementById("app");root.querySelector("[data-over]").oninput=e=>{b.overview=e.target.value;save()};root.querySelector("[data-add]").onclick=()=>{const p={id:TRPG39.uuid(),title:"新しいページ",body:""};b.pages.push(p);save();render(p.id)};root.querySelectorAll("[data-page]").forEach(e=>e.onclick=()=>render(e.dataset.page));if(pg){root.querySelector("[data-title]").oninput=e=>{pg.title=e.target.value;save()};root.querySelector("[data-body]").oninput=e=>{pg.body=e.target.value;save()};root.querySelector("[data-dup]").onclick=()=>{const n={...pg,id:TRPG39.uuid(),title:(pg.title||"無題")+" コピー"};b.pages.push(n);save();render(n.id)};root.querySelector("[data-del]").onclick=()=>{if(confirm("この個別ページを削除しますか？")){b.pages=b.pages.filter(x=>x.id!==pg.id);save();render()}}}root.querySelector("[data-addpc]").onclick=()=>{const pid=root.querySelector("[data-pc]").value,src=pcs.find(x=>x.id===pid);if(!src)return;if(b.participants.some(x=>x.pcId===pid))return alert("このPCは追加済みです。");b.participants.push({pcId:pid,name:src.name||"",abilities:"",skills:""});save();render(active)};root.querySelectorAll("[data-rm]").forEach(e=>e.onclick=()=>{b.participants.splice(Number(e.dataset.rm),1);save();render(active)});root.querySelectorAll("[data-ab]").forEach(e=>e.oninput=()=>{b.participants[Number(e.dataset.ab)].abilities=e.value;save()});root.querySelectorAll("[data-sk]").forEach(e=>e.oninput=()=>{b.participants[Number(e.dataset.sk)].skills=e.value;save();root.querySelector(".kp-compare").innerHTML=compare(b)})}
render();})();</script></body></html>
