<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KP BINDER｜SAKU+MERU</title>
<link rel="stylesheet" href="../assets/css/style-v0306.css">
<script defer src="../assets/js/theme-v0296.js"></script>
<script src="../assets/js/beta-gate.js?v=02315"></script><script src="../assets/js/beta-gate-ui.js?v=0306"></script>
<style>
.kp2{max-width:1180px;margin:0 auto;padding:24px 18px 70px}.kp2-head{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:16px}.kp2-head h1{margin:0}
.kp2-tabs{display:flex;gap:7px;flex-wrap:wrap;position:sticky;top:0;z-index:8;padding:10px 0;background:var(--bg)}
.kp2-tab.active{border-color:var(--accent);color:var(--accent)}.kp2-pane[hidden]{display:none}
.kp2-box{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:15px;margin:0 0 14px}.kp2-box h2,.kp2-box h3{margin-top:0}
.kp2-grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px}.kp2-list{display:grid;gap:7px;align-content:start}.kp2-list button{text-align:left}.kp2-list button.active{outline:2px solid var(--accent)}
.kp2-editor-title{width:100%;font-size:18px;font-weight:700;margin-bottom:8px}.richbar{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 6px}.richbar button,.richbar select,.richbar input{width:auto}
.rich{min-height:320px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:14px;line-height:1.75;overflow:auto}.rich:focus{outline:2px solid var(--accent)}
.kp2-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.kp2-prep{width:100%;height:900px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.reveal-card{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0}.reveal-head{display:flex;gap:8px;justify-content:space-between;align-items:center}.reveal-body{margin-top:8px;padding:10px;background:var(--bg);border-radius:8px}
.revealed{border-color:var(--accent)}.secret-badge{font-size:11px;border:1px solid var(--accent);border-radius:999px;padding:2px 7px}.share-url{display:flex;gap:7px}.share-url input{flex:1}
.kp2-pcgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kp2-person{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
@media(max-width:760px){.kp2-grid,.kp2-pcgrid{grid-template-columns:1fr}.kp2-prep{height:1100px}}
</style></head><body>
<div data-site-header data-active="scenario"></div>
<main class="kp2"><div class="kp2-head"><div><h1>KP BINDER</h1><div id="scenarioName" class="muted"></div></div><a class="button" href="./">SCENARIOへ戻る</a></div>
<nav class="kp2-tabs"><button class="kp2-tab active" data-tab="binder">バインダー</button><button class="kp2-tab" data-tab="run">進行・BGM・PDF</button><button class="kp2-tab" data-tab="share">秘匿・開示</button><button class="kp2-tab" data-tab="pc">参加PC・技能</button></nav>
<section class="kp2-pane" data-pane="binder"><div class="kp2-box"><h2>総合メモ</h2><div class="richbar" data-toolbar="overview"></div><div id="overview" class="rich" contenteditable="true"></div></div>
<div class="kp2-box"><div class="kp2-actions" style="justify-content:space-between"><div><h2 style="margin:0">ページ</h2><div class="small muted">NPC・読み上げ・改変・プロットなど。ドラッグではなく↑↓で並べ替えできます。</div></div><button id="addPage">＋ ページ追加</button></div><div class="kp2-grid" style="margin-top:12px"><div id="pageList" class="kp2-list"></div><div id="pageEditor"></div></div></div></section>
<section class="kp2-pane" data-pane="run" hidden><div class="kp2-box"><h2>進行ノート・素材</h2><p class="small muted">旧「卓準備」にあったシーン、BGM・画像素材LIBRARY、PDF取り込みをKP BINDER内へ統合しています。同じ保存データを使うため既存内容も引き継ぎます。</p><iframe id="prepFrame" class="kp2-prep" title="進行ノート・素材"></iframe></div></section>
<section class="kp2-pane" data-pane="share" hidden><div class="kp2-box"><h2>共通PL共有URL</h2><p class="small muted">開示した情報だけが同じURLへ追加されます。未開示の本文は共有データへ含めません。</p><div class="share-url"><input id="shareUrl" readonly placeholder="まだ共有URLは作成されていません"><button id="makeShare">共有URLを作成</button><button id="copyShare">コピー</button></div><div id="shareStatus" class="small muted" style="margin-top:7px"></div></div>
<div class="kp2-box"><div class="kp2-actions" style="justify-content:space-between"><div><h2 style="margin:0">秘匿・開示情報</h2><div class="small muted">対象をメモしておき、必要なタイミングで「開示」。開示順は共有ページにそのまま残ります。</div></div><button id="addReveal">＋ 情報追加</button></div><div id="revealList"></div></div></section>
<section class="kp2-pane" data-pane="pc" hidden><div class="kp2-box"><div class="kp2-actions"><div style="flex:1"><h2 style="margin:0">参加PC管理</h2></div><select id="pcSelect"><option value="">PCを選択…</option></select><button id="addPc">追加</button></div><div id="participants"></div></div><div class="kp2-box"><h2>技能比較</h2><div id="compare" style="overflow:auto"></div></div></section>
</main><div data-site-footer></div>
<script src="../assets/js/shared-data.js?v=0292"></script><script src="../assets/js/supabase-config.js"></script><script src="../assets/js/supabase-share.js"></script><script src="../assets/js/common-layout.js?v=20260828-kp2"></script>
<script>
const q=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sid=new URLSearchParams(location.search).get("id")||"";const scenarios=TRPG39.loadScenarios?.()||[];const sc=scenarios.find(x=>String(x.id)===String(sid))||{title:"シナリオ"};
q("#scenarioName").textContent=sc.title+" ／ 自分専用";
const KEY="39x2_scenario_kp_binders_v1",all=(()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch{return {}}})();
const uuid=()=>TRPG39.uuid?.()||crypto.randomUUID();function def(){return {overview:"",pages:[],participants:[],reveals:[],shareId:"",revealLog:[]}}
const b=all[sid]||(all[sid]=def());b.pages??=[];b.participants??=[];b.reveals??=[];b.revealLog??=[];const save=()=>localStorage.setItem(KEY,JSON.stringify(all));
function toolbar(host,editor){host.innerHTML=`<button data-c="bold"><b>B</b></button><button data-c="italic"><i>I</i></button><button data-c="underline"><u>U</u></button><select data-block><option value="">段落</option><option value="h2">見出し大</option><option value="h3">見出し小</option><option value="blockquote">引用</option></select><input data-color type="color" value="#cd9723"><button data-list="insertUnorderedList">・リスト</button><button data-list="insertOrderedList">1.リスト</button><button data-link>リンク</button><button data-clear>装飾解除</button>`;
host.querySelectorAll("[data-c]").forEach(x=>x.onclick=()=>{document.execCommand(x.dataset.c);editor.focus()});host.querySelector("[data-block]").onchange=e=>{if(e.target.value)document.execCommand("formatBlock",false,e.target.value);editor.focus()};host.querySelector("[data-color]").oninput=e=>{document.execCommand("foreColor",false,e.target.value);editor.focus()};host.querySelectorAll("[data-list]").forEach(x=>x.onclick=()=>{document.execCommand(x.dataset.list);editor.focus()});host.querySelector("[data-link]").onclick=()=>{const u=prompt("リンクURL");if(u)document.execCommand("createLink",false,u);editor.focus()};host.querySelector("[data-clear]").onclick=()=>{document.execCommand("removeFormat");editor.focus()}}
const over=q("#overview");over.innerHTML=b.overview||"";toolbar(q('[data-toolbar="overview"]'),over);over.oninput=()=>{b.overview=over.innerHTML;save()};
let active=b.pages[0]?.id||"";function renderPages(){const list=q("#pageList"),ed=q("#pageEditor");list.innerHTML=b.pages.length?b.pages.map((p,i)=>`<button class="${p.id===active?"active":""}" data-p="${p.id}">${esc(p.title||"無題")}</button>`).join(""):'<div class="small muted">まだページがありません。</div>';list.querySelectorAll("[data-p]").forEach(x=>x.onclick=()=>{active=x.dataset.p;renderPages()});const p=b.pages.find(x=>x.id===active);if(!p){ed.innerHTML="";return}ed.innerHTML=`<input class="kp2-editor-title" id="pageTitle" value="${esc(p.title||"")}"><div class="richbar" id="pageToolbar"></div><div id="pageBody" class="rich" contenteditable="true"></div><div class="kp2-actions"><button id="upPage">↑</button><button id="downPage">↓</button><button id="dupPage">複製</button><button id="delPage" class="danger">削除</button></div>`;q("#pageBody").innerHTML=p.body||"";toolbar(q("#pageToolbar"),q("#pageBody"));q("#pageTitle").oninput=e=>{p.title=e.target.value;save()};q("#pageBody").oninput=e=>{p.body=e.currentTarget.innerHTML;save()};q("#dupPage").onclick=()=>{const n={...p,id:uuid(),title:(p.title||"無題")+" コピー"};b.pages.push(n);active=n.id;save();renderPages()};q("#delPage").onclick=()=>{if(confirm("このページを削除しますか？")){b.pages=b.pages.filter(x=>x.id!==p.id);active=b.pages[0]?.id||"";save();renderPages()}};q("#upPage").onclick=()=>movePage(-1);q("#downPage").onclick=()=>movePage(1)}
function movePage(d){const i=b.pages.findIndex(x=>x.id===active),j=i+d;if(i<0||j<0||j>=b.pages.length)return;[b.pages[i],b.pages[j]]=[b.pages[j],b.pages[i]];save();renderPages()}
q("#addPage").onclick=()=>{const p={id:uuid(),title:"新しいページ",body:""};b.pages.push(p);active=p.id;save();renderPages()};renderPages();
document.querySelectorAll(".kp2-tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".kp2-tab").forEach(x=>x.classList.toggle("active",x===t));document.querySelectorAll(".kp2-pane").forEach(x=>x.hidden=x.dataset.pane!==t.dataset.tab);if(t.dataset.tab==="run"&&!q("#prepFrame").src)q("#prepFrame").src=`../prep/index.html?scenario=${encodeURIComponent(sid)}&embed=kp`});
function renderReveals(){q("#revealList").innerHTML=b.reveals.length?b.reveals.map((r,i)=>`<article class="reveal-card ${r.revealed?"revealed":""}"><div class="reveal-head"><div><b>${esc(r.title||"無題")}</b> <span class="secret-badge">${esc(r.target||"全員")}</span></div><div>${r.revealed?'<span class="small">開示済み</span>':`<button data-open="${i}">開示</button>`} <button data-edit="${i}">編集</button> <button class="danger" data-rdel="${i}">削除</button></div></div><div class="reveal-body">${r.body||'<span class="muted">本文なし</span>'}</div></article>`).join(""):'<div class="small muted">まだ開示情報はありません。</div>';q("#revealList").querySelectorAll("[data-open]").forEach(x=>x.onclick=async()=>{const r=b.reveals[+x.dataset.open];if(!confirm(`「${r.title||"この情報"}」を共有URLへ開示しますか？`))return;r.revealed=true;r.revealedAt=new Date().toISOString();b.revealLog.push({id:r.id,at:r.revealedAt});save();await syncShare();renderReveals()});q("#revealList").querySelectorAll("[data-edit]").forEach(x=>x.onclick=()=>editReveal(+x.dataset.edit));q("#revealList").querySelectorAll("[data-rdel]").forEach(x=>x.onclick=async()=>{if(!confirm("この情報を削除しますか？"))return;b.reveals.splice(+x.dataset.rdel,1);save();await syncShare();renderReveals()})}
function editReveal(i){const r=i>=0?b.reveals[i]:{id:uuid(),title:"",target:"全員",body:"",revealed:false};const title=prompt("情報タイトル",r.title||"");if(title===null)return;const target=prompt("対象（例：全員／HO1／HO2）",r.target||"全員");if(target===null)return;const body=prompt("本文（簡易入力。保存後はバインダーページ同様HTMLとして表示）",String(r.body||"").replace(/<[^>]+>/g,""));if(body===null)return;r.title=title;r.target=target;r.body=`<p>${esc(body).replace(/\\n/g,"<br>")}</p>`;if(i<0)b.reveals.push(r);save();renderReveals()}
q("#addReveal").onclick=()=>editReveal(-1);renderReveals();
function sharePayload(){return {kind:"kp-live-share",title:sc.title||"セッション共有",updatedAt:new Date().toISOString(),items:b.reveals.filter(x=>x.revealed).sort((a,z)=>new Date(a.revealedAt)-new Date(z.revealedAt)).map(x=>({id:x.id,title:x.title,target:x.target,body:x.body,revealedAt:x.revealedAt}))}}
async function syncShare(){if(!b.shareId)return;try{await TRPG39Cloud.updateSharedPage(b.shareId,sharePayload());q("#shareStatus").textContent="共有ページを更新しました。"}catch(e){q("#shareStatus").textContent=e.message||e}}
function showShare(){q("#shareUrl").value=b.shareId?`https://sakumeru-share.sakumeru.workers.dev/?id=${encodeURIComponent(b.shareId)}&type=kp-live`:""}showShare();
q("#makeShare").onclick=async()=>{try{if(!b.shareId)b.shareId=await TRPG39Cloud.createSharedPage(sharePayload());else await syncShare();save();showShare();q("#shareStatus").textContent="共通共有URLを用意しました。以後、開示するたび同じURLを更新します。"}catch(e){q("#shareStatus").textContent=e.message||e}};
q("#copyShare").onclick=async()=>{if(!q("#shareUrl").value)return;await navigator.clipboard.writeText(q("#shareUrl").value);q("#shareStatus").textContent="共有URLをコピーしました。"};
const pcs=TRPG39.loadPCs?.()||[];q("#pcSelect").innerHTML='<option value="">PCを選択…</option>'+pcs.map(x=>`<option value="${esc(x.id)}">${esc(x.name||"PC")}</option>`).join("");
function parseSkills(t){const m={};String(t||"").split(/\\n/).forEach(l=>{const x=l.match(/^\\s*([^:：]+)[:：]\\s*(\\d+)/);if(x)m[x[1].trim()]=+x[2]});return m}
function renderPC(){q("#participants").innerHTML=b.participants.length?b.participants.map((p,i)=>`<div class="kp2-person"><div class="kp2-actions" style="justify-content:space-between"><b>${esc(p.name||"PC")}</b><button class="danger" data-prm="${i}">削除</button></div><div class="kp2-pcgrid"><label>能力値・主要数値<textarea data-ab="${i}">${esc(p.abilities||"")}</textarea></label><label>技能値（技能名：値）<textarea data-sk="${i}">${esc(p.skills||"")}</textarea></label></div></div>`).join(""):'<div class="small muted">参加PCはまだ登録されていません。</div>';q("#participants").querySelectorAll("[data-prm]").forEach(x=>x.onclick=()=>{b.participants.splice(+x.dataset.prm,1);save();renderPC()});q("#participants").querySelectorAll("[data-ab]").forEach(x=>x.oninput=()=>{b.participants[+x.dataset.ab].abilities=x.value;save()});q("#participants").querySelectorAll("[data-sk]").forEach(x=>x.oninput=()=>{b.participants[+x.dataset.sk].skills=x.value;save();renderCompare()});renderCompare()}
function renderCompare(){const maps=b.participants.map(x=>parseSkills(x.skills)),names=[...new Set(maps.flatMap(x=>Object.keys(x)))].sort((a,z)=>a.localeCompare(z,"ja"));q("#compare").innerHTML=names.length?`<table><thead><tr><th>技能</th>${b.participants.map(x=>`<th>${esc(x.name||"PC")}</th>`).join("")}</tr></thead><tbody>${names.map(n=>`<tr><td>${esc(n)}</td>${maps.map(m=>`<td>${m[n]??"—"}</td>`).join("")}</tr>`).join("")}</tbody></table>`:'<div class="small muted">技能値を入力すると比較できます。</div>'}
q("#addPc").onclick=()=>{const id=q("#pcSelect").value,x=pcs.find(v=>String(v.id)===String(id));if(!x)return;if(b.participants.some(v=>String(v.pcId)===String(id)))return alert("追加済みです。");b.participants.push({pcId:id,name:x.name||"",abilities:"",skills:""});save();renderPC()};renderPC();
</script></body></html>
