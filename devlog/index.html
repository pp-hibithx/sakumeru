<style>
.dev-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}.dev-side,.dev-main{min-width:0}.dev-list{display:grid;gap:8px}.dev-item{border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}.dev-item.active{outline:2px solid var(--line)}.dev-editor{display:grid;gap:12px}.dev-editor input,.dev-editor textarea,.dev-editor select{width:100%;box-sizing:border-box}.dev-toolbar{display:flex;gap:6px;flex-wrap:wrap}.dev-toolbar button{padding:5px 9px}.dev-image-preview{max-width:100%;max-height:360px;border-radius:10px}.dev-actions{display:flex;gap:8px;flex-wrap:wrap}.dev-public article{margin-bottom:18px}.dev-public img{max-width:100%;height:auto;border-radius:10px}.dev-body{line-height:1.85}.dev-meta{font-size:.8rem;color:var(--muted)}.dev-view-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.dev-view-tabs button.active{font-weight:700}.dev-public-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:14px}.dev-public-head h3{margin:0}.dev-public-note{font-size:.78rem;color:var(--muted);margin:3px 0 0}.dev-editor-panel[hidden],.dev-public-panel[hidden]{display:none}@media(max-width:800px){.dev-layout{grid-template-columns:1fr}}
</style></head><body><div data-site-header></div><main><div class="wrap"><div class="hero"><h2>開発日記</h2><p>SAKU+MERUができていく途中の、開発室の記録です。</p></div><p><a href="../about/index.html">← ABOUTへ戻る</a></p>
<section class="panel"><div class="dev-view-tabs"><button id="showPublic" type="button" class="active">公開画面を見る</button><button id="showEditor" type="button" class="text-action">記事を編集</button></div><div id="publicPanel" class="dev-public-panel"><div class="dev-public-head"><div><h3>公開画面</h3></div></div><div id="publicPosts" class="dev-public"></div></div><div id="editorPanel" class="dev-editor-panel" hidden><div class="dev-layout"><aside class="dev-side"><div class="dev-actions"><button id="newPost" type="button">＋ 新しい記事</button></div><div id="postList" class="dev-list" style="margin-top:12px"></div><hr><div class="small muted">記事データはこのブラウザに保存されます。</div><div class="dev-actions" style="margin-top:8px"><button id="exportPosts" type="button" class="text-action">記事を書き出す</button><label class="text-action" style="cursor:pointer">読み込む<input id="importPosts" type="file" accept="application/json" hidden></label></div></aside>
<div class="dev-main"><div id="editor" class="dev-editor"><label>日付<input id="postDate" type="date"></label><label>タイトル<input id="postTitle"></label><label>タグ<input id="postTags" placeholder="PROFILE, UI, 開発日記"></label><label>状態<select id="postStatus"><option value="published">公開</option><option value="draft">下書き</option></select></label><div><div class="dev-toolbar"><button id="boldBtn" type="button"><b>B</b></button><button id="underBtn" type="button"><u>U</u></button><button id="linkBtn" type="button">リンク</button></div><textarea id="postBody" rows="12" placeholder="本文。文字を選択して装飾できます。"></textarea></div><div><label>記事画像（DEV LOGのみ）<input id="postImage" type="file" accept="image/*"></label><input id="postImageUrl" type="url" placeholder="または画像URL https://..."><input id="postCaption" placeholder="画像キャプション"><img id="imagePreview" class="dev-image-preview" hidden></div><div class="dev-actions"><button id="savePost" type="button">保存</button><button id="deletePost" type="button" class="danger">削除</button></div></div><hr><h3>記事プレビュー</h3><div id="editorPreview" class="dev-public"></div></div></div></div></section></div></main><div data-site-footer></div><script src="../assets/js/main.js?v=0292"></script><script>
(()=>{"use strict";const KEY="sakumeru_devlog_posts_v1",$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let current="";
const seed=[{id:"first",date:"2026-08-26",title:"開発日記、はじめます。",tags:["開発日記","ABOUT"],status:"published",body:"更新内容だけでは残らない「なぜこの機能を作ったのか」や、開発中に気づいたことを置いておく場所を作りました。\n\n表のメニューには出さず、ABOUTからこっそり入れる開発室です。",image:"",caption:""}];
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"null");return Array.isArray(x)?x:seed}catch{return seed}}function saveAll(a){localStorage.setItem(KEY,JSON.stringify(a))}function rich(s){let h=esc(s||"");h=h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/__([^_]+)__/g,"<u>$1</u>");return h.replace(/\n/g,"<br>")}
function wrap(before,after=before){const ta=$("postBody"),s=ta.selectionStart,e=ta.selectionEnd,v=ta.value;ta.value=v.slice(0,s)+before+v.slice(s,e)+after+v.slice(e);ta.focus();ta.setSelectionRange(s+before.length,e+before.length)}
function render(){const a=load().sort((x,y)=>String(y.date).localeCompare(String(x.date)));$("postList").innerHTML=a.map(p=>`<div class="dev-item ${p.id===current?"active":""}" data-id="${esc(p.id)}"><b>${esc(p.title||"無題")}</b><div class="dev-meta">${esc(p.date)} / ${p.status==="draft"?"下書き":"公開"}</div></div>`).join("");document.querySelectorAll(".dev-item").forEach(x=>x.onclick=()=>edit(x.dataset.id));const pub=a.filter(p=>p.status==="published");const cards=pub.map(p=>`<article class="card devlog-entry"><div class="dev-meta">${esc(p.date)}</div><h3>${esc(p.title)}</h3>${p.image?`<figure><img src="${esc(p.image)}" alt="">${p.caption?`<figcaption class="small muted">${esc(p.caption)}</figcaption>`:""}</figure>`:""}<div class="dev-body">${rich(p.body)}</div><div class="devlog-tags">${(p.tags||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join("")}</div></article>`).join("")||'<p class="muted">公開記事はまだありません。</p>';$("publicPosts").innerHTML=cards;if($("editorPreview"))$("editorPreview").innerHTML=cards}
function edit(id){const p=load().find(x=>x.id===id);if(!p)return;current=id;$("postDate").value=p.date||"";$("postTitle").value=p.title||"";$("postTags").value=(p.tags||[]).join(", ");$("postStatus").value=p.status||"published";$("postBody").value=p.body||"";$("postImageUrl").value=p.image&& !p.image.startsWith("data:")?p.image:"";$("imagePreview").src=p.image||"";$("imagePreview").hidden=!p.image;$("imagePreview").dataset.data=p.image&&p.image.startsWith("data:")?p.image:"";$("postCaption").value=p.caption||"";render()}
function blank(){current="";$("postDate").value=new Date().toISOString().slice(0,10);$("postTitle").value=$("postTags").value=$("postBody").value=$("postImageUrl").value=$("postCaption").value="";$("postStatus").value="published";$("imagePreview").hidden=true;$("imagePreview").dataset.data="";render()}
async function imageData(file){const src=URL.createObjectURL(file);try{const im=await new Promise((r,j)=>{const x=new Image();x.onload=()=>r(x);x.onerror=j;x.src=src}),max=1280,sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c.toDataURL("image/webp",.84)}finally{URL.revokeObjectURL(src)}}
$("newPost").onclick=blank;$("boldBtn").onclick=()=>wrap("**");$("underBtn").onclick=()=>wrap("__");$("linkBtn").onclick=()=>{const u=prompt("リンク先URL","https://");if(u)wrap("[","]("+u+")")};$("postImage").onchange=async()=>{const f=$("postImage").files?.[0];if(!f)return;const d=await imageData(f);$("imagePreview").src=d;$("imagePreview").dataset.data=d;$("imagePreview").hidden=false;$("postImageUrl").value=""};$("postImageUrl").oninput=()=>{const u=$("postImageUrl").value.trim();if(u){$("imagePreview").src=u;$("imagePreview").dataset.data="";$("imagePreview").hidden=false}};
$("savePost").onclick=()=>{const a=load(),id=current||("p"+Date.now().toString(36)),p={id,date:$("postDate").value,title:$("postTitle").value.trim(),tags:$("postTags").value.split(/[,、]/).map(x=>x.trim()).filter(Boolean),status:$("postStatus").value,body:$("postBody").value,image:$("imagePreview").dataset.data||$("postImageUrl").value.trim(),caption:$("postCaption").value.trim()};const i=a.findIndex(x=>x.id===id);if(i>=0)a[i]=p;else a.push(p);saveAll(a);current=id;render();alert("保存しました")};$("deletePost").onclick=()=>{if(!current||!confirm("この記事を削除しますか？"))return;saveAll(load().filter(x=>x.id!==current));blank()};const setView=mode=>{const pub=mode==="public";$("publicPanel").hidden=!pub;$("editorPanel").hidden=pub;$("showPublic").classList.toggle("active",pub);$("showEditor").classList.toggle("active",!pub)};$("showPublic").onclick=()=>setView("public");$("showEditor").onclick=()=>setView("editor");
$("exportPosts").onclick=()=>{const b=new Blob([JSON.stringify(load(),null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="sakumeru-devlog.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$("importPosts").onchange=async()=>{const f=$("importPosts").files?.[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!Array.isArray(x))throw 0;saveAll(x);blank()}catch{alert("記事データを読み込めませんでした")}};blank();render()})();
</script></body></html>
