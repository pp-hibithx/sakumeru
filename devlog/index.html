(()=>{"use strict";
const KEY="sakumeru_devlog_posts_v1",$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let current="",savedRange=null;
const seed=[{id:"first",date:"2026-08-26",title:"開発日記、はじめます。",tags:["開発日記","ABOUT"],status:"published",body:"更新内容だけでは残らない「なぜこの機能を作ったのか」や、開発中に気づいたことを置いておく場所を作りました。\n\n表のメニューには出さず、ABOUTからこっそり入れる開発室です。",image:"",caption:""}];

function legacyRich(s){let h=esc(s||"");h=h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/__([^_]+)__/g,"<u>$1</u>");return h.split(/\n{2,}/).map(x=>`<p>${x.replace(/\n/g,"<br>")||"<br>"}</p>`).join("")}
function blocksToHtml(bs=[]){return bs.map(b=>b.type==="image"?(b.url?`<figure><img src="${esc(b.url)}" alt="${esc(b.caption||"")}">${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:""}</figure>`:""):legacyRich(b.text||"")).join("")}
function normalize(p){
 if(p.richHtml!=null)return {...p,blocks:Array.isArray(p.blocks)?p.blocks:[]};
 const blocks=Array.isArray(p.blocks)?p.blocks:[];let richHtml=blocks.length?blocksToHtml(blocks):legacyRich(p.body||"");
 if(!richHtml&&p.image)richHtml=`<figure><img src="${esc(p.image)}" alt="${esc(p.caption||"")}">${p.caption?`<figcaption>${esc(p.caption)}</figcaption>`:""}</figure>`;
 return {...p,blocks,richHtml:richHtml||"<p><br></p>"}
}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"null");return (Array.isArray(x)?x:seed).map(normalize)}catch{return seed.map(normalize)}}
function saveAll(a){localStorage.setItem(KEY,JSON.stringify(a))}
function cleanEditorHtml(){
 const c=$("devRichEditor").cloneNode(true);
 c.querySelectorAll(".dev-image-remove").forEach(x=>x.remove());
 c.querySelectorAll("[contenteditable]").forEach(x=>x.removeAttribute("contenteditable"));

function saveRange(){const sel=getSelection();if(sel&&sel.rangeCount){const r=sel.getRangeAt(0);if($("devRichEditor").contains(r.commonAncestorContainer))savedRange=r.cloneRange()}}

function exec(cmd,val=null){restoreRange();document.execCommand("styleWithCSS",false,true);document.execCommand(cmd,false,val);saveRange();previewEditor()}

function updateGridCounts(root=document){root.querySelectorAll(".dev-image-grid").forEach(g=>{const n=g.querySelectorAll(":scope > figure").length;g.style.setProperty("--img-count",Math.max(1,Math.min(4,n)));if(!n)g.remove()})}
async function imageData(file,max=1600,quality=.84){const src=URL.createObjectURL(file);try{const im=await new Promise((r,j)=>{const x=new Image();x.onload=()=>r(x);x.onerror=j;x.src=src});const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c.toDataURL("image/webp",quality)}finally{URL.revokeObjectURL(src)}}
function ytEmbed(u){try{const x=new URL(u);let id="";if(x.hostname.includes("youtu.be"))id=x.pathname.slice(1);else if(x.hostname.includes("youtube.com")){if(x.pathname==="/watch")id=x.searchParams.get("v")||"";else{const m=x.pathname.match(/\/(?:shorts|embed)\/([^/?]+)/);id=m?.[1]||""}}return id?`https://www.youtube.com/embed/${encodeURIComponent(id)}`:""}catch{return ""}}

$("devVideo").onclick=()=>{const mode=confirm("OK：動画ファイルを選択\nキャンセル：URLを入力");if(mode){const i=document.createElement("input");i.type="file";i.accept="video/*";i.onchange=()=>{const f=i.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>insertHtml(`<div class="dev-media-card" contenteditable="false"><video controls src="${String(r.result||"")}"></video><div>${esc(f.name)}</div></div><p><br></p>`);r.readAsDataURL(f)};i.click()}else{const u=prompt("YouTube URL または動画URL");if(!u)return;const y=ytEmbed(u);insertHtml(y?`<div class="dev-media-card" contenteditable="false"><iframe src="${esc(y)}" allowfullscreen></iframe></div><p><br></p>`:`<div class="dev-media-card"><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a></div><p><br></p>`)}};
$("devLightboxClose").onclick=closeLightbox;$("devLightbox").onclick=e=>{if(e.target===$("devLightbox"))closeLightbox()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLightbox()});

$("newPost").onclick=blank;["postDate","postTitle","postTags","postStatus"].forEach(id=>$(id).addEventListener(id==="postStatus"?"change":"input",previewEditor));
$("savePost").onclick=()=>{const a=load(),id=current||("p"+Date.now().toString(36)),richHtml=cleanEditorHtml(),p={id,date:$("postDate").value,title:$("postTitle").value.trim(),tags:$("postTags").value.split(/[,、]/).map(x=>x.trim()).filter(Boolean),status:$("postStatus").value,richHtml,blocks:[],body:$("devRichEditor").innerText.trim(),image:"",caption:""};const i=a.findIndex(x=>x.id===id);if(i>=0)a[i]=p;else a.push(p);saveAll(a);current=id;render();alert("保存しました")};
$("deletePost").onclick=()=>{if(!current||!confirm("この記事を削除しますか？"))return;saveAll(load().filter(x=>x.id!==current));blank()};
const setView=mode=>{const pub=mode==="public";$("publicPanel").hidden=!pub;$("editorPanel").hidden=pub;$("showPublic").classList.toggle("active",pub);$("showEditor").classList.toggle("active",!pub)};$("showPublic").onclick=()=>setView("public");$("showEditor").onclick=()=>setView("editor");
$("exportPosts").onclick=()=>{const b=new Blob([JSON.stringify(load(),null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="sakumeru-devlog.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$("importPosts").onchange=async()=>{const f=$("importPosts").files?.[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!Array.isArray(x))throw 0;saveAll(x.map(normalize));blank()}catch{alert("記事データを読み込めませんでした")}};
blank();render()
})();
</script></body></html>
