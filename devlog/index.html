</head><body><div data-site-header></div><main><div class="wrap"><div class="hero"><h2>開発日記</h2><p>SAKU+MERUができていく途中の、開発室の記録です。</p></div><p><a href="../about/index.html">← ABOUTへ戻る</a></p>
<section class="panel"><div class="dev-view-tabs"><button id="showPublic" type="button" class="active">公開画面を見る</button><button id="showEditor" type="button" class="text-action">記事を編集</button></div><div id="publicPanel" class="dev-public-panel"><div class="dev-public-head"><div><h3>公開画面</h3></div></div><div id="publicPosts" class="dev-public"></div></div><div id="editorPanel" class="dev-editor-panel" hidden><div class="dev-layout"><aside class="dev-side"><div class="dev-actions"><button id="newPost" type="button">＋ 新しい記事</button></div><div id="postList" class="dev-list" style="margin-top:12px"></div><hr><div class="small muted">記事データはこのブラウザに保存されます。</div><div class="dev-actions" style="margin-top:8px"><button id="exportPosts" type="button" class="text-action">記事を書き出す</button><label class="text-action" style="cursor:pointer">読み込む<input id="importPosts" type="file" accept="application/json" hidden></label></div></aside>
<div class="dev-main"><div id="editor" class="dev-editor"><label>日付<input id="postDate" type="date"></label><label>タイトル<input id="postTitle"></label><label>タグ<input id="postTags" placeholder="PROFILE, UI, 開発日記"></label><label>状態<select id="postStatus"><option value="published">公開</option><option value="draft">下書き</option></select></label><div><div class="dev-article-toolbar"><button id="addTextBlock" type="button">＋ 文章</button><button id="addImageBlock" type="button">＋ 画像</button></div><div id="postBlocks" class="dev-blocks"></div></div><div class="dev-actions"><button id="savePost" type="button">保存</button><button id="deletePost" type="button" class="danger">削除</button></div></div><hr><h3>記事プレビュー</h3><div id="editorPreview" class="dev-public"></div></div></div></div></section></div></main><div data-site-footer></div><script src="../assets/js/main.js?v=0292"></script><script>
(()=>{"use strict";
const KEY="sakumeru_devlog_posts_v1",$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let current="";
const seed=[{id:"first",date:"2026-08-26",title:"開発日記、はじめます。",tags:["開発日記","ABOUT"],status:"published",body:"更新内容だけでは残らない「なぜこの機能を作ったのか」や、開発中に気づいたことを置いておく場所を作りました。\n\n表のメニューには出さず、ABOUTからこっそり入れる開発室です。",image:"",caption:""}];
function normalize(p){if(Array.isArray(p.blocks))return p;const blocks=[];if(p.body)blocks.push({type:"text",text:p.body});if(p.image)blocks.push({type:"image",url:p.image,caption:p.caption||""});return {...p,blocks}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"null");return (Array.isArray(x)?x:seed).map(normalize)}catch{return seed.map(normalize)}}function saveAll(a){localStorage.setItem(KEY,JSON.stringify(a))}
function rich(s){let h=esc(s||"");h=h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/__([^_]+)__/g,"<u>$1</u>");return h.replace(/\n/g,"<br>")}
function wrap(ta,before,after=before){const a=ta.selectionStart,b=ta.selectionEnd,v=ta.value;ta.value=v.slice(0,a)+before+v.slice(a,b)+after+v.slice(b);ta.focus();ta.setSelectionRange(a+before.length,b+before.length);previewEditor()}
function blockRow(b={type:"text"}){const row=document.createElement("div");row.className="dev-block";row.dataset.type=b.type||"text";const type=row.dataset.type;
 row.innerHTML=`<div class="dev-block-head"><span class="dev-block-label">${type==="image"?"画像":"文章"}</span><div class="dev-block-actions"><button type="button" class="up text-action">↑</button><button type="button" class="down text-action">↓</button><button type="button" class="danger del">削除</button></div></div>${type==="image"?`<div class="dev-image-inputs"><label>画像<input class="img-file" type="file" accept="image/*"></label><label>画像URL<input class="img-url" type="url" placeholder="https://..." value="${esc(b.url&&!String(b.url).startsWith("data:")?b.url:"")}"></label></div><input class="img-data" type="hidden" value="${esc(b.url&&String(b.url).startsWith("data:")?b.url:"")}"><input class="img-caption" placeholder="画像キャプション" value="${esc(b.caption||"")}"><img class="img-preview" ${b.url?`src="${esc(b.url)}"`:"hidden"}>`:`<div class="dev-text-toolbar"><button type="button" class="b"><b>B</b></button><button type="button" class="u"><u>U</u></button><button type="button" class="lnk">リンク</button></div><textarea class="txt" rows="7" placeholder="本文">${esc(b.text||"")}</textarea>`}`;
 row.querySelector('.del').onclick=()=>{row.remove();previewEditor()};row.querySelector('.up').onclick=()=>{const x=row.previousElementSibling;if(x)row.parentNode.insertBefore(row,x);previewEditor()};row.querySelector('.down').onclick=()=>{const x=row.nextElementSibling;if(x)row.parentNode.insertBefore(x,row);previewEditor()};
 if(type==="text"){const ta=row.querySelector('.txt');row.querySelector('.b').onclick=()=>wrap(ta,"**");row.querySelector('.u').onclick=()=>wrap(ta,"__");row.querySelector('.lnk').onclick=()=>{const u=prompt("リンク先URL","https://");if(u)wrap(ta,"[","]("+u+")")};ta.oninput=previewEditor}else{const url=row.querySelector('.img-url'),data=row.querySelector('.img-data'),img=row.querySelector('.img-preview');url.oninput=()=>{if(url.value.trim()){data.value="";img.src=url.value.trim();img.hidden=false}previewEditor()};row.querySelector('.img-caption').oninput=previewEditor;row.querySelector('.img-file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;const d=await imageData(f);data.value=d;url.value="";img.src=d;img.hidden=false;previewEditor()}}
 return row}
function addBlock(b){$("postBlocks").appendChild(blockRow(b));previewEditor()}
function blocks(){return [...$("postBlocks").children].map(r=>r.dataset.type==="image"?{type:"image",url:r.querySelector('.img-data').value||r.querySelector('.img-url').value.trim(),caption:r.querySelector('.img-caption').value.trim()}:{type:"text",text:r.querySelector('.txt').value}).filter(b=>b.type==="image"?b.url:b.text.trim())}
function blocksHtml(bs){return `<div class="dev-render">${(bs||[]).map(b=>b.type==="image"?(b.url?`<figure><img src="${esc(b.url)}" alt="${esc(b.caption||"")}">${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:""}</figure>`:""):`<div class="dev-render-text">${rich(b.text)}</div>`).join("")}</div>`}
function render(){const a=load().sort((x,y)=>String(y.date).localeCompare(String(x.date)));$("postList").innerHTML=a.map(p=>`<div class="dev-item ${p.id===current?"active":""}" data-id="${esc(p.id)}"><b>${esc(p.title||"無題")}</b><div class="dev-meta">${esc(p.date)} / ${p.status==="draft"?"下書き":"公開"}</div></div>`).join("");document.querySelectorAll(".dev-item").forEach(x=>x.onclick=()=>edit(x.dataset.id));const pub=a.filter(p=>p.status==="published");$("publicPosts").innerHTML=pub.map(cardHtml).join("")||'<p class="muted">公開記事はまだありません。</p>';previewEditor()}
function cardHtml(p){return `<article class="card devlog-entry"><div class="dev-meta">${esc(p.date)}</div><h3>${esc(p.title)}</h3>${blocksHtml(p.blocks)}<div class="devlog-tags">${(p.tags||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join("")}</div></article>`}
function previewEditor(){if(!$("editorPreview"))return;const p={date:$("postDate").value,title:$("postTitle").value||"無題",tags:$("postTags").value.split(/[,、]/).map(x=>x.trim()).filter(Boolean),blocks:blocks()};$("editorPreview").innerHTML=cardHtml(p)}
function edit(id){const p=load().find(x=>x.id===id);if(!p)return;current=id;$("postDate").value=p.date||"";$("postTitle").value=p.title||"";$("postTags").value=(p.tags||[]).join(", ");$("postStatus").value=p.status||"published";$("postBlocks").innerHTML="";(p.blocks||[]).forEach(addBlock);render()}
function blank(){current="";$("postDate").value=new Date().toISOString().slice(0,10);$("postTitle").value=$("postTags").value="";$("postStatus").value="published";$("postBlocks").innerHTML="";addBlock({type:"text",text:""});render()}
async function imageData(file){const src=URL.createObjectURL(file);try{const im=await new Promise((r,j)=>{const x=new Image();x.onload=()=>r(x);x.onerror=j;x.src=src}),max=1280,sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c.toDataURL("image/webp",.84)}finally{URL.revokeObjectURL(src)}}
$("newPost").onclick=blank;$("addTextBlock").onclick=()=>addBlock({type:"text"});$("addImageBlock").onclick=()=>addBlock({type:"image"});["postDate","postTitle","postTags","postStatus"].forEach(id=>$(id).addEventListener(id==="postStatus"?"change":"input",previewEditor));
$("savePost").onclick=()=>{const a=load(),id=current||("p"+Date.now().toString(36)),bs=blocks(),p={id,date:$("postDate").value,title:$("postTitle").value.trim(),tags:$("postTags").value.split(/[,、]/).map(x=>x.trim()).filter(Boolean),status:$("postStatus").value,blocks:bs,body:bs.filter(x=>x.type==="text").map(x=>x.text).join("\n\n"),image:"",caption:""};const i=a.findIndex(x=>x.id===id);if(i>=0)a[i]=p;else a.push(p);saveAll(a);current=id;render();alert("保存しました")};
$("deletePost").onclick=()=>{if(!current||!confirm("この記事を削除しますか？"))return;saveAll(load().filter(x=>x.id!==current));blank()};const setView=mode=>{const pub=mode==="public";$("publicPanel").hidden=!pub;$("editorPanel").hidden=pub;$("showPublic").classList.toggle("active",pub);$("showEditor").classList.toggle("active",!pub)};$("showPublic").onclick=()=>setView("public");$("showEditor").onclick=()=>setView("editor");
$("exportPosts").onclick=()=>{const b=new Blob([JSON.stringify(load(),null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="sakumeru-devlog.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$("importPosts").onchange=async()=>{const f=$("importPosts").files?.[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!Array.isArray(x))throw 0;saveAll(x.map(normalize));blank()}catch{alert("記事データを読み込めませんでした")}};blank();render()})();
</script></body></html>
