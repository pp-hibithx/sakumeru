     const names=new Map(scenarios.map(s=>[String(s.id),s.title||"シナリオ"]));
     const rows=Object.entries(all||{}).map(([scenarioId,binder])=>({
       scenarioId:String(scenarioId),
       scenarioTitle:String(binder?.scenarioTitle||names.get(String(scenarioId))||"シナリオ"),
       openedAt:String(binder?.lastOpenedAt||"")
     })).filter(v=>v.scenarioId&&v.openedAt);
     rows.sort((a,b)=>String(b.openedAt).localeCompare(String(a.openedAt)));
     x=rows[0]||null;
   }catch{}
 }

 if(!x?.scenarioId){panel.hidden=true;return}

 const title=x.scenarioTitle||"シナリオ";
 const href=`scenario/kp-binder.html?id=${encodeURIComponent(x.scenarioId)}`;
 let meta="すぐに続きから開けます";
 if(x.openedAt){
   const d=new Date(x.openedAt);
   if(!Number.isNaN(d.getTime())){
     meta=`最終アクセス ${d.toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}`;
   }
 }
 body.innerHTML=`<a class="home-task" href="${href}"><div class="home-task-main"><div class="home-task-title">${esc(title)}</div><div class="home-task-meta">${esc(meta)}</div></div><div class="home-task-due">KPバインダーを開く →</div></a>`;
 panel.hidden=false;
}
function renderPrepTasks(){
 let all={};try{all=JSON.parse(localStorage.getItem(KEY)||"{}")}catch{}
 const scenarios=loadScenarios(), names=new Map(scenarios.map(s=>[String(s.id),s.title||"シナリオ"])), tasks=[];
 Object.entries(all||{}).forEach(([sid,scopes])=>{
   Object.entries(scopes||{}).forEach(([scope,labels])=>{
     Object.entries(labels||{}).forEach(([label,items])=>{
       (Array.isArray(items)?items:[]).forEach(item=>{
         const deadline=String(item.deadline||"").split("T")[0];
         if(item.done||!deadline)return;
         tasks.push({sid,scope,label,item,deadline,title:names.get(String(sid))||"シナリオ未指定"});
       });
     });
   });
 });
 tasks.sort((a,b)=>a.deadline.localeCompare(b.deadline)||a.title.localeCompare(b.title,"ja"));
 const panel=document.getElementById("prepTasks"),list=document.getElementById("prepTaskList"),count=document.getElementById("prepTaskCount");
 if(!panel||!list||!count)return;
 if(!tasks.length){panel.hidden=true;return}
 panel.hidden=false;count.textContent=`未完了 ${tasks.length}件`;
 list.innerHTML=tasks.map(t=>{
   const diff=dayDiff(t.deadline), cls=diff<0?" home-task-overdue":diff===0?" home-task-today":"";
   const label=t.label&&t.label!=="_"?`・${t.label}`:"";
   const href=`prep/index.html?scenario=${encodeURIComponent(t.sid)}&scope=${encodeURIComponent(t.scope)}&label=${encodeURIComponent(t.label||"_")}`;
   return `<a class="home-task${cls}" href="${href}"><div class="home-task-main"><div class="home-task-title">${esc(t.item.title)}</div><div class="home-task-meta">${esc(t.title)}${esc(label)} ／ 締切 ${esc(t.deadline.replaceAll("-","/"))}</div></div><div class="home-task-due">${esc(dueText(t.deadline))}</div></a>`;
 }).join("");
}
function renderHomePanels(){if(syncExpiredTimer())return;renderHomeGuide();renderPomodoro();renderWorkLog();renderPrepTasks();renderHomeConcierge();startHomeTimerTick()}
document.getElementById("openHomeFavorites")?.addEventListener("click",openHomeFavorites);
document.getElementById("saveHomeFavorites")?.addEventListener("click",saveHomeFavorites);
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",renderHomePanels);else renderHomePanels();
})();
</script>
