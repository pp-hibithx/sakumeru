</div></main><div data-site-footer></div><script>
(()=>{"use strict";
const KEY="39x2_prep_v1";
const HOME_GUIDE_SETTINGS_KEY="trpg39_home_guide_v1";
const HOME_TUTORIAL_KEY="trpg39_home_tutorial_v1",POMODORO_KEY="trpg39_home_pomodoro_v1",WORK_LOG_KEY="trpg39_work_logs_v1";
// 初期ナビゲーターはユーザーPCとは別のアプリ固定アセット。ファイル配置後はこの1か所だけで参照する。
const INITIAL_GUIDE_ASSET="./assets/img/home-guide-shirato-mini.png";
const POMODORO_MODES={focus:{label:"25分集中",durationSec:1500},short:{label:"5分休憩",durationSec:300},long:{label:"15分休憩",durationSec:900}};
const POMODORO_LINES={focusStart:"では、25分だけ集中しましょう。",focusPaused:"一時停止しました。作業時間には含めません。",focusDone:"お疲れさまでした。どこまで進みました？",breakStart:"少し休みましょう。",breakDone:"そろそろ戻りますか？"};
const HOME_TUTORIAL_STEPS=[
 "初めまして。SAKU+MERUにようこそ。当サイトの案内役・白十字と申します。まず初めにこのサイトの簡単な使い方をご案内しますね。",
 "SCENARIOは、遊びたい・通過したシナリオを整理する棚です。",
 "CALENDARでは今後の予定と、いつ遊んだかを日付から確認できます。",
 "LIBRARYは卓記録を探し、読み、残すための場所です。",
 "PCは自分の探索者を管理する正本。PLAYERSでは一緒に遊んだ方を確認できます。",
 "SHAREは公開を選んだ情報だけを共有します。TOOLSには卓を支える小道具があります。",
 "案内は以上です。HOMEには、お好きなPCを案内人として表示することもできます。"
];
const HOME_GUIDE_PERIODS={lateNight:[0,5],morning:[5,11],afternoon:[11,16],evening:[16,19],night:[19,24]};
const HOME_GUIDE_DEFAULT_LINES={
 morning:["おはよう。今日の予定を確認しよう。"],afternoon:["今日も記録を整えていこう。"],evening:["夕方だ。今夜の予定を確認しておこう。"],night:["こんばんは。今日の卓を振り返る？"],lateNight:["深夜だ。無理は禁物だよ。"],
 sessionToday:["今日は{time}から{scenario}。{runName}の予定だ。"],sessionSoon:["{scenario}まであと1時間以内だ。準備はできている？"],noSchedule:["今日は予定なし。過去の記録を眺めるのもいいね。"],anniversary:["{years}年前の今日は「{scenario}」の記録があるよ。"]
};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let homeScenariosCache=null,homeTutorialOpen=false,homeTimerTick=0,homeConciergeOpen=false;
function localYmd(d=new Date()){const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function dayDiff(ymd){const [y,m,d]=String(ymd).split("-").map(Number),t=new Date(y,m-1,d),now=new Date();now.setHours(0,0,0,0);return Math.round((t-now)/86400000)}
function dueText(ymd){const n=dayDiff(ymd);if(n<0)return `期限切れ ${Math.abs(n)}日`;if(n===0)return "今日";if(n===1)return "明日";return `あと${n}日`}
function loadScenarios(){
 if(homeScenariosCache)return homeScenariosCache;
 try{
   if(window.TRPG39?.loadScenarios){homeScenariosCache=window.TRPG39.loadScenarios()||[];return homeScenariosCache}
   return [];
 }catch{return []}
}
function homeGuideSettings(){try{const v=JSON.parse(localStorage.getItem(HOME_GUIDE_SETTINGS_KEY)||"{}");return v&&typeof v==="object"?v:{}}catch{return {}}}
function guidePeriod(date=new Date()){const hour=date.getHours();return Object.entries(HOME_GUIDE_PERIODS).find(([,range])=>hour>=range[0]&&hour<range[1])?.[0]||"lateNight"}
function dateKey(value){const raw=String(value||"");if(/^\d{4}-\d{2}-\d{2}/.test(raw))return raw.slice(0,10);const d=new Date(raw);return Number.isNaN(d.getTime())?"":localYmd(d)}
function clockText(event){const raw=String(event?.start||event?.startTime||"");const m=raw.match(/(?:T|\s)(\d{2}:\d{2})/)||raw.match(/^(\d{1,2}:\d{2})/);return m?m[1]:"時間未定"}
function eventDate(event,kind="start"){const direct=String(event?.[kind]||"");if(direct&&/T|\s\d{1,2}:\d{2}/.test(direct)){const d=new Date(direct);if(!Number.isNaN(d.getTime()))return d}const day=dateKey(event?.date||event?.start),time=String(event?.[kind+"Time"]||event?.[kind]||"").match(/\d{1,2}:\d{2}/)?.[0];if(!day||!time)return null;const d=new Date(`${day}T${time}:00`);return Number.isNaN(d.getTime())?null:d}
function eventScenarioTitle(event,scenarioMap){return String(scenarioMap.get(String(event?.scenarioId||""))?.title||event?.scenarioTitle||event?.title||"予定").trim()}
function stableIndex(seed,length){let h=2166136261;for(const ch of String(seed)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return length?Math.abs(h>>>0)%length:0}
function applyGuideTemplate(line,values){return String(line||"").replace(/\{(time|scenario|runName|count|years)\}/g,(_,key)=>String(values[key]??""))}
function guideLineFor(pc,category,period,values,today){const own=pc.guideLines&&typeof pc.guideLines==="object"?pc.guideLines:{},categories=[category,period,!today.length?"noSchedule":""].filter(Boolean);let chosenCategory="",lines=[];for(const key of categories){lines=Array.isArray(own[key])?own[key].filter(Boolean):[];if(!lines.length)lines=HOME_GUIDE_DEFAULT_LINES[key]||[];if(lines.length){chosenCategory=key;break}}if(!lines.length)return {category:period,line:"今日もSAKU+MERUを案内するよ。"};const seed=`${localYmd()}|${period}|${pc.id}|${chosenCategory}`;return {category:chosenCategory,line:applyGuideTemplate(lines[stableIndex(seed,lines.length)],values)}}
function guideImage(pc,category){const config=pc.guideVariants&&typeof pc.guideVariants==="object"?pc.guideVariants:{},variantId=String(config[category]||config.default||"");if(variantId&&variantId!=="__main__"){const hit=(Array.isArray(pc.variants)?pc.variants:[]).find(v=>String(v?.id||"")===variantId&&v.url);if(hit)return hit.url}return String(pc.image||"").trim()}
function readJson(key,fallback){try{const v=JSON.parse(localStorage.getItem(key)||"");return v??fallback}catch{return fallback}}
function writeJson(key,value){localStorage.setItem(key,JSON.stringify(value))}
function tutorialState(){const v=readJson(HOME_TUTORIAL_KEY,{});return v&&typeof v==="object"?v:{}}
function initialGuideArtHtml(){return `<figure class="home-initial-guide-figure"><div class="home-guide-art"><img src="${esc(INITIAL_GUIDE_ASSET)}" alt="案内役・白十字" onerror="this.closest('section').classList.add('home-guide-no-art');this.closest('.home-initial-guide-figure').hidden=true"></div><figcaption>白十字</figcaption></figure>`}
function bindTutorialButtons(){const host=document.getElementById("homeGuide");host?.querySelector("[data-tutorial-next]:not([data-back])")?.addEventListener("click",()=>{const state=tutorialState(),next=Math.min(HOME_TUTORIAL_STEPS.length-1,Number(state.step||0)+1);writeJson(HOME_TUTORIAL_KEY,{...state,step:next,completed:!!state.completed,updatedAt:new Date().toISOString()});renderHomeGuide()});host?.querySelector("[data-tutorial-finish]")?.addEventListener("click",()=>{writeJson(HOME_TUTORIAL_KEY,{completed:true,step:HOME_TUTORIAL_STEPS.length-1,updatedAt:new Date().toISOString()});homeTutorialOpen=false;renderHomeGuide()});host?.querySelector("[data-tutorial-close]")?.addEventListener("click",()=>{homeTutorialOpen=false;renderHomeGuide()});host?.querySelector("[data-guide-help]")?.addEventListener("click",()=>{const state=tutorialState();writeJson(HOME_TUTORIAL_KEY,{...state,step:0,completed:true,updatedAt:new Date().toISOString()});homeTutorialOpen=true;renderHomeGuide()})}
function renderTutorial(host,state){const step=Math.max(0,Math.min(HOME_TUTORIAL_STEPS.length-1,Number(state.step||0))),last=step===HOME_TUTORIAL_STEPS.length-1;host.innerHTML=`${initialGuideArtHtml()}<div><div class="home-guide-head"><div class="small muted">SAKU+MERU 案内人　${step+1}/${HOME_TUTORIAL_STEPS.length}</div>${state.completed?'<button type="button" class="home-guide-help" data-tutorial-close>閉じる</button>':""}</div><div class="home-guide-line">${esc(HOME_TUTORIAL_STEPS[step])}</div><div class="home-tutorial-actions">${step>0?'<button type="button" data-tutorial-next data-back>前へ</button>':""}${last?'<button type="button" data-tutorial-finish>案内を終える</button>':'<button type="button" data-tutorial-next>次へ</button>'}</div></div>`;const back=host.querySelector("[data-back]");if(back)back.onclick=()=>{writeJson(HOME_TUTORIAL_KEY,{...state,step:Math.max(0,step-1),completed:!!state.completed,updatedAt:new Date().toISOString()});renderHomeGuide()};bindTutorialButtons();host.hidden=false}
function timerState(){const raw=readJson(POMODORO_KEY,{}),mode=POMODORO_MODES[raw?.mode]?raw.mode:"focus";return {mode,durationSec:Number(raw?.durationSec)||POMODORO_MODES[mode].durationSec,status:["running","paused"].includes(raw?.status)?raw.status:"idle",startedAt:String(raw?.startedAt||""),lastResumedAt:String(raw?.lastResumedAt||""),elapsedSec:Math.max(0,Number(raw?.elapsedSec)||0),title:String(raw?.title||""),pcId:String(raw?.pcId||""),scenarioId:String(raw?.scenarioId||""),runId:String(raw?.runId||""),albumId:String(raw?.albumId||""),taskId:String(raw?.taskId||""),pendingLogId:String(raw?.pendingLogId||""),message:String(raw?.message||"")}}
function saveTimerState(state){writeJson(POMODORO_KEY,state);return state}
function timerElapsed(state,now=Date.now()){const resumed=Date.parse(state.lastResumedAt||"");return Math.min(state.durationSec,Math.max(0,Math.floor(state.elapsedSec+(state.status==="running"&&Number.isFinite(resumed)?(now-resumed)/1000:0))))}
function timerRemaining(state,now=Date.now()){return Math.max(0,state.durationSec-timerElapsed(state,now))}
function timerSpeech(){const s=timerState();if(s.message)return s.message;if(s.status==="running")return s.mode==="focus"?POMODORO_LINES.focusStart:POMODORO_LINES.breakStart;if(s.status==="paused")return s.mode==="focus"?POMODORO_LINES.focusPaused:"休憩を一時停止しています。";return ""}
function workLogs(){const rows=readJson(WORK_LOG_KEY,[]);return Array.isArray(rows)?rows:[]}
function saveWorkLogs(rows){writeJson(WORK_LOG_KEY,Array.isArray(rows)?rows:[])}
function uuid(){return crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`}
function finishTimer(state,automatic=false){const now=new Date(),durationSec=timerElapsed(state,now.getTime());let pendingLogId="";if(state.mode==="focus"&&durationSec>0){pendingLogId=uuid();const logs=workLogs();logs.unshift({id:pendingLogId,startedAt:state.startedAt||now.toISOString(),endedAt:now.toISOString(),durationSec,title:state.title,progress:"",pcId:state.pcId,scenarioId:state.scenarioId,runId:state.runId,albumId:state.albumId,taskId:state.taskId});saveWorkLogs(logs)}const message=state.mode==="focus"?POMODORO_LINES.focusDone:POMODORO_LINES.breakDone;saveTimerState({...state,status:"idle",elapsedSec:0,lastResumedAt:"",startedAt:"",pendingLogId,message});renderHomePanels();return automatic}
function syncExpiredTimer(){const state=timerState();if(state.status==="running"&&timerRemaining(state)<=0){finishTimer(state,true);return true}return false}
function formatDuration(sec){sec=Math.max(0,Math.floor(Number(sec)||0));const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h?`${h}時間${String(m).padStart(2,"0")}分`:`${m}分`}
function formatClock(sec){sec=Math.max(0,Math.ceil(Number(sec)||0));return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`}
function prepTaskRows(){const all=readJson(KEY,{}),scenarios=loadScenarios(),names=new Map(scenarios.map(s=>[String(s.id),s.title||"シナリオ"])),rows=[];Object.entries(all||{}).forEach(([scenarioId,scopes])=>Object.entries(scopes||{}).forEach(([scope,labels])=>Object.entries(labels||{}).forEach(([label,items])=>(Array.isArray(items)?items:[]).forEach((item,index)=>rows.push({id:String(item.id||""),title:String(item.title||""),done:!!item.done,index,scenarioId,scope,label,scenarioTitle:names.get(String(scenarioId))||"シナリオ未指定"})))));return rows.filter(x=>x.id)}
function optionHtml(rows,value,label){return `<option value="">${esc(label)}</option>`+rows.map(x=>`<option value="${esc(x.id)}" ${String(value)===String(x.id)?"selected":""}>${esc(x.name||x.title)}</option>`).join("")}
function focusHomeTarget(target){if(!target)return false;if(target.tagName==="DETAILS")target.open=true;if(!target.hasAttribute("tabindex"))target.setAttribute("tabindex","-1");target.scrollIntoView({behavior:"smooth",block:"center"});target.focus({preventScroll:true});return true}
function renderHomeConcierge(){

   if(action==="tutorial"){const state=tutorialState();writeJson(HOME_TUTORIAL_KEY,{...state,step:0,completed:!!state.completed,updatedAt:new Date().toISOString()});homeTutorialOpen=true;homeConciergeOpen=false;renderHomeGuide();renderHomeConcierge();focusHomeTarget(document.getElementById("homeGuide"));return}

function renderHomeGuide(){

 const now=new Date(),todayKey=localYmd(now),period=guidePeriod(now),scenarios=loadScenarios(),scenarioMap=new Map(scenarios.map(s=>[String(s.id),s]));
 const allToday=(window.TRPG39?.loadEvents?.()||[]).filter(e=>dateKey(e.date||e.start)===todayKey&&!/中止|cancel/i.test(String(e.status||""))).sort((a,b)=>String(a.start||a.startTime||"").localeCompare(String(b.start||b.startTime||"")));

 const md=todayKey.slice(5),anniversaries=(window.TRPG39?.loadAlbum?.()||[]).filter(a=>dateKey(a.date||a.start).slice(5)===md&&dateKey(a.date||a.start)<todayKey).sort((a,b)=>String(b.date||b.start||"").localeCompare(String(a.date||a.start||"")));
 const anniversary=anniversaries[0]||null,primary=soon||activeToday[0]||anniversary||null,primaryDate=dateKey(primary?.date||primary?.start),years=primaryDate?now.getFullYear()-Number(primaryDate.slice(0,4)):0;
 const values={time:primary?clockText(primary):"",scenario:primary?eventScenarioTitle(primary,scenarioMap):"",runName:String(primary?.runLabel||primary?.runName||"").trim(),count:activeToday.length||anniversaries.length,years};
 let category=soon?"sessionSoon":activeToday.length?"sessionToday":anniversary?"anniversary":period;
 const speech=guideLineFor(pc,category,period,values,allToday),image=guideImage(pc,speech.category),runtimeLine=timerSpeech();
 host.innerHTML=`${image?`<div class="home-guide-art"><img src="${esc(image)}" alt="${esc(pc.name||"案内人")}の立ち絵"></div>`:'<div class="home-guide-art home-guide-art-placeholder">🌺</div>'}<div class="home-guide-body"><div class="home-guide-head"><div><h2 class="home-guide-name">${esc(pc.name||"案内人")}</h2><div class="small muted">${esc(now.toLocaleString("ja-JP",{month:"long",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit"}))}</div></div><button type="button" class="home-guide-help" data-guide-help>？ 使い方</button></div><div class="home-guide-line">${esc(runtimeLine||speech.line)}</div>${allToday.length?`<div class="home-guide-schedule"><strong>今日の予定</strong>${allToday.map(e=>`<div class="home-guide-event"><span class="home-guide-time">${esc(clockText(e))}</span><span><strong>${esc(eventScenarioTitle(e,scenarioMap))}</strong>${e.runLabel?`<br><span class="small muted">${esc(e.runLabel)}</span>`:""}</span>${e.status?`<span class="home-guide-status">${esc(e.status)}</span>`:""}</div>`).join("")}</div>`:'<div class="small muted">今日の予定はありません。</div>'}${anniversary?`<div class="home-guide-anniversary">今日は何の日：${years}年前「${esc(eventScenarioTitle(anniversary,scenarioMap))}」</div>`:""}<a class="home-guide-link" href="pcs/index.html?focus=${encodeURIComponent(pc.id)}">PC詳細を見る →</a></div>`;

function renderPomodoro(){
 const host=document.getElementById("pomodoroPanel");if(!host)return;const s=timerState(),active=s.status!=="idle",pcs=window.TRPG39?.loadPCs?.()||[],scenarios=loadScenarios(),tasks=prepTaskRows(),remaining=timerRemaining(s);
 host.innerHTML=`<h2>集中タイマー</h2><div id="pomoClock" class="pomo-clock">${formatClock(remaining)}</div><div class="small muted">${esc(POMODORO_MODES[s.mode].label)}${s.status==="paused"?" ／ 一時停止中":s.status==="running"?" ／ 稼働中":""}</div><div class="pomo-mode-row">${Object.entries(POMODORO_MODES).map(([key,v])=>`<button type="button" data-pomo-mode="${key}" aria-pressed="${s.mode===key}" ${active?"disabled":""}>${esc(v.label)}</button>`).join("")}</div><div class="pomo-fields"><label>何をしますか？（任意）<input id="pomoTitle" value="${esc(s.title)}" placeholder="例：犀川 慶 立ち絵" ${active?"disabled":""}></label><details><summary>関連データを選ぶ（任意）</summary><div class="pomo-ref-grid"><label>PC<select id="pomoPc" ${active?"disabled":""}>${optionHtml(pcs,s.pcId,"関連PCなし")}</select></label><label>シナリオ<select id="pomoScenario" ${active?"disabled":""}>${optionHtml(scenarios,s.scenarioId,"関連シナリオなし")}</select></label><label>既存タスク<select id="pomoTask" ${active?"disabled":""}>${optionHtml(tasks,s.taskId,"関連タスクなし")}</select></label><label>runId<input id="pomoRun" value="${esc(s.runId)}" ${active?"disabled":""}></label><label>albumId<input id="pomoAlbum" value="${esc(s.albumId)}" ${active?"disabled":""}></label></div></details></div><div class="pomo-actions">${s.status==="idle"?'<button type="button" data-pomo-start>開始</button>':s.status==="running"?'<button type="button" data-pomo-pause>一時停止</button>':'<button type="button" data-pomo-resume>再開</button>'}${active?'<button type="button" data-pomo-end>終了</button>':""}<button type="button" data-pomo-reset>リセット</button></div><div class="pomo-status">${esc(s.message)}</div>`;
 host.querySelectorAll("[data-pomo-mode]").forEach(b=>b.onclick=()=>{const mode=b.dataset.pomoMode;saveTimerState({...timerState(),mode,durationSec:POMODORO_MODES[mode].durationSec,status:"idle",elapsedSec:0,message:""});renderHomePanels()});
 host.querySelector("[data-pomo-start]")?.addEventListener("click",()=>{const now=new Date().toISOString(),current=timerState();saveTimerState({...current,durationSec:POMODORO_MODES[current.mode].durationSec,status:"running",startedAt:now,lastResumedAt:now,elapsedSec:0,title:document.getElementById("pomoTitle").value.trim(),pcId:document.getElementById("pomoPc").value,scenarioId:document.getElementById("pomoScenario").value,taskId:document.getElementById("pomoTask").value,runId:document.getElementById("pomoRun").value.trim(),albumId:document.getElementById("pomoAlbum").value.trim(),pendingLogId:"",message:current.mode==="focus"?POMODORO_LINES.focusStart:POMODORO_LINES.breakStart});renderHomePanels()});
 host.querySelector("[data-pomo-pause]")?.addEventListener("click",()=>{const current=timerState(),elapsedSec=timerElapsed(current);saveTimerState({...current,status:"paused",elapsedSec,lastResumedAt:"",message:current.mode==="focus"?POMODORO_LINES.focusPaused:"休憩を一時停止しています。"});renderHomePanels()});
 host.querySelector("[data-pomo-resume]")?.addEventListener("click",()=>{const current=timerState();saveTimerState({...current,status:"running",lastResumedAt:new Date().toISOString(),message:current.mode==="focus"?POMODORO_LINES.focusStart:POMODORO_LINES.breakStart});renderHomePanels()});
 host.querySelector("[data-pomo-end]")?.addEventListener("click",()=>finishTimer(timerState(),false));
 host.querySelector("[data-pomo-reset]")?.addEventListener("click",()=>{const current=timerState();saveTimerState({...current,status:"idle",durationSec:POMODORO_MODES[current.mode].durationSec,startedAt:"",lastResumedAt:"",elapsedSec:0,pendingLogId:"",message:""});renderHomePanels()});
}
function aggregateWorkLogs(logs){const result={todaySec:0,totalSec:0,byTitle:new Map(),byPc:new Map(),byScenario:new Map(),byRun:new Map()},today=localYmd();for(const log of logs){const sec=Math.max(0,Number(log.durationSec)||0);result.totalSec+=sec;if(dateKey(log.endedAt||log.startedAt)===today)result.todaySec+=sec;[[result.byTitle,log.title],[result.byPc,log.pcId],[result.byScenario,log.scenarioId],[result.byRun,log.runId]].forEach(([map,key])=>{key=String(key||"");if(key)map.set(key,(map.get(key)||0)+sec)})}return result}
function renderWorkLog(){
 const host=document.getElementById("workLogPanel");if(!host)return;const logs=workLogs(),summary=aggregateWorkLogs(logs),timer=timerState(),tasks=prepTaskRows(),task=tasks.find(x=>x.id===timer.taskId)||null,latest=logs[0]||null,nowTitle=timer.status!=="idle"?(timer.title||task?.title||"名称未設定の作業"):(latest?.title||"現在作業中の項目はありません"),currentTotal=(summary.byTitle.get(nowTitle)||0)+(timer.status!=="idle"?timerElapsed(timer):0);const days=new Map();logs.forEach(log=>{const key=dateKey(log.endedAt||log.startedAt)||"日付不明";if(!days.has(key))days.set(key,[]);days.get(key).push(log)});
 host.innerHTML=`<h2>WORK LOG</h2><div class="work-summary"><div class="work-stat"><span>今日の作業</span><strong>${formatDuration(summary.todaySec)}</strong></div><div class="work-stat"><span>全体の累計</span><strong>${formatDuration(summary.totalSec)}</strong></div></div><div class="work-now"><div class="small muted">今ここ！</div><div class="work-now-title">${timer.status!=="idle"?"▶ ":""}${esc(nowTitle)}</div>${task?`<div class="small muted">既存タスク：${task.done?"完了":"未完了"} ／ ${esc(task.scenarioTitle)}</div>`:""}${nowTitle!=="現在作業中の項目はありません"?`<div class="small muted">今日 ${formatDuration(summary.todaySec)} ／ この作業累計 ${formatDuration(currentTotal)}</div>`:""}</div><div class="work-latest"><strong>最新の進捗</strong><div>${latest?.progress?`「${esc(latest.progress)}」`:'<span class="small muted">進捗メモはまだありません。</span>'}</div></div>${timer.pendingLogId?`<div class="work-progress-form"><strong>お疲れさまでした。どこまで進みました？</strong><textarea id="workProgress" placeholder="短い進捗メモ（任意）"></textarea><div class="work-progress-actions"><button type="button" data-save-progress>進捗を保存</button><button type="button" data-skip-progress>今回は残さない</button></div></div>`:""}<details data-work-log-details style="margin-top:12px"><summary>過去の作業ログ</summary><div class="work-log-days">${days.size?[...days].map(([day,rows])=>`<details class="work-log-day"><summary>${esc(day)}　${formatDuration(rows.reduce((n,x)=>n+(Number(x.durationSec)||0),0))}</summary>${rows.map(log=>{const d=new Date(log.startedAt);const time=Number.isNaN(d.getTime())?"--:--":d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});return `<div class="work-log-row"><strong>${esc(time)}　${esc(log.title||"名称未設定")}</strong>　${formatDuration(log.durationSec)}${log.progress?`<div class="work-log-progress">「${esc(log.progress)}」</div>`:""}</div>`}).join("")}</details>`).join(""):'<div class="small muted">作業ログはまだありません。</div>'}</div></details>`;
 host.querySelector("[data-save-progress]")?.addEventListener("click",()=>{const state=timerState(),progress=document.getElementById("workProgress").value.trim(),rows=workLogs(),i=rows.findIndex(x=>String(x.id)===state.pendingLogId);if(i>=0)rows[i]={...rows[i],progress};saveWorkLogs(rows);saveTimerState({...state,pendingLogId:"",message:""});renderHomePanels()});
 host.querySelector("[data-skip-progress]")?.addEventListener("click",()=>{const state=timerState();saveTimerState({...state,pendingLogId:"",message:""});renderHomePanels()});
}
function startHomeTimerTick(){clearInterval(homeTimerTick);homeTimerTick=setInterval(()=>{if(syncExpiredTimer())return;const state=timerState(),clock=document.getElementById("pomoClock");if(clock)clock.textContent=formatClock(timerRemaining(state));if(state.status!=="idle"){const current=document.querySelector(".work-now .small.muted:last-child");if(current&&/^この作業/.test(current.textContent))current.textContent=`この作業 ${formatDuration(timerElapsed(state))}`}},1000)}
function renderLastKpBinder(){
 const panel=document.getElementById("lastKpBinder"),body=document.getElementById("lastKpBinderBody");
 if(!panel||!body)return;

 let x=null;
 try{x=JSON.parse(localStorage.getItem("39x2_last_kp_binder_v1")||"null")}catch{}

 // 専用キーが無い／壊れている場合は、KPバインダー本体の保存データから最後に開いたものを拾う。
 if(!x?.scenarioId){
   try{
     const all=JSON.parse(localStorage.getItem("39x2_scenario_kp_binders_v1")||"{}");
     const scenarios=loadScenarios();
     const names=new Map(scenarios.map(s=>[String(s.id),s.title||"シナリオ"]));
     const rows=Object.entries(all||{}).map(([scenarioId,binder])=>({
       scenarioId:String(scenarioId),
       scenarioTitle:String(binder?.scenarioTitle||names.get(String(scenarioId))||"シナリオ"),
       openedAt:String(binder?.lastOpenedAt||"")
     })).filter(v=>v.scenarioId&&v.openedAt);
     rows.sort((a,b)=>String(b.openedAt).localeCompare(String(a.openedAt)));
     x=rows[0]||null;
   }catch{}
 }

 if(!x?.scenarioId){panel.hidden=true;return}

 const title=x.scenarioTitle||"シナリオ";
 const href=`scenario/kp-binder.html?id=${encodeURIComponent(x.scenarioId)}`;
 let meta="すぐに続きから開けます";
 if(x.openedAt){
   const d=new Date(x.openedAt);
   if(!Number.isNaN(d.getTime())){
     meta=`最終アクセス ${d.toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}`;
   }
 }
 body.innerHTML=`<a class="home-task" href="${href}"><div class="home-task-main"><div class="home-task-title">${esc(title)}</div><div class="home-task-meta">${esc(meta)}</div></div><div class="home-task-due">KPバインダーを開く →</div></a>`;
 panel.hidden=false;
}
function renderPrepTasks(){
 let all={};try{all=JSON.parse(localStorage.getItem(KEY)||"{}")}catch{}
 const scenarios=loadScenarios(), names=new Map(scenarios.map(s=>[String(s.id),s.title||"シナリオ"])), tasks=[];
 Object.entries(all||{}).forEach(([sid,scopes])=>{
   Object.entries(scopes||{}).forEach(([scope,labels])=>{
     Object.entries(labels||{}).forEach(([label,items])=>{
       (Array.isArray(items)?items:[]).forEach(item=>{
         const deadline=String(item.deadline||"").split("T")[0];
         if(item.done||!deadline)return;
         tasks.push({sid,scope,label,item,deadline,title:names.get(String(sid))||"シナリオ未指定"});
       });
     });
   });
 });
 tasks.sort((a,b)=>a.deadline.localeCompare(b.deadline)||a.title.localeCompare(b.title,"ja"));
 const panel=document.getElementById("prepTasks"),list=document.getElementById("prepTaskList"),count=document.getElementById("prepTaskCount");
 if(!panel||!list||!count)return;
 if(!tasks.length){panel.hidden=true;return}
 panel.hidden=false;count.textContent=`未完了 ${tasks.length}件`;
 list.innerHTML=tasks.map(t=>{
   const diff=dayDiff(t.deadline), cls=diff<0?" home-task-overdue":diff===0?" home-task-today":"";
   const label=t.label&&t.label!=="_"?`・${t.label}`:"";
   const href=`prep/index.html?scenario=${encodeURIComponent(t.sid)}&scope=${encodeURIComponent(t.scope)}&label=${encodeURIComponent(t.label||"_")}`;
   return `<a class="home-task${cls}" href="${href}"><div class="home-task-main"><div class="home-task-title">${esc(t.item.title)}</div><div class="home-task-meta">${esc(t.title)}${esc(label)} ／ 締切 ${esc(t.deadline.replaceAll("-","/"))}</div></div><div class="home-task-due">${esc(dueText(t.deadline))}</div></a>`;
 }).join("");
}
function renderHomePanels(){if(syncExpiredTimer())return;renderHomeGuide();renderPomodoro();renderWorkLog();renderPrepTasks();renderLastKpBinder();renderHomeConcierge();startHomeTimerTick()}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",renderHomePanels);else renderHomePanels();
})();
