</div></main><div data-site-footer></div><script>
(()=>{"use strict";
const KEY="39x2_prep_v1";
const HOME_GUIDE_SETTINGS_KEY="trpg39_home_guide_v1";
const HOME_TUTORIAL_KEY="trpg39_home_tutorial_v1",POMODORO_KEY="trpg39_home_pomodoro_v1",WORK_LOG_KEY="trpg39_work_logs_v1";
// 初期ナビゲーターはユーザーPCとは別のアプリ固定アセット。ファイル配置後はこの1か所だけで参照する。
const INITIAL_GUIDE_ASSET="./assets/img/home-guide-shirato-mini.png";
const POMODORO_MODES={focus:{label:"25分集中",durationSec:1500},short:{label:"5分休憩",durationSec:300},long:{label:"15分休憩",durationSec:900}};
const HOME_GUIDE_PERIODS={lateNight:[0,5],morning:[5,11],afternoon:[11,16],evening:[16,19],night:[19,24]};
const HOME_GUIDE_TEXT=window.SAKUMERU_HOME_GUIDE_TEXT;
const HOME_TUTORIAL_TOPICS=[{key:"scenario",label:"SCENARIO"},{key:"calendar",label:"CALENDAR"},{key:"library",label:"LIBRARY"},{key:"pc",label:"PC"},{key:"players",label:"PLAYERS"},{key:"share",label:"SHARE"},{key:"tools",label:"TOOLS"}];
const HOME_TUTORIAL_STEPS=HOME_TUTORIAL_TOPICS.map(topic=>HOME_GUIDE_TEXT.tutorial[topic.key]);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let homeScenariosCache=null,homeTimerTick=0,homeConciergeOpen=false,homeConciergeMode="",homeTutorialStep=0,homeTutorialReview=false,homeTutorialDismissed=false;
function localYmd(d=new Date()){const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function dayDiff(ymd){const [y,m,d]=String(ymd).split("-").map(Number),t=new Date(y,m-1,d),now=new Date();now.setHours(0,0,0,0);return Math.round((t-now)/86400000)}
function dueText(ymd){const n=dayDiff(ymd);if(n<0)return `期限切れ ${Math.abs(n)}日`;if(n===0)return "今日";if(n===1)return "明日";return `あと${n}日`}
function loadScenarios(){
 if(homeScenariosCache)return homeScenariosCache;
 try{
   if(window.TRPG39?.loadScenarios){homeScenariosCache=window.TRPG39.loadScenarios()||[];return homeScenariosCache}
   return [];
 }catch{return []}
}
function homeGuideSettings(){try{const v=JSON.parse(localStorage.getItem(HOME_GUIDE_SETTINGS_KEY)||"{}");return v&&typeof v==="object"?v:{}}catch{return {}}}
function guidePeriod(date=new Date()){const hour=date.getHours();return Object.entries(HOME_GUIDE_PERIODS).find(([,range])=>hour>=range[0]&&hour<range[1])?.[0]||"lateNight"}
function dateKey(value){const raw=String(value||"");if(/^\d{4}-\d{2}-\d{2}/.test(raw))return raw.slice(0,10);const d=new Date(raw);return Number.isNaN(d.getTime())?"":localYmd(d)}
function clockText(event){const raw=String(event?.start||event?.startTime||"");const m=raw.match(/(?:T|\s)(\d{2}:\d{2})/)||raw.match(/^(\d{1,2}:\d{2})/);return m?m[1]:"時間未定"}
function eventDate(event,kind="start"){const direct=String(event?.[kind]||"");if(direct&&/T|\s\d{1,2}:\d{2}/.test(direct)){const d=new Date(direct);if(!Number.isNaN(d.getTime()))return d}const day=dateKey(event?.date||event?.start),time=String(event?.[kind+"Time"]||event?.[kind]||"").match(/\d{1,2}:\d{2}/)?.[0];if(!day||!time)return null;const d=new Date(`${day}T${time}:00`);return Number.isNaN(d.getTime())?null:d}
function eventScenarioTitle(event,scenarioMap){return String(scenarioMap.get(String(event?.scenarioId||""))?.title||event?.scenarioTitle||event?.title||"予定").trim()}
function stableIndex(seed,length){let h=2166136261;for(const ch of String(seed)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return length?Math.abs(h>>>0)%length:0}
function applyGuideTemplate(line,values){return String(line||"").replace(/\{(time|scenario|runName|count|years)\}/g,(_,key)=>String(values[key]??""))}
function guideLineFor(pc,category,period,values,today){const own=pc.guideLines&&typeof pc.guideLines==="object"?pc.guideLines:{},defaults=HOME_GUIDE_TEXT.favoritePcDefaults,categories=[category,period,!today.length?"noSchedule":""].filter(Boolean);let chosenCategory="",lines=[];for(const key of categories){lines=Array.isArray(own[key])?own[key].filter(Boolean):[];if(!lines.length)lines=defaults[key]||[];if(lines.length){chosenCategory=key;break}}if(!lines.length)return {category:period,line:defaults.fallback};const seed=`${localYmd()}|${period}|${pc.id}|${chosenCategory}`;return {category:chosenCategory,line:applyGuideTemplate(lines[stableIndex(seed,lines.length)],values)}}
function guideImage(pc,category){const config=pc.guideVariants&&typeof pc.guideVariants==="object"?pc.guideVariants:{},variantId=String(config[category]||config.default||"");if(variantId&&variantId!=="__main__"){const hit=(Array.isArray(pc.variants)?pc.variants:[]).find(v=>String(v?.id||"")===variantId&&v.url);if(hit)return hit.url}return String(pc.image||"").trim()}
function readJson(key,fallback){try{const v=JSON.parse(localStorage.getItem(key)||"");return v??fallback}catch{return fallback}}
function writeJson(key,value){localStorage.setItem(key,JSON.stringify(value))}
function tutorialState(){const v=readJson(HOME_TUTORIAL_KEY,{});return v&&typeof v==="object"?v:{}}
function initialGuideArtHtml(){return `<figure class="home-initial-guide-figure"><div class="home-guide-art"><img src="${esc(INITIAL_GUIDE_ASSET)}" alt="案内役・白十字" onerror="this.closest('section').classList.add('home-guide-no-art');this.closest('.home-initial-guide-figure').hidden=true"></div><figcaption>白十字</figcaption></figure>`}
function timerState(){const raw=readJson(POMODORO_KEY,{}),mode=POMODORO_MODES[raw?.mode]?raw.mode:"focus";return {mode,durationSec:Number(raw?.durationSec)||POMODORO_MODES[mode].durationSec,status:["running","paused"].includes(raw?.status)?raw.status:"idle",startedAt:String(raw?.startedAt||""),lastResumedAt:String(raw?.lastResumedAt||""),elapsedSec:Math.max(0,Number(raw?.elapsedSec)||0),title:String(raw?.title||""),pcId:String(raw?.pcId||""),scenarioId:String(raw?.scenarioId||""),runId:String(raw?.runId||""),albumId:String(raw?.albumId||""),taskId:String(raw?.taskId||""),pendingLogId:String(raw?.pendingLogId||""),message:String(raw?.message||"")}}
function saveTimerState(state){writeJson(POMODORO_KEY,state);return state}
function timerElapsed(state,now=Date.now()){const resumed=Date.parse(state.lastResumedAt||"");return Math.min(state.durationSec,Math.max(0,Math.floor(state.elapsedSec+(state.status==="running"&&Number.isFinite(resumed)?(now-resumed)/1000:0))))}
function timerRemaining(state,now=Date.now()){return Math.max(0,state.durationSec-timerElapsed(state,now))}
function timerSpeech(){const s=timerState(),text=HOME_GUIDE_TEXT.pomodoro;if(s.message)return s.message;if(s.status==="running")return s.mode==="focus"?text.focusStart:text.breakStart;if(s.status==="paused")return s.mode==="focus"?text.focusPaused:text.breakPaused;return ""}
function workLogs(){const rows=readJson(WORK_LOG_KEY,[]);return Array.isArray(rows)?rows:[]}
function kpBinderHistoryEvents(){
 const store=readJson("39x2_kp_binder_snapshots_v2",{}),events=[];
 if(!store||typeof store!=="object"||Array.isArray(store))return events;
 Object.entries(store).forEach(([scenarioId,rows])=>{
  if(!Array.isArray(rows))return;
  rows.forEach((snapshot,index)=>{
   const binder=snapshot?.binder&&typeof snapshot.binder==="object"?snapshot.binder:{};
   const session=binder.currentShareSession&&typeof binder.currentShareSession==="object"?binder.currentShareSession:null;
   const savedAt=String(snapshot?.savedAt||"");if(!savedAt)return;
   events.push({kind:"kp-binder",id:`kp:${scenarioId}:${savedAt}:${index}`,at:savedAt,scenarioId:String(scenarioId||""),runId:String(session?.runId||""),scenarioTitle:String(binder.scenarioTitle||""),runLabel:String(session?.runLabel||""),detail:String(snapshot?.reason||"")});
  });
 });
 return events;
}
function saveWorkLogs(rows){writeJson(WORK_LOG_KEY,Array.isArray(rows)?rows:[])}
function uuid(){return crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`}
function finishTimer(state,automatic=false){const now=new Date(),durationSec=timerElapsed(state,now.getTime());let pendingLogId="";if(state.mode==="focus"&&durationSec>0){pendingLogId=uuid();const logs=workLogs();logs.unshift({id:pendingLogId,startedAt:state.startedAt||now.toISOString(),endedAt:now.toISOString(),durationSec,title:state.title,progress:"",pcId:state.pcId,scenarioId:state.scenarioId,runId:state.runId,albumId:state.albumId,taskId:state.taskId});saveWorkLogs(logs)}const text=HOME_GUIDE_TEXT.pomodoro,message=state.mode==="focus"?text.focusDone:text.breakDone;saveTimerState({...state,status:"idle",elapsedSec:0,lastResumedAt:"",startedAt:"",pendingLogId,message});renderHomePanels();return automatic}
function syncExpiredTimer(){const state=timerState();if(state.status==="running"&&timerRemaining(state)<=0){finishTimer(state,true);return true}return false}
function formatDuration(sec){sec=Math.max(0,Math.floor(Number(sec)||0));const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h?`${h}時間${String(m).padStart(2,"0")}分`:`${m}分`}
function formatClock(sec){sec=Math.max(0,Math.ceil(Number(sec)||0));return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`}

 panel.hidden=false;count.textContent=`未完了 ${tasks.length}件`;
 list.innerHTML=tasks.map(t=>{
   const diff=dayDiff(t.deadline), cls=diff<0?" home-task-overdue":diff===0?" home-task-today":"";
   const label=t.label&&t.label!=="_"?`・${t.label}`:"";
   const href=`prep/index.html?scenario=${encodeURIComponent(t.sid)}&scope=${encodeURIComponent(t.scope)}&label=${encodeURIComponent(t.label||"_")}`;
   return `<a class="home-task${cls}" href="${href}"><div class="home-task-main"><div class="home-task-title">${esc(t.item.title)}</div><div class="home-task-meta">${esc(t.title)}${esc(label)} ／ 締切 ${esc(t.deadline.replaceAll("-","/"))}</div></div><div class="home-task-due">${esc(dueText(t.deadline))}</div></a>`;
 }).join("");
}
function renderHomePanels(){if(syncExpiredTimer())return;renderHomeGuide();renderPomodoro();renderWorkLog();renderPrepTasks();renderLastKpBinder();renderHomeConcierge();startHomeTimerTick()}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",renderHomePanels);else renderHomePanels();
})();
