<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROFILE｜SAKU+MERU</title>
<meta name="description" content="SAKU+MERUの自己紹介ページ">
<script>
(()=>{try{const k="trpg39_theme",v=localStorage.getItem(k)||"system",m=(v==="light"||v==="dark")?v:(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"),r=document.documentElement;r.setAttribute("data-theme",m);r.setAttribute("data-theme-mode",v);r.classList.remove("theme-light","theme-dark");r.classList.add(m==="light"?"theme-light":"theme-dark");r.style.colorScheme=m;}catch(e){}})();
</script>
<link rel="stylesheet" href="../assets/css/style-v0306.css">
<script defer src="../assets/js/common-layout.js?v=0303"></script>
<script defer src="../assets/js/theme-v0296.js"></script>
<style>
.profile-wrap{max-width:1120px;margin:auto;padding:28px 24px 56px}
.profile-stack{display:grid;gap:18px}
.profile-card{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:20px}
.profile-card h3{margin:0 0 14px;font-size:1.05rem}
.profile-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.profile-card-head p{margin:4px 0 0}
.profile-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.profile-field{display:grid;gap:6px;min-width:0}
.profile-field.full{grid-column:1/-1}
.profile-field label{margin:0;font-size:.9rem}
.profile-field input,.profile-field textarea{width:100%;box-sizing:border-box;margin:0}
.profile-field textarea{min-height:92px;resize:vertical}
.profile-help{font-size:.78rem;color:var(--muted);line-height:1.55}
.profile-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:16px}
.profile-main-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-start;padding:2px 2px 0}
.profile-preview{border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--panel);margin:0}
.profile-preview[hidden]{display:none}
.profile-preview-label{font-size:.78rem;color:var(--muted);margin-bottom:12px;letter-spacing:.05em}
.profile-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.profile-icon{width:88px;height:88px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.profile-icon-editor{display:flex;gap:16px;align-items:flex-start;min-width:0}
.profile-icon-editor img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:var(--bg)}
.profile-icon-editor .icon-fields{display:grid;gap:9px;flex:1;min-width:0}
.profile-upload-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.profile-file-input{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.profile-upload-row .file-name{font-size:.82rem;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.profile-chips{display:flex;gap:6px;flex-wrap:wrap}
.profile-checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.profile-checks label,.session-style-options label{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.profile-checks input,.session-style-options input{width:auto;margin:0}
.session-style-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.profile-links{display:grid;gap:8px}
.profile-link-row{display:grid;grid-template-columns:160px minmax(0,1fr) auto;gap:8px;align-items:center}
.profile-share-name{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-top:12px}
.profile-share-name strong{display:block;margin-bottom:3px}
.profile-save-bar{border-top:1px solid var(--line);margin-top:18px;padding-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media(max-width:900px){.profile-form-grid{grid-template-columns:1fr}.profile-field.full{grid-column:auto}.profile-checks{grid-template-columns:repeat(2,minmax(0,1fr))}.session-style-options{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.profile-wrap{padding:20px 14px 44px}.profile-checks,.session-style-options{grid-template-columns:1fr}.profile-link-row{grid-template-columns:1fr}.profile-card{padding:16px}.profile-icon-editor{flex-direction:column}.profile-icon-editor img{width:84px;height:84px}}
</style>
<script src="../assets/js/beta-gate.js?v=02316"></script>
<script src="../assets/js/beta-gate-ui.js?v=0306"></script>
</head>
<body>
<div data-site-header data-active="profile"></div>
<main class="profile-wrap">
<div class="hero"><h2>PROFILE</h2><p>卓の自己紹介をまとめて、必要な内容だけ共有できます。</p></div>
<div class="profile-stack">
  <div class="profile-main-actions">
    <button id="togglePreview" type="button" class="text-action">プレビューを表示</button>
    <span id="savedNote" class="small muted"></span>
  </div>

  <section id="previewPanel" class="profile-preview" hidden>
    <div class="profile-card-head"><div><div class="profile-preview-label">プレビュー</div></div><button id="closePreview" type="button" class="text-action">編集に戻る</button></div>
    <div id="previewContent"></div>
  </section>

  <section class="profile-card">
    <div class="profile-card-head"><div><h3>基本プロフィール</h3><p class="small muted">SAKU+MERU内で使う名前と、外向けの表示名を設定します。</p></div></div>
    <div class="profile-form-grid">
      <div class="profile-field"><label for="displayName">表示名</label><input id="displayName" placeholder="例：プレイヤー名"><div class="profile-help">SAKU+MERU内で使う名前です。</div></div>
      <div class="profile-field"><label for="socialName">共有表示名</label><input id="socialName" placeholder="例：🌺 / プレイヤー名"><div class="profile-help">シナリオ一覧や空き日共有など、外向けの共有ページで使います。</div></div>
      <div class="profile-field full">
        <label>アイコン画像</label>
        <div class="profile-icon-editor">
          <img id="iconEditorPreview" alt="アイコンプレビュー" hidden>
          <div class="icon-fields">
            <div class="profile-upload-row"><input id="iconFile" class="profile-file-input" type="file" accept="image/*"><button id="chooseIcon" type="button">画像を選ぶ</button><span id="iconFileName" class="file-name">未選択</span><button id="clearIcon" type="button" class="text-action">画像を削除</button></div>
            <input id="iconUrl" type="url" placeholder="画像URLを使う場合：https://...">
            <div class="profile-help">端末の画像を選ぶか、画像URLを指定できます。端末画像はプロフィール用に縮小して保存します。</div>
          </div>
        </div>
      </div>
      <div class="profile-field full"><label for="intro">自己紹介</label><textarea id="intro" rows="4" placeholder="TRPG歴、普段の遊び方など"></textarea></div>
    </div>
  </section>

  <section class="profile-card">
    <div class="profile-card-head"><div><h3>TRPGプロフィール</h3><p class="small muted">遊び方や好みをまとめます。</p></div></div>
    <div class="profile-form-grid">
      <div class="profile-field"><label for="systems">よく遊ぶシステム <span class="small muted">（カンマ区切り）</span></label><input id="systems" placeholder="CoC6版, エモクロア, マダミス"></div>
      <div class="profile-field"><label for="roles">役割 <span class="small muted">（カンマ区切り）</span></label><input id="roles" placeholder="PL, KP, DL, GM"></div>
      <div class="profile-field full">
        <label>セッションスタイル</label>
        <div id="sessionStyles" class="session-style-options">
          <label><input type="checkbox" value="ボイセ">ボイセ</label>
          <label><input type="checkbox" value="テキセ">テキセ</label>
          <label><input type="checkbox" value="半テキ">半テキ</label>
          <label><input type="checkbox" value="その他">その他</label>
        </div>
      </div>
      <div class="profile-field full"><label for="likes">好きな傾向</label><textarea id="likes" rows="3"></textarea></div>
      <div class="profile-field full"><label for="dislikes">苦手・避けたい傾向</label><textarea id="dislikes" rows="3"></textarea></div>
      <div class="profile-field full"><label for="availability">遊べる時間帯</label><textarea id="availability" rows="2" placeholder="例：平日21時〜 / 土日昼夜"></textarea></div>
      <div class="profile-field full"><label for="note">ひとこと</label><textarea id="note" rows="2"></textarea></div>
    </div>
  </section>

  <section class="profile-card">
    <div class="profile-card-head"><div><h3>リンク</h3><p class="small muted">SNSや外部プロフィールなどをまとめられます。</p></div></div>
    <div id="links" class="profile-links"></div>
    <button id="addLink" type="button" class="text-action">＋ リンクを追加</button>
  </section>

  <section class="profile-card">
    <h3>共有する項目</h3>
    <div id="shareFields" class="profile-checks">
      <label><input type="checkbox" value="socialName" checked>共有表示名</label>
      <label><input type="checkbox" value="iconUrl" checked>アイコン</label>
      <label><input type="checkbox" value="intro" checked>自己紹介</label>
      <label><input type="checkbox" value="systems" checked>システム</label>
      <label><input type="checkbox" value="roles" checked>役割</label>
      <label><input type="checkbox" value="sessionStyles" checked>セッションスタイル</label>
      <label><input type="checkbox" value="likes" checked>好きな傾向</label>
      <label><input type="checkbox" value="dislikes">苦手・避けたい傾向</label>
      <label><input type="checkbox" value="availability" checked>時間帯</label>
      <label><input type="checkbox" value="note" checked>ひとこと</label>
      <label><input type="checkbox" value="links" checked>リンク</label>
    </div>
    <div class="profile-share-name"><strong>共有ページで使う名前</strong><span id="shareNamePreview" class="muted">未設定</span></div>
    <div class="profile-save-bar">
      <button id="saveProfile" type="button">保存</button>
      <button id="shareProfile" type="button">共有URLを作成・更新</button>
    </div>
  </section>
</div>
</main>
<div data-site-footer></div>
<script src="../assets/js/main.js?v=0292"></script>
<script src="../assets/js/supabase-config.js?v=0292"></script>
<script src="../assets/js/supabase-share.js?v=0292"></script>
<script>
(()=>{"use strict";
const KEY="39x2_profile_v1",SHARE_KEY="39x2_fixed_profile_share_id_v1",$=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const split=s=>String(s||"").split(/[,、]/).map(v=>v.trim()).filter(Boolean);
function addLink(label="",url=""){const row=document.createElement("div");row.className="profile-link-row";row.innerHTML=`<input class="link-label" placeholder="表示名" value="${esc(label)}"><input class="link-url" type="url" placeholder="https://..." value="${esc(url)}"><button type="button" class="danger">削除</button>`;row.querySelector("button").onclick=()=>{row.remove();renderPreview()};row.querySelectorAll("input").forEach(i=>i.addEventListener("input",renderPreview));$("links").appendChild(row)}
function currentIcon(){const data=$("iconEditorPreview").dataset.dataUrl||"";return data||$("iconUrl").value.trim()}
function collect(){
 return {
  displayName:$("displayName").value.trim(),socialName:$("socialName").value.trim(),iconUrl:currentIcon(),intro:$("intro").value.trim(),
  systems:split($("systems").value),roles:split($("roles").value),sessionStyles:[...document.querySelectorAll("#sessionStyles input:checked")].map(x=>x.value),
  likes:$("likes").value.trim(),dislikes:$("dislikes").value.trim(),availability:$("availability").value.trim(),note:$("note").value.trim(),
  links:[...document.querySelectorAll(".profile-link-row")].map(r=>({label:r.querySelector(".link-label").value.trim(),url:r.querySelector(".link-url").value.trim()})).filter(x=>x.label||x.url),
  shareFields:[...document.querySelectorAll("#shareFields input:checked")].map(x=>x.value)
 };
}
function setIconPreview(src,isData=false){const img=$("iconEditorPreview");if(src){img.src=src;img.hidden=false;img.dataset.dataUrl=isData?src:""}else{img.removeAttribute("src");img.hidden=true;img.dataset.dataUrl=""}}
async function imageFileToDataUrl(file){
 const src=URL.createObjectURL(file);
 try{
  const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src});
  const max=384,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
  const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;canvas.getContext("2d").drawImage(img,0,0,w,h);
  return canvas.toDataURL("image/webp",.86);
 }finally{URL.revokeObjectURL(src)}
}
function save(show=true){const x=collect();localStorage.setItem(KEY,JSON.stringify(x));if(show)$("savedNote").textContent="✓ 保存しました";renderPreview(x);return x}
function load(){let x={};try{x=JSON.parse(localStorage.getItem(KEY)||"{}")}catch{};["displayName","socialName","intro","likes","dislikes","availability","note"].forEach(k=>$(k).value=x[k]||"");const icon=String(x.iconUrl||"");if(icon.startsWith("data:")){setIconPreview(icon,true);$("iconUrl").value=""}else{$("iconUrl").value=icon;setIconPreview(icon,false)}$("systems").value=(x.systems||[]).join(", ");$("roles").value=(x.roles||[]).join(", ");const styles=new Set(x.sessionStyles||[]);document.querySelectorAll("#sessionStyles input").forEach(c=>c.checked=styles.has(c.value));$("links").innerHTML="";(x.links||[]).forEach(l=>addLink(l.label,l.url));if(!(x.links||[]).length)addLink();const fields=new Set(x.shareFields||["socialName","iconUrl","intro","systems","roles","sessionStyles","likes","availability","note","links"]);document.querySelectorAll("#shareFields input").forEach(c=>c.checked=fields.has(c.value));renderPreview(x)}
function renderPreview(x=collect()){const chips=a=>(a||[]).map(v=>`<span class="badge">${esc(v)}</span>`).join("");const shareName=(x.socialName||x.displayName||"").trim();if($("shareNamePreview"))$("shareNamePreview").textContent=shareName||"未設定";$("previewContent").innerHTML=`<div class="profile-head">${x.iconUrl?`<img class="profile-icon" src="${esc(x.iconUrl)}" alt="">`:""}<div><h2 style="margin:0">${esc(x.displayName||"名前未設定")}</h2>${x.socialName?`<div class="small muted">${esc(x.socialName)}</div>`:""}${x.intro?`<p style="white-space:pre-wrap">${esc(x.intro)}</p>`:""}</div></div>${x.systems?.length?`<h3>よく遊ぶシステム</h3><div class="profile-chips">${chips(x.systems)}</div>`:""}${x.roles?.length?`<h3>役割</h3><div class="profile-chips">${chips(x.roles)}</div>`:""}${x.sessionStyles?.length?`<h3>セッションスタイル</h3><div class="profile-chips">${chips(x.sessionStyles)}</div>`:""}${x.likes?`<h3>好きな傾向</h3><p style="white-space:pre-wrap">${esc(x.likes)}</p>`:""}${x.dislikes?`<h3>苦手・避けたい傾向</h3><p style="white-space:pre-wrap">${esc(x.dislikes)}</p>`:""}${x.availability?`<h3>遊べる時間帯</h3><p style="white-space:pre-wrap">${esc(x.availability)}</p>`:""}${x.note?`<h3>ひとこと</h3><p style="white-space:pre-wrap">${esc(x.note)}</p>`:""}`}
function publicProfile(x){const fields=new Set(x.shareFields||[]),p={displayName:x.displayName||""};["socialName","iconUrl","intro","systems","roles","sessionStyles","likes","dislikes","availability","note","links"].forEach(k=>{if(fields.has(k))p[k]=x[k]});return p}
async function shareProfile(){const x=save(false),payload={kind:"profile",version:2,updatedAt:new Date().toISOString(),profile:publicProfile(x)};try{if(!(window.TRPG39Cloud&&TRPG39Cloud.configured()))throw new Error("Supabase設定がありません");let id=localStorage.getItem(SHARE_KEY)||"";if(id&&TRPG39Cloud.updateSharedPage)await TRPG39Cloud.updateSharedPage(id,payload);else{id=await TRPG39Cloud.createSharedPage(payload);localStorage.setItem(SHARE_KEY,id)}const url=new URL("../share/index.html",location.href);url.searchParams.set("id",id);if(navigator.clipboard&&window.isSecureContext)try{await navigator.clipboard.writeText(url.href)}catch{}prompt("PROFILE共有URLです。更新しても同じURLを使えます。",url.href)}catch(e){console.error(e);alert("共有URLを作成できませんでした: "+(e.message||e))}}
$("addLink").onclick=()=>addLink();$("saveProfile").onclick=()=>save(true);$("shareProfile").onclick=shareProfile;$("chooseIcon").onclick=()=>$("iconFile").click();
$("togglePreview").onclick=()=>{renderPreview();$("previewPanel").hidden=false;$("togglePreview").textContent="プレビューを更新";$("previewPanel").scrollIntoView({behavior:"smooth",block:"start"})};
$("closePreview").onclick=()=>{$("previewPanel").hidden=true;$("togglePreview").textContent="プレビューを表示"};
$("iconFile").addEventListener("change",async()=>{const f=$("iconFile").files?.[0];if(!f)return;try{const data=await imageFileToDataUrl(f);setIconPreview(data,true);$("iconUrl").value="";renderPreview()}catch(e){console.error(e);alert("画像を読み込めませんでした。")}});
$("clearIcon").onclick=()=>{$("iconFile").value="";$("iconFileName").textContent="未選択";$("iconUrl").value="";setIconPreview("",false);renderPreview()};
$("iconUrl").addEventListener("input",()=>{if($("iconUrl").value.trim())setIconPreview($("iconUrl").value.trim(),false);else if(!$("iconEditorPreview").dataset.dataUrl)setIconPreview("",false);renderPreview()});
document.querySelectorAll("input:not(.link-label):not(.link-url),textarea").forEach(el=>{el.addEventListener(el.type==="checkbox"?"change":"input",renderPreview)});
load();
})();
</script>
</body>
</html>
