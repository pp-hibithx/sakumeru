<div data-site-header data-active="profile"></div>
<main class="profile-wrap">
<div class="hero"><h2>PROFILE</h2><p>卓の自己紹介をまとめて、必要な内容だけ共有できます。</p></div>
<div class="profile-stack">
  <div class="profile-main-actions">
    <button id="togglePreview" type="button" class="text-action">プレビューを表示</button>
    <span id="savedNote" class="small muted"></span>
  </div>

  <section id="previewPanel" class="profile-preview" hidden>
    <div class="profile-card-head"><div><div class="profile-preview-label">プレビュー</div></div><button id="closePreview" type="button" class="text-action">編集に戻る</button></div>
    <div id="previewContent"></div>
  </section>

  <div class="profile-editor-layout">
    <div class="profile-editor-side">
  <section class="profile-card">
        <details class="profile-side-toggle">
          <summary>基本プロフィール</summary>
          <div class="profile-side-toggle-body">
<div class="profile-form-grid">
      <div class="profile-field"><label for="displayName">表示名</label><input id="displayName" placeholder="例：プレイヤー名"><div class="profile-help">サイト内で使う名前。</div></div>
      <div class="profile-field"><label for="socialName">共有表示名</label><input id="socialName" placeholder="例：🌺 / プレイヤー名"><div class="profile-help">共有ページで使う名前。</div></div>
      <div class="profile-field full">
        <label>アイコン画像</label>
        <div class="profile-icon-editor">
          <img id="iconEditorPreview" alt="アイコンプレビュー" hidden>
          <div class="icon-fields">
            <div class="profile-upload-row"><input id="iconFile" class="profile-file-input" type="file" accept="image/*"><button id="chooseIcon" type="button">画像を選ぶ</button><span id="iconFileName" class="file-name">未選択</span><button id="clearIcon" type="button" class="text-action">画像を削除</button></div>
            <input id="iconUrl" type="url" placeholder="画像URLを使う場合：https://...">
            <div class="profile-help">画像を選ぶか、URLを指定。</div>
          </div>
        </div>
      </div>
    </div>
          </div>
        </details>
      </section>

      <section class="profile-card">
        <details class="profile-side-toggle">
          <summary>TRPGプロフィール</summary>
          <div class="profile-side-toggle-body">
<div class="profile-form-grid">
      <div class="profile-field"><label for="systems">よく遊ぶシステム <span class="small muted">（カンマ区切り）</span></label><input id="systems" placeholder="CoC6版, エモクロア, マダミス"></div>
      <div class="profile-field"><label for="roles">役割 <span class="small muted">（カンマ区切り）</span></label><input id="roles" placeholder="PL, KP, DL, GM"></div>
      <div class="profile-field"><label for="sessionStyles">セッションスタイル <span class="small muted">（カンマ区切り）</span></label><input id="sessionStyles" placeholder="ボイセ, 半テキ"></div>
      <div class="profile-field full"><label for="availability">遊べる時間帯</label><textarea id="availability" rows="2" placeholder="例：平日21時〜 / 土日昼夜"></textarea></div>
    </div>
          </div>
        </details>
      </section>

      <section class="profile-card">
        <details class="profile-side-toggle">
          <summary>リンク</summary>
          <div class="profile-side-toggle-body">
<div id="links" class="profile-links"></div>
    <button id="addLink" type="button" class="text-action">＋ リンクを追加</button>
          </div>
        </details>
      </section>

      <section class="profile-card">
        <details class="profile-side-toggle">
          <summary>SAKU+MERU共有リンク</summary>

<div id="sharedLinks" class="profile-links"></div>
        <button id="addSharedLink" type="button" class="text-action">＋ 共有リンクを追加</button>
          </div>
        </details>
      </section>

function bindProfilePages(){document.querySelectorAll(".profile-page-card").forEach(card=>{const pid=card.dataset.pid,get=()=>loadProfilePages().find(x=>x.id===pid);card.querySelector("[data-pp-edit]").onclick=()=>card.querySelector(".profile-page-editor").hidden=false;card.querySelector("[data-pp-close]").onclick=()=>card.querySelector(".profile-page-editor").hidden=true;card.querySelector("[data-pp-save]").onclick=()=>{const pages=loadProfilePages(),i=pages.findIndex(x=>x.id===pid);pages[i]=readProfilePageEditor(card,pages[i]);saveProfilePages(pages);renderProfilePages();save(false)};card.querySelector("[data-pp-remove]").onclick=()=>{if(!confirm("この付属ページを削除しますか？"))return;saveProfilePages(loadProfilePages().filter(x=>x.id!==pid));renderProfilePages()};card.querySelector("[data-pp-share]").onclick=async()=>{let pages=loadProfilePages(),i=pages.findIndex(x=>x.id===pid);let page=readProfilePageEditor(card,pages[i]);if(!(window.TRPG39Cloud&&TRPG39Cloud.configured()))return alert("共有機能の設定がありません。");try{const payload={kind:"profile-page",version:1,title:page.title,blocks:page.blocks,updatedAt:page.updatedAt,shareMode:"link"};let id=page.shareId||"";if(id&&TRPG39Cloud.updateSharedPage)await TRPG39Cloud.updateSharedPage(id,payload);else id=await TRPG39Cloud.createSharedPage(payload);page.shareId=id;pages[i]=page;saveProfilePages(pages);const u=new URL("https://sakumeru-share.sakumeru.workers.dev/");u.searchParams.set("id",id);u.searchParams.set("type","profile-page");let x=collect(),links=x.sharedLinks||[],idx=links.findIndex(l=>l.profilePageId===pid||l.url===u.href);const item={label:page.title,url:u.href,memo:"",profilePageId:pid};if(idx>=0)links[idx]={...links[idx],...item};else links.push(item);x.sharedLinks=links;localStorage.setItem(KEY,JSON.stringify(x));load();if(navigator.clipboard&&window.isSecureContext)try{await navigator.clipboard.writeText(u.href)}catch{}prompt("付属ページの共有URLです。PROFILEのSAKU+MERU SHAREにも追加しました。",u.href)}catch(e){console.error(e);alert("共有できませんでし function addLink(label="",url=""){const row=document.createElement("div");row.className="profile-link-row";row.innerHTML=`<input class="link-label" placeholder="表示名" value="${esc(label)}"><input class="link-url" type="url" placeholder="https://..." value="${esc(url)}"><button type="button" class="danger">削除</button>`;row.querySelector("button").onclick=()=>{row.remove();renderPreview()};row.querySelectorAll("input").forEach(i=>i.addEventListener("input",renderPreview));$("links").appendChild(row)}
function wrapSelection(ta,before,after=before){const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value;ta.value=v.slice(0,s)+before+v.slice(s,e)+after+v.slice(e);ta.focus();ta.setSelectionRange(s+before.length,e+before.length);ta.dispatchEvent(new Event("input",{bubbles:true}))}

function makeProfileBlockRow(title="",body="",toggle=true,level=0){
 const row=document.createElement("div");row.className="profile-block-row";row.dataset.level=String(Math.max(0,Math.min(2,Number(level||0))));

 return row;
}

  displayName:$("displayName").value.trim(),socialName:$("socialName").value.trim(),iconUrl:currentIcon(),
  systems:split($("systems").value),roles:split($("roles").value),sessionStyles:split($("sessionStyles").value),

  blocks:(()=>{const out=[];const walk=(container,level)=>{[...container.children].filter(r=>r.classList?.contains("profile-block-row")).forEach(r=>{const item={title:r.querySelector(":scope > .profile-block-editor > .profile-block-editor-body > .block-title").value.trim(),body:r.querySelector(":scope > .profile-block-editor > .profile-block-editor-body > .block-body").value.trim(),toggle:r.querySelector(":scope > .profile-block-editor > .profile-block-editor-body > .profile-block-tools .block-toggle").checked,level};if(item.title||item.body)out.push(item);const kids=r.querySelector(":scope > .profile-block-editor > .profile-block-editor-body > .profile-block-children");if(kids&&level<2)walk(kids,level+1)});};walk($("profileBlocks"),0);return out})(),
  sharedLinks:[...document.querySelectorAll(".shared-link-row")].map(r=>({label:r.querySelector(".shared-label").value.trim(),url:r.querySelector(".shared-url").value.trim(),memo:r.querySelector(".shared-memo")?.value.trim()||""})).filter(x=>x.label||x.url||x.memo),

function setIconPreview(src,isData=false){const img=$("iconEditorPreview");if(src){img.src=src;img.hidden=false;img.dataset.dataUrl=isData?src:""}else{img.removeAttribute("src");img.hidden=true;img.dataset.dataUrl=""}}
async function imageFileToDataUrl(file){
 const src=URL.createObjectURL(file);
 try{
  const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src});
  const max=384,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
  const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;canvas.getContext("2d").drawImage(img,0,0,w,h);
  return canvas.toDataURL("image/webp",.86);
 }finally{URL.revokeObjectURL(src)}
}
function save(show=true){const x=collect();localStorage.setItem(KEY,JSON.stringify(x));if(show)$("savedNote").textContent="✓ 保存しました";renderPreview(x);return x}
function load(){let x={};try{x=JSON.parse(localStorage.getItem(KEY)||"{}")}catch{};["displayName","socialName","availability"].forEach(k=>$(k).value=x[k]||"");const icon=String(x.iconUrl||"");if(icon.startsWith("data:")){setIconPreview(icon,true);$("iconUrl").value=""}else{$("iconUrl").value=icon;setIconPreview(icon,false)}$("systems").value=(x.systems||[]).join(", ");$("roles").value=(x.roles||[]).join(", ");$("sessionStyles").value=(x.sessionStyles||[]).join(", ");$("links").innerHTML="";(x.links||[]).forEach(l=>addLink(l.label,l.url));if(!(x.links||[]).length)addLink();$("profileBlocks").innerHTML="";(()=>{let root=null,child=null;(x.blocks||[]).forEach(b=>{let level=Math.max(0,Math.min(2,Number(b.level||0)));if(level===0||!root){root=addProfileBlock(b.title,b.body,b.toggle!==false,0);child=null;return}if(level===1){child=addProfileBlock(b.title,b.body,b.toggle!==false,1,root.querySelector(".profile-block-children"));return}if(!child){child=addProfileBlock("","",false,1,root.querySelector(".profile-block-children"))}addProfileBlock(b.title,b.body,b.toggle!==false,2,child.querySelector(".profile-block-children"))})})();if(!(x.blocks||[]).length){if(x.intro)addProfileBlock("自己紹介",x.intro,false,0);if(x.likes)addProfileBlock("好きな傾向",x.likes,true,0);if(x.dislikes)addProfileBlock("苦手・避けたい傾向",x.dislikes,true,0);if(x.note)addProfileBlock("ひとこと",x.note,true,0);}$("sharedLinks").innerHTML="";(x.sharedLinks||[]).forEach(l=>addSharedLink(l.label,l.url,l.memo||""));if(!(x.sharedLinks||[]).length)addSharedLink();const fields=new Set(x.shareFields||["socialName","iconUrl","systems","roles","sessionStyles","availability","links"]);document.querySelectorAll("#shareFields input").forEach(c=>c.checked=fields.has(c.value));renderPreview(x)}
function profileBlocksHtml(blocks){
 const rows=(Array.isArray(blocks)?blocks:[]).filter(b=>b&&(b.title||b.body));
 if(!rows.length)return "";
 const roots=[];let root=null,child=null;
 rows.forEach(b=>{
   let level=Math.max(0,Math.min(2,Number(b.level||0))),item={...b,level};
   if(level===0||!root){root={item:{...item,level:0},children:[]};roots.push(root);child=null;return}
   if(level===1){child={item:{...item,level:1},children:[]};root.children.push(child);return}
   if(!child){child={item:{title:"",body:"",toggle:false,level:1},children:[]};root.children.push(child)}
   child.children.push({...item,level:2});
 });
 const body=b=>`${b.body?`<div style="white-space:pre-wrap;line-height:1.8;padding-top:8px">${richText(b.body)}</div>`:""}`;
 const leaf=b=>b.toggle!==false?`<details><summary>${esc(b.title||"プロフィール")}</summary>${body(b)}</details>`:`<section class="share-report-block"><strong>${esc(b.title||"プロフィール")}</strong>${body(b)}</section>`;
 const mid=c=>{const kids=c.children.length?`<div class="profile-nested-children level-2">${c.children.map(leaf).join("")}</div>`:"";const b=c.item;if(!b.title&&!b.body)return kids;return b.toggle!==false?`<details><summary>${esc(b.title||"プロフィール")}</summary>${body(b)}${kids}</details>`:`<section class="share-report-block"><strong>${esc(b.title||"プロフィール")}</strong>${body(b)}${kids}</section>`};
 return roots.map(r=>{const kids=r.children.length?`<div class="profile-nested-children">${r.children.map(mid).join("")}</div>`:"";const b=r.item;return b.toggle!==false?`<details><summary>${esc(b.title||"プロフィール")}</summary>${body(b)}${kids}</details>`:`<section class="share-report-block"><strong>${esc(b.title||"プロフィール")}</strong>${body(b)}${kids}</section>`}).join("");
}

 const links=(x.links||[]).filter(l=>l&&l.url),sharedLinks=(x.sharedLinks||[]).filter(l=>l&&l.url);
 const side=`<aside class="profile-public-side">${x.iconUrl?`<img class="profile-icon" src="${esc(x.iconUrl)}" alt="" style="width:120px;height:120px">`:""}<h2 style="margin:0 0 6px">${esc(shareName||x.displayName||"名前未設定")}</h2>${x.systems?.length?`<h3>よく遊ぶシステム</h3><div class="profile-chips">${chips(x.systems)}</div>`:""}${x.roles?.length?`<h3>役割</h3><div class="profile-chips">${chips(x.roles)}</div>`:""}${x.sessionStyles?.length?`<h3>セッションスタイル</h3><div class="profile-chips">${chips(x.sessionStyles)}</div>`:""}${x.availability?`<h3>遊べる時間帯</h3><p style="white-space:pre-wrap">${esc(x.availability)}</p>`:""}${links.length?`<h3>リンク</h3><div style="display:grid;gap:7px">${links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label||l.url)}</a>`).join("")}</div>`:""}${sharedLinks.length?`<div class="profile-public-share"><div class="profile-public-share-title">SAKU+MERU SHARE</div><div class="profile-public-share-list">${sharedLinks.map(l=>`<div class="profile-public-share-item"><a class="badge profile-public-share-link" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label||"共有ページ")}</a>${l.memo?`<div class="profile-public-share-memo">${esc(l.memo)}</div>`:""}</div>`).join("")}</div></div>`:""}</aside>`;

}
function publicProfile(x){const fields=new Set(x.shareFields||[]),p={displayName:x.displayName||""};["socialName","iconUrl","systems","roles","sessionStyles","availability","links"].forEach(k=>{if(fields.has(k))p[k]=x[k]});p.blocks=x.blocks||[];p.sharedLinks=x.sharedLinks||[];return p}
async function shareProfile(){const x=save(false),payload={kind:"profile",version:2,updatedAt:new Date().toISOString(),profile:publicProfile(x)};try{if(!(window.TRPG39Cloud&&TRPG39Cloud.configured()))throw new Error("Supabase設定がありません");let id=localStorage.getItem(SHARE_KEY)||"";if(id&&TRPG39Cloud.updateSharedPage)await TRPG39Cloud.updateSharedPage(id,payload);else{id=await TRPG39Cloud.createSharedPage(payload);localStorage.setItem(SHARE_KEY,id)}const url=new URL("https://sakumeru-share.sakumeru.workers.dev/");url.searchParams.set("id",id);url.searchParams.set("type","profile");url.searchParams.set("v",Date.now().toString(36));if(navigator.clipboard&&window.isSecureContext)try{await navigator.clipboard.writeText(url.href)}catch{}prompt("PROFILE共有URLです。更新しても同じURLを使えます。",url.href)}catch(e){console.error(e);alert("共有URLを作成できませんでした: "+(e.message||e))}}
$("addProfilePage").onclick=addProfilePage;renderProfilePages();
$("addLink").onclick=()=>addLink();$("addSharedLink").onclick=(e)=>{e.preventDefault();const row=addSharedLink();row.querySelector(".shared-label")?.focus();renderPreview()};$("addProfileBlock").onclick=()=>addProfileBlock();$("saveProfile").onclick=()=>save(true);$("shareProfile").onclick=shareProfile;$("chooseIcon").onclick=()=>$("iconFile").click();
$("togglePreview").onclick=()=>{renderPreview();$("previewPanel").hidden=false;$("togglePreview").textContent="プレビューを更新";$("previewPanel").scrollIntoView({behavior:"smooth",block:"start"})};
$("closePreview").onclick=()=>{$("previewPanel").hidden=true;$("togglePreview").textContent="プレビューを表示"};
$("iconFile").addEventListener("change",async()=>{const f=$("iconFile").files?.[0];if(!f)return;try{const data=await imageFileToDataUrl(f);setIconPreview(data,true);$("iconUrl").value="";$("iconFileName").textContent=f.name;renderPreview()}catch(e){console.error(e);alert("画像を読み込めませんでした。")}});
$("clearIcon").onclick=()=>{$("iconFile").value="";$("iconFileName").textContent="未選択";$("iconUrl").value="";setIconPreview("",false);renderPreview()};
$("iconUrl").addEventListener("input",()=>{if($("iconUrl").value.trim())setIconPreview($("iconUrl").value.trim(),false);else if(!$("iconEditorPreview").dataset.dataUrl)setIconPreview("",false);renderPreview()});
document.querySelectorAll("input:not(.link-label):not(.link-url),textarea").forEach(el=>{el.addEventListener(el.type==="checkbox"?"change":"input",renderPreview)});
load();
})();
</script>
