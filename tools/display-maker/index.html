<script>
const q=id=>document.getElementById(id);
const canvas=q("dmCanvas"),ctx=canvas.getContext("2d");
let scenarioImg=null,pcImg=null;

function loadJson(keys,fallback=[]){
 for(const k of keys){
  try{
   const raw=localStorage.getItem(k);
   if(!raw)continue;
   const v=JSON.parse(raw);
   if(Array.isArray(v))return v;
  }catch(e){}
 }
 return fallback;
}
const albums=loadJson([
 "39x2_album_v3",
 "trpg39_album_v3",
 "trpg39_album",
 "39x2_album"
]);
const pcs=loadJson([
 "39x2_pcs_v3",
 "trpg39_pcs_v3",
 "trpg39_pcs",
 "39x2_pcs"
]);


function normTitle(v){return String(v||"").normalize("NFKC").trim().toLowerCase()}
function scenarioKey(r){
 return r.scenarioId ? `id:${r.scenarioId}` : `title:${normTitle(r.title||r.scenarioTitle||"")}`;
}
function runKey(r){
 return String(r.runId||r.eventId||r.id||"");
}
function recordDate(r){return String(r.date||r.start||"").slice(0,10)}
function runLabelFromItems(items=[]){
 const explicit=items.find(x=>String(x.runLabel||"").trim())?.runLabel||"";
 if(explicit)return explicit;
 const dates=items.map(recordDate).filter(Boolean).sort();
 if(dates.length){
   return dates.length>1 && dates[0]!==dates.at(-1)
     ? `${dates[0]}〜${dates.at(-1)}`
     : dates[0];
 }
 return "開催記録";
}
function groupAlbumRows(){
 const rows=discoverAlbumRows();
 const map=new Map();

 rows.forEach(r=>{
   const sk=scenarioKey(r);
   if(!map.has(sk)){
     map.set(sk,{
       key:sk,
       scenarioId:r.scenarioId||"",
       title:r.title||r.scenarioTitle||"無題",
       system:r.system||"",
       runs:new Map()
     });
   }
   const g=map.get(sk);
   if(!g.system&&r.system)g.system=r.system;
   const rk=runKey(r)||`record:${r.id||Math.random()}`;
   if(!g.runs.has(rk))g.runs.set(rk,{id:rk,items:[]});
   g.runs.get(rk).items.push(r);
 });

 return [...map.values()].map(g=>({
   ...g,
   runs:[...g.runs.values()].map(run=>{
     run.items.sort((a,b)=>String(a.start||a.date||"").localeCompare(String(b.start||b.date||"")));
     return {
       ...run,
       label:runLabelFromItems(run.items),
       firstDate:recordDate(run.items[0]||{}),
       lastDate:recordDate(run.items.at(-1)||{})
     };
   }).sort((a,b)=>String(b.lastDate||"").localeCompare(String(a.lastDate||"")))
 })).sort((a,b)=>String(a.title||"").localeCompare(String(b.title||""),"ja"));
}
function populateScenarios(){
 const groups=groupAlbumRows();
 q("scenarioSelect")._groups=groups;
 q("scenarioSelect").innerHTML='<option value="">シナリオを選択</option>'+groups.map((g,i)=>`<option value="${i}">${escapeHtml(g.title)}</option>`).join("");
 q("runSelect").innerHTML='<option value="">陣を選択</option>';
 q("runSelect").disabled=true;
}
function populateRuns(group){
 const runs=group?.runs||[];
 q("runSelect")._runs=runs;
 q("runSelect").innerHTML='<option value="">陣を選択</option>'+runs.map((r,i)=>`<option value="${i}">${escapeHtml(r.label)}</option>`).join("");
 q("runSelect").disabled=!runs.length;
 if(runs.length===1){
   q("runSelect").value="0";
   applyRun(group,runs[0]);
 }
}
function selfRowsFromRecord(r){
 if(Array.isArray(r.selfPcs)&&r.selfPcs.length)return r.selfPcs;
 if(Array.isArray(r.participantRows)){
   const selfish=r.participantRows.filter(x=>x.isSelf||x.self||x.mine);
   if(selfish.length)return selfish;
 }
 return [{pcName:r.pcName||"",ho:r.selfHo||r.ho||"",pcId:r.pcId||""}];
}
function pickSelfPcForRun(run){
 const all=[];
 (run?.items||[]).forEach(r=>selfRowsFromRecord(r).forEach(x=>all.push(x)));
 const seen=new Set(),rows=[];
 all.forEach(x=>{
   const key=`${String(x.pcId||"")}||${String(x.pcName||"")}||${String(x.ho||x.selfHo||"")}`;
   if(seen.has(key))return;
   seen.add(key);rows.push(x);
 });
 return rows[0]||{};
}
function applyRun(group,run){
 if(!group||!run)return;
 const self=pickSelfPcForRun(run);
 q("systemText").value=group.system||run.items?.find(x=>x.system)?.system||"";
 q("titleText").value=group.title||run.items?.[0]?.title||"";
 q("hoText").value=self.ho||self.selfHo||"";
 q("pcText").value=self.pcName||"";
 draw();
}
function firstSelfPcRow(r){
 if(Array.isArray(r.selfPcs)&&r.selfPcs.length)return r.selfPcs[0];
 if(Array.isArray(r.participants)){
   const hit=r.participants.find(x=>x.isSelf||x.self||x.mine);
   if(hit)return hit;
 }
 return {pcName:r.pcName||"",ho:r.selfHo||r.ho||""};
}

function readImage(input,cb){
 const f=input.files?.[0];if(!f){cb(null);return}
 const im=new Image();im.onload=()=>cb(im);im.src=URL.createObjectURL(f);
}
function fitImage(im,x,y,w,h,contain=false){
 if(!im)return;
 const scale=contain?Math.min(w/im.width,h/im.height):Math.max(w/im.width,h/im.height);
 const dw=im.width*scale,dh=im.height*scale;
 ctx.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
}
function draw(){
 const bg=q("bgColor").value||"#151515";
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);

 if(scenarioImg){
   ctx.save();ctx.globalAlpha=.32;fitImage(scenarioImg,0,0,canvas.width,canvas.height,false);
   ctx.restore();
   const g=ctx.createLinearGradient(0,0,canvas.width,0);
   g.addColorStop(0,"rgba(0,0,0,.82)");g.addColorStop(.62,"rgba(0,0,0,.45)");g.addColorStop(1,"rgba(0,0,0,.15)");
   ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
 }
 if(pcImg)fitImage(pcImg,720,30,450,620,true);

 ctx.fillStyle="#fff";
 ctx.textBaseline="top";
 ctx.font='28px sans-serif';ctx.fillText(q("systemText").value||"",70,100);
 ctx.font='bold 58px sans-serif';
 wrapText(q("titleText").value||"",70,155,660,72,2);
 ctx.font='30px sans-serif';ctx.fillText(q("hoText").value||"",70,360);
 ctx.font='bold 42px sans-serif';ctx.fillText(q("pcText").value||"",70,410);
}
function wrapText(text,x,y,maxWidth,lineHeight,maxLines=2){
 const chars=[...String(text||"")];let line="",lines=[];
 for(const ch of chars){
  const test=line+ch;
  if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch;if(lines.length>=maxLines)break}
  else line=test;
 }
 if(lines.length<maxLines&&line)lines.push(line);
 lines.slice(0,maxLines).forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));
}
["systemText","titleText","hoText","pcText","bgColor"].forEach(id=>q(id).addEventListener("input",draw));
q("scenarioImage").onchange=()=>readImage(q("scenarioImage"),im=>{scenarioImg=im;draw()});
q("pcImage").onchange=()=>readImage(q("pcImage"),im=>{pcImg=im;draw()});
q("redraw").onclick=draw;
q("savePng").onclick=()=>{
 const a=document.createElement("a");
 a.download=(q("titleText").value||"display")+".png";
 a.href=canvas.toDataURL("image/png");a.click();
};
q("scenarioSelect").onchange=()=>{
 const group=q("scenarioSelect")._groups?.[Number(q("scenarioSelect").value)];
 if(!group){
   q("runSelect").innerHTML='<option value="">陣を選択</option>';
   q("runSelect").disabled=true;
   return;
 }
 populateRuns(group);
};
q("runSelect").onchange=()=>{
 const group=q("scenarioSelect")._groups?.[Number(q("scenarioSelect").value)];
 const run=q("runSelect")._runs?.[Number(q("runSelect").value)];
 applyRun(group,run);
};
populateScenarios();draw();
</script>
</body></html>
