<main><div class="wrap">
<div class="hero"><h2>DISPLAY MAKER</h2><p>卓記録から、卓報告用ディスプレイをサクッと作ります。</p></div>
<div class="dm-layout">
<section class="card dm-panel dm-control-panel">
 <div class="dm-field"><label>シナリオ検索</label><input id="scenarioSearch" placeholder="タイトルの一部を入力"></div>
 <div class="dm-field"><label>シナリオ</label><select id="scenarioSelect"><option value="">シナリオを選択</option></select></div>
 <div class="dm-field"><label>陣</label><select id="runSelect" disabled><option value="">陣を選択</option></select></div>
 <div id="dataStatus" class="dm-note"></div>
 <div class="dm-field"><label>システム</label><input id="systemText"></div>
 <div class="dm-field"><label>シナリオ名</label><input id="titleText"></div>
 <div class="dm-row">
  <div class="dm-field"><label>HO</label><input id="hoText"></div>
  <div class="dm-field"><label>PC名</label><input id="pcText"></div>
 </div>
 <div class="dm-field"><label>背景</label><input id="bgColor" type="color" value="#151515"></div>
 <div class="dm-field"><label>シナリオ画像</label><input id="scenarioImage" type="file" accept="image/*"></div>
 <div class="dm-field"><label>PC立ち絵</label><input id="pcImage" type="file" accept="image/*"></div>
 <div class="dm-row dm-actions">
   <button type="button" id="redraw">プレビュー更新</button>
   <button type="button" id="savePng">PNG保存</button>
 </div>
 <div class="dm-note">v0.2.3：シナリオ検索 → シナリオ選択 → 陣選択に対応しました。画像はまず手動選択です。次段階でSCENARIO画像・PC立ち絵の自動候補とドラッグ配置を追加できます。</div>
</section>

<script src="../../assets/js/main.js?v=0292"></script>
<script>
const q=id=>document.getElementById(id);
const canvas=q("dmCanvas"),ctx=canvas.getContext("2d");
let scenarioImg=null,pcImg=null;

function loadJson(keys,fallback=[]){
 for(const k of keys){
  try{
   const raw=localStorage.getItem(k);
   if(!raw)continue;
   const v=JSON.parse(raw);
   if(Array.isArray(v))return v;
  }catch(e){}
 }
 return fallback;
}
const albums=loadJson([
 "39x2_album_v3",
 "trpg39_album_v3",
 "trpg39_album",
 "39x2_album"
]);
const pcs=loadJson([
 "39x2_pcs_v3",
 "trpg39_pcs_v3",
 "trpg39_pcs",
 "39x2_pcs"
]);



function discoverAlbumRows(){
 if(albums.length)return albums;
 for(let i=0;i<localStorage.length;i++){
   const key=localStorage.key(i);
   try{
     const v=JSON.parse(localStorage.getItem(key));
     if(!Array.isArray(v)||!v.length)continue;
     const sample=v.find(x=>x&&typeof x==="object");
     if(sample && ("runId" in sample || "scenarioId" in sample) && ("title" in sample || "scenarioTitle" in sample)){
       return v;
     }
   }catch(e){}
 }
 return [];
}
function escapeHtml(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
   "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function normTitle(v){return String(v||"").normalize("NFKC").replace(/\s+/g,"").toLowerCase()}
function scenarioKey(r){return r.scenarioId?`id:${r.scenarioId}`:`title:${normTitle(r.title||r.scenarioTitle||"")}`}
function runKey(r){return String(r.runId||"").trim()}

function groupRows(){
 const rows=discoverAlbumRows();
 const scenarios=new Map();
 rows.forEach((r,index)=>{
   const title=r.title||r.scenarioTitle||"無題";
   const sk=scenarioKey(r);
   if(!scenarios.has(sk))scenarios.set(sk,{title,scenarioId:r.scenarioId||"",system:r.system||"",runs:new Map()});
   const sg=scenarios.get(sk);
   if(!sg.system&&r.system)sg.system=r.system;

   // LIBRARYのrunIdが同じ開催記録を同一陣としてまとめる。
   // runIdが無い旧記録だけは1開催=1陣として安全側に倒す。
   const rk=runKey(r)||`legacy:${r.id||index}`;
   if(!sg.runs.has(rk))sg.runs.set(rk,{runId:rk,items:[]});
   sg.runs.get(rk).items.push(r);
 });
 return [...scenarios.values()].map(sg=>{
   const runs=[...sg.runs.values()].map(run=>{
     run.items.sort((a,b)=>String(a.start||a.date||"").localeCompare(String(b.start||b.date||"")));
     const first=run.items[0]||{}, last=run.items.at(-1)||{};
     const label=String(first.runLabel||first.runName||"").trim()
       || (run.runId.startsWith("legacy:")
           ? (String(first.date||first.start||"").slice(0,10)||"開催記録")
           : `陣 ${String(first.date||first.start||"").slice(0,10)}`.trim());
     return {...run,label,lastDate:String(last.date||last.start||"").slice(0,10)};
   }).sort((a,b)=>String(b.lastDate).localeCompare(String(a.lastDate)));
   return {...sg,runs};
 }).sort((a,b)=>a.title.localeCompare(b.title,"ja"));
}
function renderScenarioOptions(){
 const groups=q("scenarioSelect")._allGroups||[];
 const term=String(q("scenarioSearch")?.value||"").normalize("NFKC").trim().toLowerCase();
 const rows=term?groups.filter(g=>String(g.title||"").normalize("NFKC").toLowerCase().includes(term)):groups;
 q("scenarioSelect")._groups=rows;
 q("scenarioSelect").innerHTML='<option value="">シナリオを選択</option>'+rows.map((g,i)=>`<option value="${i}">${escapeHtml(g.title)}</option>`).join("");
 q("runSelect").innerHTML='<option value="">陣を選択</option>';
 q("runSelect").disabled=true;
}
function populate(){
 const groups=groupRows();
 q("scenarioSelect")._allGroups=groups;
 renderScenarioOptions();
 q("dataStatus").textContent=`LIBRARY ${discoverAlbumRows().length}開催記録 ／ ${groups.length}シナリオ`;
}
function populateRuns(group){
 const runs=group?.runs||[];
 q("runSelect")._runs=runs;
 q("runSelect").innerHTML='<option value="">陣を選択</option>'+runs.map((r,i)=>`<option value="${i}">${escapeHtml(r.label)}</option>`).join("");
 q("runSelect").disabled=!runs.length;
 if(runs.length===1){q("runSelect").value="0";applyRun(group,runs[0])}
}
function applyRun(group,run){
 const r=run?.items?.find(x=>x.pcName||x.selfHo||x.ho)||run?.items?.[0];
 if(!r)return;
 const self=firstSelfPcRow(r);
 q("systemText").value=group.system||r.system||"";
 q("titleText").value=group.title||r.title||r.scenarioTitle||"";
 q("hoText").value=self.ho||self.selfHo||r.selfHo||r.ho||"";
 q("pcText").value=self.pcName||r.pcName||"";
 draw();
}
function firstSelfPcRow(r){
 if(Array.isArray(r.selfPcs)&&r.selfPcs.length)return r.selfPcs[0];
 if(Array.isArray(r.participants)){
   const hit=r.participants.find(x=>x.isSelf||x.self||x.mine);
   if(hit)return hit;
 }
 return {pcName:r.pcName||"",ho:r.selfHo||r.ho||""};
}

function readImage(input,cb){
 const f=input.files?.[0];if(!f){cb(null);return}
 const im=new Image();im.onload=()=>cb(im);im.src=URL.createObjectURL(f);
}
function fitImage(im,x,y,w,h,contain=false){
 if(!im)return;
 const scale=contain?Math.min(w/im.width,h/im.height):Math.max(w/im.width,h/im.height);
 const dw=im.width*scale,dh=im.height*scale;
 ctx.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
}
function draw(){
 const bg=q("bgColor").value||"#151515";
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle=bg;ctx.fillRect(0,0,canvas.width,canvas.height);

 if(scenarioImg){
   ctx.save();ctx.globalAlpha=.32;fitImage(scenarioImg,0,0,canvas.width,canvas.height,false);
   ctx.restore();
   const g=ctx.createLinearGradient(0,0,canvas.width,0);
   g.addColorStop(0,"rgba(0,0,0,.82)");g.addColorStop(.62,"rgba(0,0,0,.45)");g.addColorStop(1,"rgba(0,0,0,.15)");
   ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
 }
 if(pcImg)fitImage(pcImg,720,30,450,620,true);

 ctx.fillStyle="#fff";
 ctx.textBaseline="top";
 ctx.font='28px sans-serif';ctx.fillText(q("systemText").value||"",70,100);
 ctx.font='bold 58px sans-serif';
 wrapText(q("titleText").value||"",70,155,660,72,2);
 ctx.font='30px sans-serif';ctx.fillText(q("hoText").value||"",70,360);
 ctx.font='bold 42px sans-serif';ctx.fillText(q("pcText").value||"",70,410);
}
function wrapText(text,x,y,maxWidth,lineHeight,maxLines=2){
 const chars=[...String(text||"")];let line="",lines=[];
 for(const ch of chars){
  const test=line+ch;
  if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch;if(lines.length>=maxLines)break}
  else line=test;
 }
 if(lines.length<maxLines&&line)lines.push(line);
 lines.slice(0,maxLines).forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));
}
["systemText","titleText","hoText","pcText","bgColor"].forEach(id=>q(id).addEventListener("input",draw));
q("scenarioImage").onchange=()=>readImage(q("scenarioImage"),im=>{scenarioImg=im;draw()});
q("pcImage").onchange=()=>readImage(q("pcImage"),im=>{pcImg=im;draw()});
q("redraw").onclick=draw;
q("savePng").onclick=()=>{
 const a=document.createElement("a");
 a.download=(q("titleText").value||"display")+".png";
 a.href=canvas.toDataURL("image/png");a.click();
};
q("scenarioSearch").addEventListener("input",renderScenarioOptions);
q("scenarioSelect").onchange=()=>{
 const g=q("scenarioSelect")._groups?.[Number(q("scenarioSelect").value)];
 if(!g){q("runSelect").innerHTML='<option value="">陣を選択</option>';q("runSelect").disabled=true;return}
 populateRuns(g);
};
q("runSelect").onchange=()=>{
 const g=q("scenarioSelect")._groups?.[Number(q("scenarioSelect").value)];
 const r=q("runSelect")._runs?.[Number(q("runSelect").value)];
 applyRun(g,r);
};
populate();draw();
</script>
</body></html>
