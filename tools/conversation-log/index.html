<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>会話ログ整理｜SAKU+MERU</title>
<script>(()=>{try{const k="trpg39_theme",v=localStorage.getItem(k)||"system",m=(v==="light"||v==="dark")?v:(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.setAttribute("data-theme",m)}catch{}})();</script>
<link rel="stylesheet" href="../../assets/css/style-v0303.css"><link rel="stylesheet" href="../../assets/css/readability.css?v=0908-3">
<script defer src="../../assets/js/common-layout.js?v=0303"></script><script defer src="../../assets/js/theme-v0296.js"></script>
<style>
.conversation-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:16px}.conversation-panel{border:2px solid var(--line);border-radius:12px;padding:15px;background:var(--panel)}.conversation-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.conversation-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.conversation-actions button{width:auto}.conversation-results{display:grid;gap:7px;margin-top:12px;max-height:620px;overflow:auto}.conversation-line{display:grid;grid-template-columns:auto minmax(120px,190px) minmax(0,1fr);gap:8px;align-items:start;padding:8px;border:1px solid var(--line);border-radius:8px}.conversation-line input[type=checkbox]{width:auto;margin-top:10px}.conversation-line input{min-width:0}.conversation-line textarea{min-height:54px;resize:vertical}.conversation-saved{display:grid;gap:8px}.conversation-saved-item{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:9px;padding:10px}.conversation-saved-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.conversation-saved-actions button{width:auto}.status{min-height:1.5em;margin-top:7px;font-weight:700}.source-text{min-height:180px}@media(max-width:820px){.conversation-layout{grid-template-columns:1fr}}@media(max-width:560px){.conversation-grid{grid-template-columns:1fr}.conversation-line{grid-template-columns:auto minmax(0,1fr)}.conversation-line textarea{grid-column:2}}
</style>
</head>
<body><div data-site-header data-active="tools"></div><main><div class="wrap">
<div class="hero"><h2>会話ログ整理</h2><p>ログを独立した原本として保存し、LIBRARYの卓記録へIDで紐付けます。</p></div>
<div class="conversation-layout">
<section class="conversation-panel"><h3>ログ取込・整形</h3>
<input id="editingId" type="hidden"><div class="conversation-grid"><div><label>ログ名</label><input id="logTitle" placeholder="例：1日目ログ"></div><div><label>取込形式</label><select id="sourceType"><option value="cocofolia">ココフォリア</option><option value="text">一般テキスト</option><option value="json">JSON</option></select></div></div>
<label>ログファイル</label><input id="logFile" type="file" accept=".txt,.html,.htm,.json,text/plain,text/html,application/json">
<label>またはテキスト貼付</label><textarea id="sourceText" class="source-text" placeholder="ログ本文を貼り付け"></textarea>
<div class="conversation-actions"><button id="parseLog" type="button">解析</button><button id="clearEditor" type="button">入力をクリア</button></div>
<div class="conversation-grid"><div><label>発言検索</label><input id="lineSearch" type="search" placeholder="話者・本文"></div><div><label>紐付ける卓記録</label><select id="relatedRun"><option value="">紐付けなし</option></select></div></div>
<div id="parseSummary" class="status" role="status"></div><div id="lineResults" class="conversation-results"></div>
<div class="conversation-actions"><button id="saveLog" type="button" disabled>会話ログを保存</button></div><div id="saveStatus" class="status" role="status"></div>
</section>
<aside class="conversation-panel"><h3>保存済み会話ログ</h3><div class="small muted">本文は記事へ複製せず、この保存庫の原本を参照します。</div><div id="savedLogs" class="conversation-saved"></div></aside>
</div><p><a href="../index.html">← TOOLSへ戻る</a></p></div></main><div data-site-footer></div>
<script src="../../assets/js/shared-data.js?v=0303"></script><script src="../../assets/js/conversation-logs.js?v=1"></script>
<script>
(()=>{"use strict";const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let parsedLines=[],sourceFileName="";
function uid(){return crypto.randomUUID?crypto.randomUUID():"cl-"+Date.now()+"-"+Math.random().toString(36).slice(2)}
function parseHtml(raw){const doc=new DOMParser().parseFromString(raw,"text/html"),rows=[];doc.querySelectorAll("p,li,.message,.chatlog__message").forEach((el,i)=>{const speaker=el.querySelector(".name,.speaker,.chatlog__author,span")?.textContent?.trim()||"",clone=el.cloneNode(true);clone.querySelector(".name,.speaker,.chatlog__author,span")?.remove();const text=clone.textContent.trim();if(text)rows.push({id:uid(),speaker,text,kind:/\b(CCB|CC|1D100|D100|成功|失敗|クリティカル|ファンブル)\b/i.test(text)?"dice":"speech",sourceLine:i+1,include:true})});return rows}
function parseText(raw){return String(raw||"").replace(/\r/g,"").split("\n").map((line,i)=>{const text=line.trim();if(!text)return null;let speaker="",body=text,m=text.match(/^\s*(?:\[([^\]]+)\]|([^:：\t]{1,48})[:：\t])\s*(.+)$/);if(m){speaker=(m[1]||m[2]||"").trim();body=(m[3]||"").trim()}const system=/^(system|システム)$/i.test(speaker)||/^(?:\[?system\]?|システム)[：:\s]/i.test(text);return {id:uid(),speaker,text:body,kind:system?"system":/\b(CCB|CC|1D100|D100|成功|失敗|クリティカル|ファンブル)\b/i.test(body)?"dice":"speech",sourceLine:i+1,include:!system}}).filter(Boolean)}
function parseAny(raw){const text=String(raw||"");if(/^\s*</.test(text)&&/<(?:html|p|div|li)\b/i.test(text)){const rows=parseHtml(text);if(rows.length)return rows}if($("sourceType").value==="json"){try{const data=JSON.parse(text),a=Array.isArray(data)?data:(data.messages||data.lines||[]);const rows=a.map((x,i)=>({id:uid(),speaker:String(x.speaker||x.name||x.user||""),text:String(x.text||x.message||x.content||""),kind:String(x.kind||"speech"),sourceLine:i+1,include:true})).filter(x=>x.text);if(rows.length)return rows}catch{}}return parseText(text)}
function renderLines(){const term=$("lineSearch").value.trim().toLowerCase(),visible=parsedLines.map((x,i)=>({x,i})).filter(({x})=>!term||`${x.speaker} ${x.text}`.toLowerCase().includes(term));$("lineResults").innerHTML=visible.length?visible.map(({x,i})=>`<div class="conversation-line" data-line="${i}"><input type="checkbox" data-include="${i}" ${x.include?"checked":""} aria-label="保存対象"><input data-speaker="${i}" value="${esc(x.speaker)}" placeholder="発言者"><textarea data-text="${i}" aria-label="発言本文">${esc(x.text)}</textarea></div>`).join(""):'<div class="small muted">表示する発言はありません。</div>';$("lineResults").querySelectorAll("[data-include]").forEach(x=>x.onchange=()=>parsedLines[Number(x.dataset.include)].include=x.checked);$("lineResults").querySelectorAll("[data-speaker]").forEach(x=>x.oninput=()=>parsedLines[Number(x.dataset.speaker)].speaker=x.value);$("lineResults").querySelectorAll("[data-text]").forEach(x=>x.oninput=()=>parsedLines[Number(x.dataset.text)].text=x.value);const included=parsedLines.filter(x=>x.include).length;$("parseSummary").textContent=`検出 ${parsedLines.length}行 ／ 保存対象 ${included}行`;$("saveLog").disabled=!included}
function runs(){const album=window.TRPG39?.loadAlbum?.()||[],map=new Map();album.forEach(x=>{const id=String(x.runId||x.id||"");if(!id)return;if(!map.has(id))map.set(id,{id,title:x.title||"名称未設定",label:x.runLabel||"",albumIds:[],eventIds:[]});const row=map.get(id);if(x.id)row.albumIds.push(String(x.id));if(x.eventId)row.eventIds.push(String(x.eventId))});return [...map.values()].sort((a,b)=>`${a.title}${a.label}`.localeCompare(`${b.title}${b.label}`,"ja"))}
function loadRuns(){const rows=runs(),wanted=new URLSearchParams(location.search).get("runId")||"";$("relatedRun").innerHTML='<option value="">紐付けなし</option>'+rows.map(x=>`<option value="${esc(x.id)}" ${x.id===wanted?"selected":""}>${esc(x.title)}${x.label?`／${esc(x.label)}`:""}</option>`).join("")}
async function renderSaved(){const rows=await SAKUMERUConversationLogs.all();$("savedLogs").innerHTML=rows.length?rows.map(x=>`<div class="conversation-saved-item"><strong>${esc(x.title)}</strong><div class="small muted">${x.processed?.lines?.length||0}行 ／ 更新 ${esc(String(x.updatedAt||"").slice(0,16).replace("T"," "))}</div><div class="small">卓記録：${x.runIds?.length?esc(x.runIds.join("、")):"未設定"}</div><div class="conversation-saved-actions"><button data-edit="${esc(x.id)}">編集</button><button class="danger" data-delete="${esc(x.id)}">削除</button></div></div>`).join(""):'<div class="small muted">保存済みログはありません。</div>';$("savedLogs").querySelectorAll("[data-edit]").forEach(b=>b.onclick=async()=>{const x=await SAKUMERUConversationLogs.get(b.dataset.edit);if(!x)return;$("editingId").value=x.id;$("logTitle").value=x.title;$("sourceType").value=x.sourceType||"text";$("sourceText").value=x.rawText||"";$("relatedRun").value=x.runIds?.[0]||"";sourceFileName=x.source?.fileName||"";parsedLines=(x.processed?.lines||[]).map(v=>({...v,include:true}));renderLines();scrollTo({top:0,behavior:"smooth"})});$("savedLogs").querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{if(!confirm("この会話ログ原本を削除しますか？\nLIBRARYの記事や卓記録自体は削除されません。"))return;await SAKUMERUConversationLogs.remove(b.dataset.delete);await renderSaved()})}
function clear(){$("editingId").value="";$("logTitle").value="";$("sourceText").value="";$("logFile").value="";parsedLines=[];sourceFileName="";renderLines();$("saveStatus").textContent=""}
$("logFile").onchange=async()=>{const file=$("logFile").files?.[0];if(!file)return;sourceFileName=file.name;$("sourceText").value=await file.text();parsedLines=parseAny($("sourceText").value);if(!$("logTitle").value)$("logTitle").value=file.name.replace(/\.[^.]+$/,"");renderLines()};$("parseLog").onclick=()=>{parsedLines=parseAny($("sourceText").value);renderLines()};$("lineSearch").oninput=renderLines;$("clearEditor").onclick=clear;
$("saveLog").onclick=async()=>{const kept=parsedLines.filter(x=>x.include&&x.text.trim()).map(({include,...x})=>x);if(!kept.length)return;const old=$("editingId").value?await SAKUMERUConversationLogs.get($("editingId").value):null,runId=$("relatedRun").value,run=runs().find(x=>x.id===runId);const row=await SAKUMERUConversationLogs.put({...old,id:old?.id||uid(),title:$("logTitle").value.trim()||"会話ログ",sourceType:$("sourceType").value,source:{fileName:sourceFileName,importedAt:old?.source?.importedAt||new Date().toISOString(),lineCount:parsedLines.length},rawText:$("sourceText").value,processed:{lines:kept,excludedCount:parsedLines.length-kept.length,speakers:[...new Set(kept.map(x=>x.speaker).filter(Boolean))]},runIds:runId?[runId]:[],albumIds:run?.albumIds||[],eventIds:run?.eventIds||[],createdAt:old?.createdAt});$("editingId").value=row.id;$("saveStatus").textContent="保存しました。LIBRARYでは卓記録を開いた時だけ本文を読み込みます。";await renderSaved()};
loadRuns();renderLines();renderSaved().catch(e=>{$("savedLogs").textContent=e.message;console.error(e)});
})();
</script><script src="../../assets/js/main.js?v=0292"></script></body></html>
