<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SETTINGS｜SAKU+MERU</title>
<meta name="description" content="「一緒に」探す・遊ぶ・記録・共有。卓のあれこれをサクッとまとめるサイト。">

<meta property="og:title" content="SAKU+MERU">
<meta property="og:description" content="「一緒に」探す・遊ぶ・記録・共有。卓のあれこれをサクッとまとめるサイト。">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="SAKU+MERU">
<meta name="twitter:description" content="「一緒に」探す・遊ぶ・記録・共有。卓のあれこれをサクッとまとめるサイト。">
<script>
(()=>{try{const k="trpg39_theme",v=localStorage.getItem(k)||"system",m=(v==="light"||v==="dark")?v:(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"),r=document.documentElement;r.setAttribute("data-theme",m);r.setAttribute("data-theme-mode",v);r.classList.remove("theme-light","theme-dark");r.classList.add(m==="light"?"theme-light":"theme-dark");r.style.colorScheme=m;}catch(e){}})();
</script>
<link rel="stylesheet" href="../assets/css/style-v0306.css">
<script defer src="../assets/js/common-layout.js?v=0303"></script>
<script defer src="../assets/js/theme-v0296.js"></script>
<script src="../assets/js/optional-features.js?v=0292" defer></script>
<script src="../assets/js/beta-gate.js?v=02316"></script>
<script src="../assets/js/beta-gate-ui.js?v=0306"></script>
</head>
<body>
<div data-site-header data-active="settings"></div>
<main>
  <div class="wrap">
    <div class="hero">
      <h2>SETTINGS</h2>
      <p>SAKU+MERUで使う機能を自分に合わせて設定できます。</p>
    </div>

    <section class="panel">
      <h2>機能設定</h2>

      <label class="compact-option" style="display:flex;gap:8px;align-items:center">
        <input type="checkbox" id="playersFeatureToggle" style="width:auto">
        PLAYERS管理を使う
      </label>
      <p class="small muted">
        ONにすると、LIBRARYの同卓者をPLAYERSとして管理・リンクできます。
        OFFの場合も、同卓者名は通常のテキストとして記録されます。
      </p>

      <hr style="margin:18px 0;border:0;border-top:1px solid var(--line)">
      <label for="selfSocialName"><strong>自分のSNS表示名</strong></label>
      <input id="selfSocialName" placeholder="例：ご自身のHN">
      <p class="small muted">X卓報告だけで「自分」の代わりに使います。空欄なら「自分」のままです。</p>
      <button id="saveSelfSocialName" type="button">保存</button>
      <p id="settingsStatus" class="small" aria-live="polite"></p>
    </section>
  </div>
</main>
<div data-site-footer></div>

<script src="../assets/js/main.js?v=0292"></script>
<script src="../assets/js/shared-data.js?v=0292"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  const KEY="39x2_players_enabled_v1";
  const toggle=document.getElementById("playersFeatureToggle");
  const status=document.getElementById("settingsStatus");
  const social=document.getElementById("selfSocialName"),saveSocial=document.getElementById("saveSelfSocialName"),SOCIAL_KEY="39x2_self_sns_name_v1";
  if(social)social.value=localStorage.getItem(SOCIAL_KEY)||"";
  if(saveSocial)saveSocial.addEventListener("click",()=>{localStorage.setItem(SOCIAL_KEY,social.value.trim());status.textContent="SNS表示名を保存しました。";});
  if(!toggle)return;

  toggle.checked=localStorage.getItem(KEY)==="1";

  toggle.addEventListener("change",()=>{
    localStorage.setItem(KEY,toggle.checked?"1":"0");

    if(window.TRPG39?.setPlayersEnabled){
      TRPG39.setPlayersEnabled(toggle.checked);
    }else{
      window.dispatchEvent(new CustomEvent("39x2:players-setting",{
        detail:{enabled:toggle.checked}
      }));
    }

    window.TRPG39OptionalFeatures?.apply?.();

    status.textContent=toggle.checked
      ?"PLAYERS管理をONにしました。"
      :"PLAYERS管理をOFFにしました。";
  });
});
</script>
</body>
</html>
