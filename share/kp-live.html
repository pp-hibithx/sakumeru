<script>
(async()=>{
 const box=document.getElementById("kpLiveContent");
 const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const sanitizeRichHtml=input=>{
   const tpl=document.createElement("template");tpl.innerHTML=String(input||"");
   const allowed=new Set(["DIV","SECTION","P","BR","STRONG","B","EM","I","U","S","UL","OL","LI","BLOCKQUOTE","A","SPAN","H1","H2","H3","H4","HR","FONT","MARK","CODE","PRE","TABLE","THEAD","TBODY","TR","TH","TD"]);
   const safeColor=v=>{v=String(v||"").trim();return /^(#[0-9a-f]{3,8}|rgba?\([\d\s.,%]+\)|hsla?\([\d\s.,%]+\)|[a-z]{3,20})$/i.test(v)?v:""};
   const safeAlign=v=>["left","center","right","justify"].includes(String(v||"").toLowerCase())?String(v).toLowerCase():"";
   const clean=node=>{
     [...node.childNodes].forEach(child=>{
       if(child.nodeType===Node.TEXT_NODE)return;
       if(child.nodeType!==Node.ELEMENT_NODE){child.remove();return}
       if(!allowed.has(child.tagName)){
         const frag=document.createDocumentFragment();
         while(child.firstChild)frag.appendChild(child.firstChild);
         child.replaceWith(frag);clean(node);return;
       }
       const style=child.getAttribute("style")||"",href=child.getAttribute("href")||"",fontColor=child.tagName==="FONT"?(child.getAttribute("color")||""):"";
       const rawClass=child.getAttribute("class")||"";
       const rawKind=child.getAttribute("data-kind")||"";
       [...child.attributes].forEach(a=>child.removeAttribute(a.name));
       if(child.tagName==="A"&&/^https?:\/\//i.test(href)){child.setAttribute("href",href);child.setAttribute("target","_blank");child.setAttribute("rel","noopener noreferrer")}
       const classAllow=new Set(["kp-special","kp-special-head","kp-special-title","kp-special-body","kind-chip","dialogue-lines","dialogue-row","dialogue-name","dialogue-text","kp-live-selected-item"]);
       const keptClasses=rawClass.split(/\s+/).filter(c=>classAllow.has(c));
       if(keptClasses.length)child.setAttribute("class",keptClasses.join(" "));
       if(child.tagName==="SECTION"&&keptClasses.includes("kp-special")&&/^(reveal|memo|rp|secret|dialogue)$/.test(rawKind))child.setAttribute("data-kind",rawKind);
       const keep=[];
       if(fontColor){const x=safeColor(fontColor);if(x)keep.push(`color:${x}`)}
       style.split(";").forEach(part=>{
         const i=part.indexOf(":");if(i<0)return;
         const prop=part.slice(0,i).trim().toLowerCase(),val=part.slice(i+1).trim();
         if(prop==="color"){const x=safeColor(val);if(x)keep.push(`color:${x}`)}
         else if(prop==="background-color"||prop==="background"){const x=safeColor(val);if(x)keep.push(`background-color:${x}`)}
         else if(prop==="text-align"){const x=safeAlign(val);if(x)keep.push(`text-align:${x}`)}
         else if(prop==="font-weight" && /^(normal|bold|[1-9]00)$/i.test(val))keep.push(`font-weight:${val}`)
         else if(prop==="font-style" && /^(normal|italic|oblique)$/i.test(val))keep.push(`font-style:${val}`)
         else if(prop==="text-decoration" && /^(none|underline|line-through|underline line-through|line-through underline)$/i.test(val))keep.push(`text-decoration:${val}`)
         else if(prop==="font-size" && /^(\d+(?:\.\d+)?)(px|em|rem|%)$/i.test(val))keep.push(`font-size:${val}`)
         else if(prop==="line-height" && /^(\d+(?:\.\d+)?)(px|em|rem|%)?$/i.test(val))keep.push(`line-height:${val}`)
       });
       if(keep.length)child.setAttribute("style",keep.join(";"));
       clean(child);
     });
   };
   clean(tpl.content);return tpl.innerHTML;
 };
 const richText=s=>{
   const raw=String(s||"");
   if(/<\s*\/?\s*(div|section|p|br|strong|b|em|i|u|s|ul|ol|li|blockquote|a|span|h1|h2|h3|h4|hr|font|mark|code|pre|table|thead|tbody|tr|th|td)\b/i.test(raw))return sanitizeRichHtml(raw);
   return esc(raw).replace(/\n/g,"<br>");
 };
 const id=new URLSearchParams(location.search).get("id")||location.hash.replace(/^#/,"");
 if(!id){box.innerHTML='<div class="kp-share-empty">共有IDがありません。</div>';return}
 try{
   const raw=await TRPG39Cloud.getSharedPage(id);
   if(raw==null)throw new Error("共有データが見つかりません");

   const parseMaybeJson=v=>{
     if(typeof v!=="string")return v;
     try{return JSON.parse(v)}catch(_){return v}
   };
   let p=parseMaybeJson(raw);

   // Supabase RPC / old share implementations may wrap JSON differently.
   // Unwrap only known container shapes; keep the actual KP payload unchanged.
   for(let n=0;n<4;n++){
     if(Array.isArray(p) && p.length===1){p=parseMaybeJson(p[0]);continue}
     if(p && typeof p==="object"){
       if(p.kind==="kp-live-share")break;
       if("data" in p && p.data!=null){p=parseMaybeJson(p.data);continue}
       if("p_data" in p && p.p_data!=null){p=parseMaybeJson(p.p_data);continue}
       if("payload" in p && p.payload!=null){p=parseMaybeJson(p.payload);continue}
       if("result" in p && p.result!=null){p=parseMaybeJson(p.result);continue}
     }
     break;
   }

   if(!p || typeof p!=="object")throw new Error("共有データを読み取れませんでした");
   if(p.kind!=="kp-live-share")throw new Error("KP共有データではありません");

   let items=parseMaybeJson(p.items);
   if(!Array.isArray(items))items=[];
   const sceneItems=items.filter(x=>x?.kind==="outline-scene"&&x?.sceneId);
   if(sceneItems.length){
     const byScene=new Map();
     for(const x of sceneItems){
       const key=String(x.sceneId),prev=byScene.get(key);
       if(!prev||String(x.updatedAt||x.revealedAt||"")>=String(prev.updatedAt||prev.revealedAt||""))byScene.set(key,x);
     }
     const sceneIds=new Set(byScene.keys());
     const sceneTitles=new Set([...byScene.values()].map(x=>String(x.title||"").trim()).filter(Boolean));
     items=items.filter(x=>{
       if(x?.kind==="outline-scene"&&x?.sceneId)return byScene.get(String(x.sceneId))===x;
       if(x?.kind==="outline-group"&&x?.source==="outline")return false;
       if(x?.sceneId&&sceneIds.has(String(x.sceneId)))return false;
       if(!x?.sceneId&&x?.sceneTitle&&sceneTitles.has(String(x.sceneTitle).trim()))return false;
       return true;
     });
   }

   const itemId=(x,i)=>"kp-item-"+String(x?.id||i+1).replace(/[^a-zA-Z0-9_-]/g,"-");
   const meaningfulTitle=x=>{const t=String(x?.title||"").trim();return t&&t!=="開示情報"?t:""};
   const tocItems=items.map((x,i)=>({x,i,title:meaningfulTitle(x)})).filter(v=>v.title);
   const toc=tocItems.length?`<nav class="kp-live-toc"><div class="kp-live-toc-head"><strong>目次</strong><div class="kp-live-tools"><button type="button" class="secondary" id="kpOpenAll">すべて開く</button><button type="button" class="secondary" id="kpCloseAll">すべて閉じる</button></div></div><ol>${tocItems.map(({x,i,title})=>`<li><a href="#${itemId(x,i)}">${esc(title)}</a></li>`).join("")}</ol></nav>`:"";
   const renderImages=images=>Array.isArray(images)&&images.length?`<div class="kp-live-images" style="--image-cols:${Math.min(4,images.length)}">${images.map(src=>`<img src="${esc(src)}" alt="" loading="lazy" data-kp-zoom>`).join("")}</div>`:"";
   const normalizeShareHtml=html=>String(html||"")
     .replace(/\s+/g," ")
     .replace(/>\s+</g,"><")
     .trim();
   const normalizedBlockKey=block=>{
     // IDs can legitimately differ when the same editor content has passed through
     // the old and new reveal collectors.  KPlive is a PL-facing view, so content
     // is the authoritative dedupe key; use the id only when the block is empty.
     const html=normalizeShareHtml(block?.bodyHtml||"");
     const images=(Array.isArray(block?.images)?block.images:[]).map(String).join("|");
     if(html||images)return `body:${html}|images:${images}`;
     return `id:${String(block?.id||"").trim()}`;
   };
   const dedupeBlocks=blocks=>{
     const seen=new Set();
     return (Array.isArray(blocks)?blocks:[]).filter(block=>{
       const key=normalizedBlockKey(block);
       if(seen.has(key))return false;
       seen.add(key);
       return true;
     });
   };
   const renderOutlineChildren=children=>{
     const seenChildren=new Set();
     const ordered=[...(Array.isArray(children)?children:[])].sort((a,z)=>{
       const ao=Number.isFinite(Number(a?.displayOrder))?Number(a.displayOrder):Number.MAX_SAFE_INTEGER;
       const zo=Number.isFinite(Number(z?.displayOrder))?Number(z.displayOrder):Number.MAX_SAFE_INTEGER;
       return ao-zo;
     });
     return ordered.map(child=>{
       const blocks=dedupeBlocks(child.blocks).sort((a,z)=>{
         const ao=Number.isFinite(Number(a?.sourceOrder))?Number(a.sourceOrder):Number.MAX_SAFE_INTEGER;
         const zo=Number.isFinite(Number(z?.sourceOrder))?Number(z.sourceOrder):Number.MAX_SAFE_INTEGER;
         return ao-zo;
       });
       const title=String(child.title||"").trim();
       const childKey=`${title}::${blocks.map(normalizedBlockKey).join("||")}`;
       if(seenChildren.has(childKey))return "";
       seenChildren.add(childKey);
       // Each shared unit is rendered in the same order as KP BINDER.  Image grids
       // stay between the surrounding paragraphs/list items instead of being folded
       // into a gallery at the end of a legacy HTML snapshot.
       const body=blocks.map(block=>`<div class="kp-live-outline-block">${richText(block.bodyHtml||"")}${renderImages(block.images)}</div>`).join("");
       return title
         ? `<details class="kp-live-outline-child kp-live-grandchild-toggle" data-level="grandchild"><summary>${esc(title)}</summary><div class="kp-live-grandchild-content">${body}</div></details>`
         : `<section class="kp-live-outline-child is-untitled" data-level="grandchild">${body}</section>`;
     }).join("");
   };
   const renderOutlineGroup=x=>renderOutlineChildren(x.outlineChildren);
   const normLabel=s=>String(s||"").replace(/\s+/g," ").trim();
   const renderSceneLegacyItems=(legacyItems,outlineGroups=[])=>{
     const outlineIds=new Set((Array.isArray(outlineGroups)?outlineGroups:[])
       .map(g=>String(g?.id||""))
       .filter(Boolean));
     const outlineTitles=new Set((Array.isArray(outlineGroups)?outlineGroups:[])
       .map(g=>normLabel(g?.title))
       .filter(Boolean));
     const outlineContent=new Set();
     for(const group of (Array.isArray(outlineGroups)?outlineGroups:[])){
       for(const child of (Array.isArray(group?.outlineChildren)?group.outlineChildren:[])){
         for(const block of (Array.isArray(child?.blocks)?child.blocks:[])){
           outlineContent.add(normalizedBlockKey(block));
         }
       }
     }
     const legacySeen=new Set();
     return (Array.isArray(legacyItems)?legacyItems:[])
       .filter(item=>{
         const id=String(item?.id||"");
         // New outline sharing stores a special block as `special:<blockId>`.
         // If that counterpart exists, the legacy snapshot is the same reveal and must not be rendered twice.
         if(id && outlineIds.has(`special:${id}`))return false;
         // Compatibility fallback for very old shares whose block id was not persisted.
         // Only suppress by title when there is exactly one outline group with that title.
         const title=normLabel(meaningfulTitle(item));
         if(title){
           const matches=(Array.isArray(outlineGroups)?outlineGroups:[]).filter(g=>normLabel(g?.title)===title);
           if(matches.length===1 && outlineTitles.has(title))return false;
         }
         // Old snapshots and modern outline blocks may have unrelated IDs/titles even
         // though their actual PL-visible body is identical.  Compare the rendered
         // content as a final compatibility guard.
         const contentKey=normalizedBlockKey({bodyHtml:item?.bodyHtml??item?.body??"",images:item?.images});
         if(outlineContent.has(contentKey))return false;
         if(legacySeen.has(contentKey))return false;
         legacySeen.add(contentKey);
         return true;
       })
       .map(item=>{
         const title=meaningfulTitle(item)||"開示情報";
         return `<details class="kp-live-scene-group kp-live-group-toggle kp-live-scene-legacy"><summary>${esc(title)}</summary><div class="kp-live-group-content"><div class="kp-live-outline-block">${richText(item.bodyHtml??item.body??"")}${renderImages(item.images)}</div></div></details>`;
       }).join("");
   };
   const renderOutlineScene=x=>{
     const groups=(Array.isArray(x.outlineGroups)?[...x.outlineGroups]:[]).sort((a,z)=>{
       const ao=Number.isFinite(Number(a?.displayOrder))?Number(a.displayOrder):Number.MAX_SAFE_INTEGER;
       const zo=Number.isFinite(Number(z?.displayOrder))?Number(z.displayOrder):Number.MAX_SAFE_INTEGER;
       return ao-zo;
     });
     const sceneTitle=normLabel(x.title);
     // A refreshed scene's outline is the authoritative representation.  Legacy
     // full-HTML is only a compatibility fallback for scenes that have no outline yet.
     const legacy=groups.length?"":renderSceneLegacyItems(x.legacyItems,groups);
     const seenGroups=new Set();
     const outline=groups.map(group=>{
       const title=normLabel(group.title);
       const childrenHtml=renderOutlineChildren(group.outlineChildren);
       const groupKey=`${title}::${childrenHtml.replace(/\s+/g," ").trim()}`;
       if(seenGroups.has(groupKey))return "";
       seenGroups.add(groupKey);
       // Scene and H2 are deliberately separate disclosure levels on KPlive:
       // scene -> big heading/title -> child content.  Even when their labels match,
       // the nested toggle makes the hierarchy explicit instead of looking duplicated.
       const groupTitle=title||"開示情報";
       return `<details class="kp-live-scene-group kp-live-group-toggle"><summary>${esc(groupTitle)}</summary><div class="kp-live-group-content">${childrenHtml}</div></details>`;
     }).join("");
     return legacy+outline;
   };
   const cards=items.length?items.map((x,i)=>{
     const latest=i===items.length-1;
     const title=meaningfulTitle(x)||(["outline-group","outline-scene"].includes(x.kind)?"共有情報":"開示情報");
     const html=x.kind==="outline-scene"?renderOutlineScene(x):x.kind==="outline-group"?renderOutlineGroup(x):richText(x.bodyHtml??x.body??"")+renderImages(x.images);
     return `<details class="kp-live-item" data-kind="${esc(x.kind||"reveal")}" data-scene-id="${esc(x.sceneId||"")}" id="${itemId(x,i)}" ${latest?"open":""}>
       <summary><span class="kp-live-summary-main"><strong>${esc(title)}</strong></span></summary>
       <div class="kp-live-body">${html}</div>
     </details>`;
   }).join(""):'<div class="kp-share-empty">まだ開示された情報はありません。</div>';
   box.innerHTML=`<article class="kp-live"><h2>${esc(p.title||"セッション共有")}</h2><p class="small muted">KPから開示された情報です。左の目次から情報へ移動できます。</p><div class="kp-live-layout"><aside class="kp-live-sidebar">${toc}</aside><main class="kp-live-main">${cards}</main></div></article>`;
   document.getElementById("kpOpenAll")?.addEventListener("click",()=>box.querySelectorAll(".kp-live-item,.kp-live-group-toggle,.kp-live-grandchild-toggle").forEach(d=>d.open=true));
   document.getElementById("kpCloseAll")?.addEventListener("click",()=>box.querySelectorAll(".kp-live-item,.kp-live-group-toggle,.kp-live-grandchild-toggle").forEach(d=>d.open=false));

   const lightbox=document.getElementById("kpImageLightbox");
   const lightboxImg=document.getElementById("kpImageLightboxImg");
   const closeLightbox=()=>{if(lightbox)lightbox.hidden=true;if(lightboxImg)lightboxImg.removeAttribute("src")};
   box.addEventListener("click",e=>{
     const img=e.target.closest?.(".kp-live-images img,[data-kp-zoom]");
     if(!img||!lightbox||!lightboxImg)return;
     lightboxImg.src=img.currentSrc||img.src;
     lightbox.hidden=false;
   });
   document.getElementById("kpImageLightboxClose")?.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();closeLightbox()});
   lightbox?.addEventListener("click",e=>{if(e.target===lightbox)closeLightbox()});
   document.addEventListener("keydown",e=>{if(e.key==="Escape"&&lightbox&&!lightbox.hidden)closeLightbox()});
 }catch(e){
   console.error(e);box.innerHTML=`<div class="kp-share-empty">共有ページを読み込めませんでした。<br><span class="small">${esc(e.message||e)}</span></div>`;
 }
})();
</script>
</body>
</html>
